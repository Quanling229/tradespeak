<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeSpeak · 外贸情景英语</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#252820;--ink2:#4c4e46;--ink3:#8a8d80;--green:#3d5a45;--green2:#7a9e7e;--green-soft:rgba(122,158,126,.12);--gold:#b08a4f;--gold-soft:rgba(176,138,79,.12);--line:rgba(37,40,32,.09);--serif:"Noto Serif SC","Songti SC",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--shadow:0 2px 14px rgba(37,40,32,.07);--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.container{max-width:960px;margin:0 auto;padding:0 20px}
.header{position:sticky;top:0;z-index:50;background:rgba(247,245,239,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink);cursor:pointer}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--green);color:#f5f1e8;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:bold;font-size:18px}
.nav{display:flex;gap:6px}
.nav-btn{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--ink2);transition:all .2s}
.nav-btn:hover{background:var(--green-soft);color:var(--green)}
.nav-btn.active{background:var(--green);color:#fff}
.hero{padding:80px 0 60px;text-align:center}
.hero-tag{display:inline-block;padding:6px 16px;border-radius:20px;background:var(--green-soft);color:var(--green);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.hero h1{font-family:var(--serif);font-size:clamp(36px,6vw,56px);font-weight:700;line-height:1.2;margin-bottom:20px}
.hero h1 .accent{color:var(--green)}
.hero-desc{max-width:560px;margin:0 auto 40px;color:var(--ink2);font-size:16px;line-height:1.8}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:600;transition:all .2s;border:none;cursor:pointer}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#2d4535;transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn-outline:hover{background:var(--green-soft)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:60px}
.feature-card{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:all .3s;border:1px solid var(--line);cursor:pointer}
.feature-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(37,40,32,.1)}
.feature-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
.feature-card h3{font-size:18px;font-weight:700;margin-bottom:8px}
.feature-card p{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:12px}
.feature-card .link{font-size:14px;color:var(--green);font-weight:600}
.section{padding:60px 0}
.section-title{font-family:var(--serif);font-size:28px;font-weight:700;margin-bottom:8px}
.section-sub{color:var(--ink2);margin-bottom:32px;font-size:15px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.course-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;transition:all .3s}
.course-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(37,40,32,.1)}
.course-cover{height:120px;display:flex;align-items:flex-end;padding:16px;position:relative}
.course-num{font-family:Georgia,serif;font-size:42px;font-weight:bold;color:rgba(255,255,255,.9);line-height:1}
.course-emoji{position:absolute;top:14px;right:16px;font-size:32px}
.course-body{padding:18px}
.course-title{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.4}
.course-meta{display:flex;gap:10px;font-size:12px;color:var(--ink3);margin-bottom:10px}
.course-desc{font-size:13px;color:var(--ink2);line-height:1.6}
.course-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-top:10px}
.podcast-list{display:flex;flex-direction:column;gap:14px}
.podcast-item{background:var(--card);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:20px;cursor:pointer;transition:all .2s}
.podcast-item:hover{transform:translateX(3px)}
.podcast-num{width:48px;height:48px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:bold;font-size:18px;flex-shrink:0}
.podcast-info{flex:1;min-width:0}
.podcast-title{font-size:16px;font-weight:700;margin-bottom:4px}
.podcast-meta{font-size:13px;color:var(--ink3);display:flex;gap:12px}
.podcast-play{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.footer{padding:40px 0;border-top:1px solid var(--line);text-align:center;color:var(--ink3);font-size:13px}
.loading{text-align:center;padding:60px;color:var(--ink3)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.detail-page{padding:40px 0 80px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;margin-bottom:24px;cursor:pointer}
.back-btn:hover{color:var(--green)}
.detail-title{font-family:var(--serif);font-size:clamp(26px,4vw,36px);font-weight:700;margin-bottom:12px;line-height:1.3}
.detail-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink3)}
.block{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.block-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.vocab-item{padding:14px 0;border-bottom:1px solid var(--line)}
.vocab-item:last-child{border-bottom:none}
.vocab-word{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.vocab-word .word{font-size:17px;font-weight:700}
.vocab-word .ipa{font-size:13px;color:var(--ink3);font-family:Georgia,serif}
.vocab-word .speak-btn{margin-left:auto;font-size:18px;color:var(--green);padding:4px 8px;border-radius:6px;cursor:pointer}
.vocab-word .speak-btn:hover{background:var(--green-soft)}
.vocab-cn{font-size:14px;color:var(--ink2);margin-bottom:4px}
.vocab-ex{font-size:13px;color:var(--ink3);font-style:italic;padding-left:12px;border-left:2px solid var(--green-soft)}
.expr-item{padding:14px 0;border-bottom:1px solid var(--line)}
.expr-item:last-child{border-bottom:none}
.expr-en{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:flex-start;gap:8px}
.expr-en .speak-btn{font-size:16px;color:var(--green);padding:2px 6px;border-radius:4px;flex-shrink:0;cursor:pointer}
.expr-cn{font-size:14px;color:var(--ink2);margin-bottom:4px}
.expr-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--green-soft);color:var(--green)}
.dialogue-line{display:flex;gap:12px;margin-bottom:14px}
.dialogue-line:last-child{margin-bottom:0}
.dialogue-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;flex-shrink:0;color:#fff}
.dialogue-avatar.you{background:var(--green)}
.dialogue-avatar.client{background:var(--gold)}
.dialogue-bubble{flex:1;background:var(--bg);border-radius:12px;padding:12px 16px}
.dialogue-bubble .speaker{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.dialogue-bubble .en{font-size:14px;margin-bottom:4px;display:flex;align-items:flex-start;gap:6px}
.dialogue-bubble .en .speak-btn{font-size:14px;color:var(--green);padding:2px 4px;border-radius:4px;flex-shrink:0;cursor:pointer}
.dialogue-bubble .cn{font-size:13px;color:var(--ink2)}
.podcast-player{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:24px}
.podcast-player-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:8px}
.podcast-player-meta{font-size:13px;color:var(--ink3);margin-bottom:20px}
.podcast-lines{display:flex;flex-direction:column;gap:12px}
.podcast-line{display:flex;gap:12px;align-items:flex-start}
.podcast-line-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff;flex-shrink:0}
.podcast-line-avatar.emma{background:#c97b8a}
.podcast-line-avatar.james{background:#5a7a9e}
.podcast-line-content{flex:1;background:var(--bg);border-radius:10px;padding:10px 14px}
.podcast-line .en{font-size:14px;margin-bottom:3px;display:flex;align-items:flex-start;gap:6px}
.podcast-line .en .speak-btn{font-size:14px;color:var(--green);padding:2px 4px;border-radius:4px;flex-shrink:0;cursor:pointer}
.podcast-line .cn{font-size:12px;color:var(--ink2)}
@media(max-width:640px){.hero{padding:50px 0 40px}.section{padding:40px 0}.nav-btn{padding:6px 10px;font-size:13px}.block{padding:18px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var COURSES = [];
var PODCASTS = [];

function $(s) { return document.querySelector(s); }
function el(t, c, h) { var e = document.createElement(t); if(c) e.className = c; if(h !== undefined) e.innerHTML = h; return e; }

function speak(text, opts) {
  if(typeof speechSynthesis === 'undefined') { alert('当前浏览器不支持语音合成'); return; }
  if(!text || !text.trim()) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = (opts && opts.lang) || 'en-US';
  u.rate = (opts && opts.rate) || 0.95;
  u.pitch = (opts && opts.pitch) || 1;
  u.volume = (opts && opts.volume) || 1;
  var vs = speechSynthesis.getVoices();
  var ev = vs.filter(function(v) { return v.lang.startsWith('en'); });
  if(ev.length > 0) {
    u.voice = ev.find(function(v) { return /en[-_](GB|US)/i.test(v.lang); }) || ev[0];
  }
  speechSynthesis.speak(u);
}

function esc(s) { return String(s).replace(/'/g, "\\'"); }

async function loadData() {
  try {
    var res = await fetch('courses.json?v=' + Date.now(), {cache: 'no-store'});
    if(res.ok) {
      var data = await res.json();
      if(data.courses && Array.isArray(data.courses)) {
        data.courses.forEach(function(c) {
          if(!COURSES.find(function(x) { return x.id === c.id; })) COURSES.push(c);
        });
      }
      if(data.podcasts && Array.isArray(data.podcasts)) {
        data.podcasts.forEach(function(p) {
          if(!PODCASTS.find(function(x) { return x.id === p.id; })) PODCASTS.push(p);
        });
      }
    }
  } catch(e) {
    console.warn('courses.json加载失败:', e);
  }
  
  // 尝试加载额外的课程和播客（最多到30）
  var extras = [];
  for(var i = 14; i <= 30; i++) {
    (function(n) {
      extras.push(
        fetch('courses/course-' + n + '.json', {cache: 'no-store'})
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(d) { if(d && d.id && d.title && !COURSES.find(function(x) { return x.id === d.id; })) COURSES.push(d); })
          .catch(function() {})
      );
      extras.push(
        fetch('podcasts/podcast-' + n + '.json', {cache: 'no-store'})
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(d) { if(d && d.id && d.title && !PODCASTS.find(function(x) { return x.id === d.id; })) PODCASTS.push(d); })
          .catch(function() {})
      );
    })(i < 10 ? '0' + i : '' + i);
  }
  
  // 最多等待5秒
  await Promise.race([Promise.all(extras), new Promise(function(r) { setTimeout(r, 5000); })]);
  
  COURSES.sort(function(a, b) { return parseInt(a.num) - parseInt(b.num); });
  PODCASTS.sort(function(a, b) { return parseInt(a.num) - parseInt(b.num); });
  
  return {courses: COURSES.length, podcasts: PODCASTS.length};
}

function courseCard(c) {
  var card = el('div', 'course-card');
  card.onclick = function() { location.hash = '#/course/' + c.id; };
  card.innerHTML = 
    '<div class="course-cover" style="background:linear-gradient(135deg,' + c.color + ',' + c.color + 'cc)">' +
      '<div class="course-num">' + c.num + '</div>' +
      '<div class="course-emoji">' + c.emoji + '</div>' +
    '</div>' +
    '<div class="course-body">' +
      '<div class="course-title">' + c.title + '</div>' +
      '<div class="course-meta"><span>⏱ ' + c.duration + '</span><span>📊 ' + c.level + '</span></div>' +
      '<div class="course-desc">' + c.intro.desc.slice(0, 60) + '...</div>' +
      '<span class="course-tag" style="background:' + c.color + '1a;color:' + c.color + '">' + c.scene + '</span>' +
    '</div>';
  return card;
}

function renderHome() {
  var app = $('#app');
  app.innerHTML = 
    '<header class="header"><div class="container header-inner">' +
      '<div class="logo" onclick="location.hash=\'#/\'"><div class="logo-mark">T</div><div>TradeSpeak</div></div>' +
      '<nav class="nav">' +
        '<button class="nav-btn active" onclick="location.hash=\'#/\'">首页</button>' +
        '<button class="nav-btn" onclick="location.hash=\'#/courses\'">课程库</button>' +
        '<button class="nav-btn" onclick="location.hash=\'#/podcasts\'">播客</button>' +
      '</nav>' +
    '</div></header>' +
    '<section class="hero"><div class="container">' +
      '<div class="hero-tag">Situational Trade English</div>' +
      '<h1>先练真实谈判<br><span class="accent">再背单词</span></h1>' +
      '<p class="hero-desc">专为Quinn定制的外贸情景英语——每一课都围绕你的真实业务：马克笔出口、展会接待、报价谈判、交期沟通。</p>' +
      '<div class="hero-cta">' +
        '<button class="btn btn-primary" onclick="location.hash=\'#/courses\'">进入课程库 →</button>' +
      '</div>' +
    '</div></section>' +
    '<section class="section" style="padding-top:0"><div class="container">' +
      '<div class="cards-grid">' +
        '<div class="feature-card" onclick="location.hash=\'#/courses\'">' +
          '<div class="feature-icon" style="background:var(--green-soft)">🎯</div>' +
          '<h3>真实业务场景</h3>' +
          '<p>课程基于你的产品线与市场：EN71-3认证、MOQ、FOB报价、CDU包装——都是你天天在谈的内容。</p>' +
          '<div class="link">进入课程库 →</div>' +
        '</div>' +
        '<div class="feature-card" onclick="location.hash=\'#/podcasts\'">' +
          '<div class="feature-icon" style="background:var(--gold-soft)">🎙️</div>' +
          '<h3>播客磨耳朵</h3>' +
          '<p>TradeTalk原创播客，Emma和James双主持伦敦腔。整段连播+逐句点击重听+中文字幕。</p>' +
          '<div class="link">去听播客 →</div>' +
        '</div>' +
      '</div>' +
    '</div></section>' +
    '<section class="section" style="padding-top:0"><div class="container">' +
      '<h2 class="section-title">课程库</h2>' +
      '<p class="section-sub">' + COURSES.length + '节系统课 · 每2-3天解锁新课</p>' +
      '<div class="course-grid" id="home-grid"></div>' +
    '</div></section>' +
    '<footer class="footer"><div class="container"><p>TradeSpeak · 专为Quinn定制的外贸情景英语学习系统</p></div></footer>';
  
  var g = $('#home-grid');
  COURSES.slice(0, 6).forEach(function(c) { g.appendChild(courseCard(c)); });
}

function renderCourses() {
  var app = $('#app');
  app.innerHTML = 
    '<header class="header"><div class="container header-inner">' +
      '<div class="logo" onclick="location.hash=\'#/\'"><div class="logo-mark">T</div><div>TradeSpeak</div></div>' +
      '<nav class="nav">' +
        '<button class="nav-btn" onclick="location.hash=\'#/\'">首页</button>' +
        '<button class="nav-btn active">课程库</button>' +
        '<button class="nav-btn" onclick="location.hash=\'#/podcasts\'">播客</button>' +
      '</nav>' +
    '</div></header>' +
    '<div class="container detail-page">' +
      '<h1 class="section-title" style="margin-bottom:8px">课程库</h1>' +
      '<p class="section-sub">' + COURSES.length + '节系统课 · 从开发客户到售后复购的外贸全流程</p>' +
      '<div class="course-grid" id="all-grid"></div>' +
    '</div>' +
    '<footer class="footer"><div class="container"><p>TradeSpeak · 专为Quinn定制</p></div></footer>';
  
  var g = $('#all-grid');
  COURSES.forEach(function(c) { g.appendChild(courseCard(c)); });
}

function renderPodcasts() {
  var app = $('#app');
  app.innerHTML = 
    '<header class="header"><div class="container header-inner">' +
      '<div class="logo" onclick="location.hash=\'#/\'"><div class="logo-mark">T</div><div>TradeSpeak</div></div>' +
      '<nav class="nav">' +
        '<button class="nav-btn" onclick="location.hash=\'#/\'">首页</button>' +
        '<button class="nav-btn" onclick="location.hash=\'#/courses\'">课程库</button>' +
        '<button class="nav-btn active">播客</button>' +
      '</nav>' +
    '</div></header>' +
    '<div class="container detail-page">' +
      '<h1 class="section-title" style="margin-bottom:8px">播客磨耳朵</h1>' +
      '<p class="section-sub">' + PODCASTS.length + '期TradeTalk · Emma和James双主持伦敦腔</p>' +
      '<div class="podcast-list" id="pod-list"></div>' +
    '</div>' +
    '<footer class="footer"><div class="container"><p>TradeSpeak · 专为Quinn定制</p></div></footer>';
  
  var l = $('#pod-list');
  PODCASTS.forEach(function(p) {
    var item = el('div', 'podcast-item');
    item.onclick = function() { location.hash = '#/podcast/' + p.id; };
    item.innerHTML = 
      '<div class="podcast-num">' + p.num + '</div>' +
      '<div class="podcast-info">' +
        '<div class="podcast-title">' + p.title + '</div>' +
        '<div class="podcast-meta"><span>⏱ ' + p.duration + '</span><span>👥 ' + p.hosts.join(' & ') + '</span></div>' +
      '</div>' +
      '<div class="podcast-play">▶</div>';
    l.appendChild(item);
  });
}

function renderCourseDetail(id) {
  var c = COURSES.find(function(x) { return x.id === id; });
  if(!c) { $('#app').innerHTML = '<div class="loading"><p>课程不存在</p></div>'; return; }
  
  var app = $('#app');
  app.innerHTML = 
    '<header class="header"><div class="container header-inner">' +
      '<div class="logo" onclick="location.hash=\'#/\'"><div class="logo-mark">T</div><div>TradeSpeak</div></div>' +
      '<nav class="nav">' +
        '<button class="nav-btn" onclick="location.hash=\'#/\'">首页</button>' +
        '<button class="nav-btn active" onclick="location.hash=\'#/courses\'">课程库</button>' +
        '<button class="nav-btn" onclick="location.hash=\'#/podcasts\'">播客</button>' +
      '</nav>' +
    '</div></header>' +
    '<div class="container detail-page">' +
      '<button class="back-btn" onclick="location.hash=\'#/courses\'">← 返回课程库</button>' +
      '<div class="detail-header">' +
        '<h1 class="detail-title">' + c.emoji + ' ' + c.title + '</h1>' +
        '<div class="detail-meta"><span>📚 第' + c.num + '课</span><span>⏱ ' + c.duration + '</span><span>📊 ' + c.level + '</span><span>🎯 ' + c.scene + '</span></div>' +
      '</div>' +
      '<div id="course-content"></div>' +
    '</div>' +
    '<footer class="footer"><div class="container"><p>TradeSpeak · 专为Quinn定制</p></div></footer>';
  
  var content = $('#course-content');
  
  // 课程介绍
  var introBlock = el('div', 'block');
  introBlock.innerHTML = 
    '<div class="block-title"><span>💡</span>一句话总结</div>' +
    '<p style="font-size:16px;line-height:1.8;color:var(--ink2)">' + c.oneLiner.cn + '</p>' +
    '<p style="font-size:14px;color:var(--ink3);margin-top:8px;font-style:italic">"' + c.oneLiner.en + '"</p>';
  content.appendChild(introBlock);
  
  // 词汇
  if(c.vocab && c.vocab.length > 0) {
    var vocabBlock = el('div', 'block');
    vocabBlock.innerHTML = '<div class="block-title"><span>📝</span>高频词汇（' + c.vocab.length + '个）</div>' +
      c.vocab.map(function(v) {
        return '<div class="vocab-item">' +
          '<div class="vocab-word"><span class="word">' + v.word + '</span><span class="ipa">' + v.ipa + '</span>' +
          '<button class="speak-btn" onclick="speak(\'' + esc(v.ex) + '\')">🔊</button></div>' +
          '<div class="vocab-cn">' + v.cn + '</div>' +
          '<div class="vocab-ex">' + v.ex + '<br><span style="color:var(--ink3);font-style:normal">' + v.exCn + '</span></div>' +
        '</div>';
      }).join('');
    content.appendChild(vocabBlock);
  }
  
  // 表达
  if(c.expressions && c.expressions.basic) {
    var exprBlock = el('div', 'block');
    exprBlock.innerHTML = '<div class="block-title"><span>💬</span>基础表达</div>' +
      c.expressions.basic.map(function(e) {
        return '<div class="expr-item">' +
          '<div class="expr-en"><button class="speak-btn" onclick="speak(\'' + esc(e.en) + '\')">🔊</button><span>' + e.en + '</span></div>' +
          '<div class="expr-cn">' + e.cn + '</div>' +
          '<span class="expr-tag">' + e.tag + '</span>' +
        '</div>';
      }).join('');
    content.appendChild(exprBlock);
  }
  
  // 对话
  if(c.dialogues && c.dialogues.length > 0) {
    c.dialogues.forEach(function(d) {
      var dialogBlock = el('div', 'block');
      dialogBlock.innerHTML = '<div class="block-title"><span>🎭</span>' + d.title + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:14px">' +
        d.lines.map(function(l) {
          return '<div class="dialogue-line">' +
            '<div class="dialogue-avatar ' + l.speaker + '">' + (l.speaker === 'you' ? '我' : '客') + '</div>' +
            '<div class="dialogue-bubble">' +
              '<div class="speaker">' + (l.speaker === 'you' ? 'You (Quinn)' : 'Client') + '</div>' +
              '<div class="en"><button class="speak-btn" onclick="speak(\'' + esc(l.en) + '\')">🔊</button><span>' + l.en + '</span></div>' +
              '<div class="cn">' + l.cn + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
        '</div>';
      content.appendChild(dialogBlock);
    });
  }
}

function renderPodcastDetail(id) {
  var p = PODCASTS.find(function(x) { return x.id === id; });
  if(!p) { $('#app').innerHTML = '<div class="loading"><p>播客不存在</p></div>'; return; }
  
  var app = $('#app');
  app.innerHTML = 
    '<header class="header"><div class="container header-inner">' +
      '<div class="logo" onclick="location.hash=\'#/\'"><div class="logo-mark">T</div><div>TradeSpeak</div></div>' +
      '<nav class="nav">' +
        '<button class="nav-btn" onclick="location.hash=\'#/\'">首页</button>' +
        '<button class="nav-btn" onclick="location.hash=\'#/courses\'">课程库</button>' +
        '<button class="nav-btn active" onclick="location.hash=\'#/podcasts\'">播客</button>' +
      '</nav>' +
    '</div></header>' +
    '<div class="container detail-page">' +
      '<button class="back-btn" onclick="location.hash=\'#/podcasts\'">← 返回播客列表</button>' +
      '<div class="podcast-player">' +
        '<div class="podcast-player-title">🎙️ ' + p.title + '</div>' +
        '<div class="podcast-player-meta">第' + p.num + '期 · ' + p.duration + ' · ' + p.hosts.join(' & ') + '</div>' +
        '<div style="background:var(--gold-soft);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;color:var(--ink2)">' + p.description + '</div>' +
        '<div class="podcast-lines">' +
        p.lines.map(function(l) {
          return '<div class="podcast-line">' +
            '<div class="podcast-line-avatar ' + l.speaker + '">' + (l.speaker === 'emma' ? 'E' : 'J') + '</div>' +
            '<div class="podcast-line-content">' +
              '<div class="en"><button class="speak-btn" onclick="speak(\'' + esc(l.en) + '\')">🔊</button><span>' + l.en + '</span></div>' +
              '<div class="cn">' + l.cn + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<footer class="footer"><div class="container"><p>TradeSpeak · 专为Quinn定制</p></div></footer>';
}

function router() {
  var h = location.hash || '#/';
  if(h === '#/' || h === '#') { renderHome(); }
  else if(h.startsWith('#/courses')) { renderCourses(); }
  else if(h.startsWith('#/podcasts')) { renderPodcasts(); }
  else if(h.startsWith('#/course/')) { renderCourseDetail(h.replace('#/course/', '')); }
  else if(h.startsWith('#/podcast/')) { renderPodcastDetail(h.replace('#/podcast/', '')); }
  else { renderHome(); }
  window.scrollTo(0, 0);
}

async function init() {
  var app = $('#app');
  app.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>正在加载课程内容...</p></div>';
  
  try {
    var r = await loadData();
    console.log('加载完成：' + r.courses + '节课，' + r.podcasts + '期播客');
  } catch(e) {
    console.warn('加载失败:', e);
  }
  
  router();
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', init);
if(document.readyState !== 'loading') { init(); }
</script>
</body>
</html>
