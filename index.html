<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d5a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TradeSpeak">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%233d5a45'/%3E%3Ctext x='90' y='115' font-size='75' text-anchor='middle' fill='%23f5f1e8' font-family='Georgia,serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E">
<title>TradeSpeak · 外贸情景英语</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233d5a45'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f0ead9' font-family='serif' font-weight='bold'>T</text></svg>">
<style>
:root{
  --bg:#f7f5ef; --card:#ffffff; --ink:#252820; --ink2:#4c4e46; --ink3:#8a8d80;
  --green:#3d5a45; --green2:#7a9e7e; --green-soft:rgba(122,158,126,.12);
  --gold:#b08a4f; --gold-soft:rgba(176,138,79,.12);
  --red:#b5564a; --red-soft:rgba(181,86,74,.09);
  --line:rgba(37,40,32,.09);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow:0 2px 14px rgba(37,40,32,.07);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--green2);color:#fff}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,239,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;color:#f0ead9;font-family:var(--serif);font-size:19px;font-weight:700}
.brand-name{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.brand-sub{font-size:11px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.18s}
.chip:hover{border-color:var(--green2);color:var(--green)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}

/* ===== 首页 hero ===== */
.hero{max-width:1080px;margin:0 auto;padding:72px 22px 40px;text-align:center;position:relative;overflow:hidden}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(122,158,126,.35);background:var(--green-soft);color:var(--green);border-radius:999px;padding:7px 18px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:30px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,6.5vw,72px);line-height:1.16;letter-spacing:.01em}
.hero h1 .accent{color:var(--green2)}
.hero h1 .cursor{display:inline-block;width:3px;height:.95em;background:var(--green2);margin-left:4px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-sub{margin:24px auto 0;max-width:560px;color:var(--ink3);font-size:15.5px}
.hero-sub b{color:var(--gold);font-weight:600}
.hero-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:48px auto 0}
@media(max-width:760px){.hero-feats{grid-template-columns:1fr}}
.feat{background:var(--card);border-radius:var(--radius);padding:24px 22px;text-align:left;box-shadow:var(--shadow);border:1px solid rgba(37,40,32,.04)}
.feat-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px}
.feat h3{font-size:14.5px;margin-bottom:6px}
.feat p{font-size:13px;color:var(--ink3);line-height:1.65}

/* ===== 通用区块 ===== */
.wrap{max-width:1200px;margin:0 auto;padding:0 22px 90px}
.sec-title{font-family:var(--serif);font-size:26px;margin:44px 0 6px;letter-spacing:.02em}
.sec-sub{color:var(--ink3);font-size:13.5px;margin-bottom:22px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
@media(max-width:760px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:30px;color:var(--green);line-height:1.2}
.stat span{font-size:12px;color:var(--ink3)}

/* ===== 课程卡片 ===== */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.course-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.course-grid{grid-template-columns:1fr}}
.course-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .22s,box-shadow .22s;border:1px solid rgba(37,40,32,.04);display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(37,40,32,.12)}
.cc-visual{height:130px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cc-body{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
.cc-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cc-tag{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.cc-tag.lvl{background:var(--gold-soft);color:var(--gold)}
.cc-num{position:absolute;top:14px;left:18px;font-family:var(--serif);font-size:15px;color:rgba(255,255,255,.85);letter-spacing:.1em}
.cc-title{font-family:var(--serif);font-size:20px;margin-bottom:3px}
.cc-titleen{font-size:12px;color:var(--ink3);letter-spacing:.04em;margin-bottom:12px}
.cc-desc{font-size:13px;color:var(--ink2);line-height:1.68;flex:1}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cc-time{font-size:12px;color:var(--ink3)}
.cc-go{font-size:13px;color:var(--green);font-weight:600}
.prog-mini{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:14px}
.prog-mini i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:4px;transition:width .4s}

/* ===== 课程页布局 ===== */
.course-head{max-width:1200px;margin:0 auto;padding:34px 22px 0}
.crumb{font-size:12.5px;color:var(--ink3);margin-bottom:14px;cursor:pointer}
.crumb:hover{color:var(--green)}
.ch-flex{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.ch-title{font-family:var(--serif);font-size:34px;line-height:1.2}
.ch-titleen{color:var(--ink3);font-size:13.5px;margin-top:4px;letter-spacing:.05em}
.ch-meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px}
.course-progress{max-width:1200px;margin:20px auto 0;padding:0 22px}
.cp-track{height:5px;background:var(--line);border-radius:6px;overflow:hidden}
.cp-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:6px;transition:width .45s}
.cp-label{font-size:12px;color:var(--ink3);margin-top:7px;display:flex;justify-content:space-between}

.layout{max-width:1200px;margin:26px auto 0;padding:0 22px 90px;display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.sidebar{position:sticky;top:78px}
@media(max-width:900px){.sidebar{position:static}}
.side-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 14px;border:1px solid rgba(37,40,32,.04)}
@media(max-width:900px){.side-card{display:none}}
.side-title{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;padding:4px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.step-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 10px;border-radius:11px;font-size:13.5px;color:var(--ink2);transition:.15s;position:relative}
.step-item:hover{background:var(--green-soft)}
.step-item.on{background:var(--green);color:#fff;font-weight:600}
.step-item.done .step-no{background:var(--green2);color:#fff;border-color:var(--green2)}
.step-no{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;background:#fff}
.step-item.on .step-no{border-color:rgba(255,255,255,.5);background:transparent;color:#fff}
.step-item.done{color:var(--green)}

/* 移动端目录 */
.m-side-toggle{display:none}
@media(max-width:900px){
  .m-side-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);font-size:13.5px;color:var(--green);font-weight:600;margin-bottom:16px}
  .side-card.m-open{display:block;position:fixed;inset:auto 14px 14px 14px;z-index:80;max-height:65vh;overflow:auto}
}

/* ===== 内容卡片 ===== */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(37,40,32,.04);padding:30px 32px;margin-bottom:20px}
@media(max-width:640px){.panel{padding:22px 18px}}
.panel-title{font-family:var(--serif);font-size:21px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-sub{font-size:13px;color:var(--ink3);margin-bottom:22px}
.ep-visual{height:190px;border-radius:14px;overflow:hidden;position:relative;margin-bottom:22px}
.ep-desc{font-size:15px;color:var(--ink2);line-height:1.85;margin-bottom:24px;border-left:3px solid var(--green2);padding-left:16px}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.intro-grid{grid-template-columns:1fr}}
.intro-box{background:var(--bg);border-radius:14px;padding:18px 20px}
.intro-box h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.intro-box li{font-size:13.5px;color:var(--ink2);margin-bottom:9px;padding-left:18px;position:relative;line-height:1.6;list-style:none}
.intro-box li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--green2)}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;transition:.18s;border:1.5px solid transparent}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:#31503b}
.btn-o{border-color:var(--green2);color:var(--green);background:#fff}
.btn-o:hover{background:var(--green-soft)}
.btn-g{border-color:var(--gold);color:var(--gold);background:#fff}
.btn-g:hover{background:var(--gold-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.play-ico{width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:.15s}
.play-ico:hover{background:var(--green);color:#fff}
.play-ico.playing{background:var(--gold);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

/* ===== 词汇 ===== */
.oneliner{background:linear-gradient(135deg,rgba(61,90,69,.07),rgba(176,138,79,.07));border:1px solid rgba(122,158,126,.25);border-radius:14px;padding:20px 24px;margin-bottom:26px}
.oneliner h4{font-size:12px;letter-spacing:.16em;color:var(--green);text-transform:uppercase;margin-bottom:10px}
.oneliner-en{font-size:16.5px;line-height:1.9;font-family:Georgia,serif}
.oneliner-en mark{background:rgba(176,138,79,.28);color:inherit;border-radius:3px;padding:0 3px;font-weight:600}
.oneliner-cn{font-size:12.5px;color:var(--ink3);margin-top:10px}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:760px){.vocab-grid{grid-template-columns:1fr}}
.vcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.18s;background:#fff}
.vcard:hover{border-color:var(--green2);box-shadow:var(--shadow)}
.vcard-top{display:flex;align-items:center;gap:10px}
.vcard-no{font-family:var(--serif);font-size:12px;color:var(--ink3)}
.vcard-word{font-size:17px;font-weight:700;font-family:Georgia,serif;letter-spacing:.01em}
.vcard-ipa{font-size:12px;color:var(--ink3);margin-top:3px;font-family:Georgia,serif}
.vcard-exen{font-size:13px;color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.6;font-family:Georgia,serif}
.vcard-reveal{margin-top:8px;font-size:11.5px;color:var(--ink3);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;text-align:center;transition:.15s}
.vcard:hover .vcard-reveal{color:var(--green);border-color:var(--green2)}
.vcard-cn{font-size:13px;color:var(--gold);margin-top:8px;font-weight:700}
.vcard-excn{font-size:11.5px;color:var(--ink3);margin-top:4px}
.vcard-excn i{font-style:normal}
.vcard.seen{border-color:rgba(122,158,126,.45)}
.vcard.seen .vcard-exen{color:var(--ink2)}

/* ===== 误区 ===== */
.miscon{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.mc-row{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:640px){.mc-row{grid-template-columns:1fr}}
.mc-bad{background:var(--red-soft);padding:16px 20px}
.mc-good{background:var(--green-soft);padding:16px 20px}
.mc-lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.mc-bad .mc-lab{color:var(--red)}
.mc-good .mc-lab{color:var(--green)}
.mc-sent{font-size:15px;font-family:Georgia,serif;line-height:1.55;display:flex;align-items:flex-start;gap:10px}
.mc-note{padding:14px 20px;background:var(--bg);font-size:13px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--line)}
.mc-vars{display:flex;flex-direction:column;gap:7px}
.mc-var{display:flex;align-items:center;gap:10px;font-size:13.5px;font-family:Georgia,serif;color:var(--ink2)}

/* ===== 表达 ===== */
.expr-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.expr-cols{grid-template-columns:1fr}}
.expr-col{border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.expr-col h4{font-size:12.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-bottom:14px}
.expr-col h4 b{color:var(--green)}
/* 基础→进阶配对显示 */
.expr-pairs{display:flex;flex-direction:column;gap:16px}
.expr-pair{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.expr-pair-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;font-weight:600}
.expr-basic{background:#f5f7f4;margin-bottom:0}
.expr-advanced{background:var(--green-soft);margin-bottom:0}
.expr-arrow{text-align:center;font-size:11.5px;color:var(--green);padding:6px 0;font-weight:600;letter-spacing:.05em}
.expr-tag{display:inline-block;flex-shrink:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--ink3);color:#fff;letter-spacing:.05em;margin-top:2px}
.expr-tag.adv{background:var(--green)}
.expr-item{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px;font-family:Georgia,serif;line-height:1.6}
.expr-item:last-child{border-bottom:none}

/* ===== 微对话 ===== */
.dlg-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dlg-title{font-size:16.5px;font-weight:700}
.dlg-sub{font-size:12.5px;color:var(--ink3)}
.bubble{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start}
.bubble.you{flex-direction:row-reverse}
.bub-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;background:var(--green-soft)}
.bubble.you .bub-avatar{background:var(--gold-soft);font-size:10px}
.bub-body{max-width:76%}
.bub-name{font-size:10.5px;color:var(--ink3);margin-bottom:4px;letter-spacing:.06em}
.bubble.you .bub-name{text-align:right}
.bub-text{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 15px;font-size:14px;font-family:Georgia,serif;line-height:1.6}
.bubble.you .bub-text{background:var(--green);color:#fff;border-color:var(--green);border-radius:14px 4px 14px 14px}
.bub-cn{font-size:11.5px;color:var(--ink3);margin-top:4px}
.bubble.you .bub-cn{text-align:right}
.bub-ctrl{display:flex;gap:6px;margin-top:6px;align-items:center}
.bubble.you .bub-ctrl{justify-content:flex-end}
.bub-play{width:25px;height:25px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.bub-play:hover{background:var(--green);color:#fff}
.bub-shadow{width:25px;height:25px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.bub-shadow:hover{background:var(--gold);color:#fff}
.bubble.active .bub-text{box-shadow:0 0 0 2px var(--green2)}
.read-score{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700}
.read-score.good{background:var(--green-soft);color:var(--green)}
.read-score.mid{background:var(--gold-soft);color:var(--gold)}
.read-score.bad{background:var(--red-soft);color:var(--red)}

/* ===== 练习 ===== */
.prac-block{margin-bottom:26px}
.prac-block h4{font-size:14.5px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.prac-tag{font-size:10.5px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold);letter-spacing:.08em}
.sub-base{background:var(--bg);border-radius:12px;padding:14px 18px;font-family:Georgia,serif;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-slot{display:inline-flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sub-opt{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;background:#fff;transition:.15s;font-family:Georgia,serif}
.sub-opt:hover{border-color:var(--green2)}
.sub-opt.on{background:var(--green);color:#fff;border-color:var(--green)}
.fill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:11px;font-family:Georgia,serif;font-size:14.5px}
.fill-input{width:88px;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;text-align:center;font-family:Georgia,serif;background:#fff;outline:none;transition:.15s}
.fill-input:focus{border-color:var(--green2)}
.fill-input.ok{border-color:var(--green);background:var(--green-soft)}
.fill-input.no{border-color:var(--red);background:var(--red-soft)}
.fill-hint{font-size:11.5px;color:var(--ink3)}
.rw-row{margin-bottom:11px}
.rw-from{font-size:13.5px;color:var(--red);text-decoration:line-through;text-decoration-color:rgba(181,86,74,.4);font-family:Georgia,serif}
.rw-arrow{color:var(--ink3);margin:0 8px}
.rw-to{font-size:14px;color:var(--green);font-family:Georgia,serif;font-weight:600}
.rw-reveal{font-size:11.5px;color:var(--gold);cursor:pointer;margin-top:3px;display:inline-block}

      { role: "you", en: "Hi Emma, as promised, here is the full investigation report for the leaking ink issue. Root cause: The batch #20260815 was produced during a shift change when the sealing machine was not recalibrated. The machine was off by 0.3mm, causing incomplete heat sealing on the ink chamber — this affected approximately 12-15% of units in that batch. The defect passed our QC because our leak test was only a 5% random sample, and the affected units happened to be in the untested 95%. Immediate corrective actions (all completed): 1) All 6 sealing machines recalibrated and verified with 200-unit test runs — zero defects. 2) Leak test upgraded from 5% sampling to 100% water immersion test before packaging. 3) All remaining stock from batch #20260815 quarantined and 100% re-inspected — 143 defective units removed and destroyed. 4) Added a mandatory machine calibration check at every shift change, signed by the shift supervisor. Long-term prevention: Updated QC SOP document attached. New operator training scheduled for all sealing machine operators. I've attached the full report with photos of the defect, the calibration records, and the test results. Would you like to schedule a 15-minute call to review anything? The replacement units are shipping today — tracking number will follow shortly.", cn: "Emma您好，按承诺，这是漏墨问题的完整调查报告。根本原因：批号#20260815是在换班时生产的，当时封口机没有重新校准。机器偏差0.3mm，导致墨仓热封不完全——该批次约12-15%的产品受影响。缺陷通过了我们的质检是因为我们的漏墨测试只有5%随机抽检，而受影响的产品恰好在未检测的95%中。已完成的即时纠正措施：1）所有6台封口机重新校准并通过200支测试运行验证——零缺陷。2）漏墨测试从5%抽检升级为包装前100%水浸测试。3）#20260815批次剩余库存全部隔离并100%复检——143支不良品已剔除销毁。4）每次换班增加强制性机器校准检查，由班组长签字。长期预防：附上更新后的质检SOP文件。所有封口机操作员的新培训已安排。附件里有完整报告，包括缺陷照片、校准记录和测试结果。需要约15分钟电话回顾什么吗？替换品今天发货——单号稍后给您。" },
      { role: "buyer", en: "This is very thorough, Quinn. I'm impressed by the level of detail. The 100% leak test is exactly what was needed.", cn: "非常详尽，Quinn。这个细致程度让我印象深刻。100%漏墨测试正是需要的。" },
      { role: "you", en: "Thank you, Emma — that means a lot. I want you to know that this complaint has actually made our factory better: the 100% leak test and shift-change calibration are now standard for ALL our production, not just your orders. So in a way, your feedback is improving quality for every customer. The replacement units (tracking: DHL 1234567890) will arrive by Friday. And I've applied the 10% credit (USD 342) to your account — it will show on your next invoice. I'll check in with you after you receive the replacements to make sure everything is perfect. Again, I'm sorry for the trouble, and thank you for giving us the chance to make it right.", cn: "谢谢您，Emma——这对我意义重大。我想让您知道，这次投诉实际上让我们工厂变得更好了：100%漏墨测试和换班校准现在是我们所有生产的标准，不只是您的订单。所以某种程度上，您的反馈正在提升每个客户的质量。替换品（单号：DHL 1234567890）周五前到。10%信用额（342美元）已计入您的账户——会在下次发票上显示。您收到替换品后我会跟进确认一切完美。再次为带来的麻烦道歉，也感谢您给我们改正的机会。" }
    ]

    rounds: [
      { ai: "Quinn, 30% of the markers have broken clips! My customers are returning them and I'm losing money. I want a full refund and I'm this close to posting about this on the stationery forum.", cn: "Quinn，30%的马克笔笔夹断了！我的客户在退货，我在亏钱。我要全额退款，我差点就在文具论坛上发帖子曝光了。",

        patterns: [/sorry|30%|understand|angry|furious/i, /full refund|usd 1,?260|processed today/i, /replacement|dhl|5 days|15%|credit|usd 630/i, /48 hours|investigate|root cause|report|photos|personally call/i, /chance|earn|trust|before you post/i],

  misconceptions: [
    { wrong: "Yes, we can do any customization you want. Send us your design.", right: "Great question! We offer comprehensive OEM/ODM services, but let me walk you through what's possible and what the process looks like, so there are no surprises. We can customize: product shape (new mold needed, ~15 days, USD 800-1,500), logo printing (silk-screen/heat transfer/UV, no mold needed), packaging (custom boxes, CDU displays, blister cards), and ink colors (any Pantone). Before we start, I'll send you our OEM brief form — this helps us capture all your requirements in one go, reducing back-and-forth. Once you fill it in, our designer creates 3D mockups in 3 days, then physical samples in 10-12 days. Total timeline from design confirmation to mass production: about 45 days. Shall I send the brief and some of our previous OEM projects for inspiration?", note: "客户说要OEM，你不能只说'可以，发设计来'。OEM流程复杂，客户（尤其是第一次做OEM的）往往不知道需要提供什么信息、需要多少时间和费用。你要主动引导：列出可定制的选项、说明流程和时间线、给出费用范围、提供需求表。这样客户觉得你专业，也减少后续因为信息不全导致的反复修改。", variants: ["OEM is one of our strengths! Here's how it works: [process overview]. I'll send a detailed brief form to capture all specs. Timeline: 3 days for digital mockups, 10-12 days for physical samples, 30 days for mass production after PP sample approval. Mold fees: [range], refundable after [quantity].", "Absolutely — we do a lot of OEM for brands like [reference]. Let me send you our OEM starter kit: 1) Requirement brief form, 2) Previous work samples, 3) Pricing guide for different customization levels. This will give you a clear picture before we commit to anything."] },
    { wrong: "The design is not good, please modify it.", right: "Thank you for the feedback! To make sure the revision is exactly what you want, let me confirm the specific changes: 1) Logo position: move from center to 15mm from the top — correct? 2) Logo size: increase from 20mm to 25mm width — correct? 3) Barrel color: change from Pantone 3272C to Pantone 3278C (darker) — correct? I'll also include 2 minor variations of the layout (Option A: logo only; Option B: logo + tagline) so you can compare. Revised mockups will be ready by tomorrow end of day. Is there anything else you'd like adjusted at the same time? I want to minimize rounds and get this right for you quickly.", note: "设计修改是OEM中最耗时的环节，很多订单因为设计改了五六次而延误。关键是：每次修改都要复述确认具体参数（位置/尺寸/色号），不要凭理解改。同时可以主动提供2-3个变体让客户选择，减少'再改改'的模糊反馈。最后问一句'还有其他要一起改的吗'，把所有修改集中在一次完成。", variants: ["Got it — let me lock in the exact changes: [specific parameters]. I'll also prepare 2 layout options so you can compare. Revised mockups by EOD tomorrow. Anything else to adjust in the same round? Let's get it all done at once.", "Thank you for the detailed notes. I've logged each change: [list]. Before I revise, one question: [clarification on ambiguous feedback]. This ensures the next version is exactly right. I'll have it for you by [date]."] },
    { wrong: "The sample is confirmed, we will start mass production.", right: "Great to hear the sample is approved! Before mass production, as our standard process, I'll make one PP (pre-production) sample using the exact same materials, molds, and production line as the bulk order. This is the final reference for mass production and ensures zero discrepancy between sample and bulk. I'll have the PP sample ready in 5 working days, and I'll send photos + a short video of the production process. Once you confirm the PP sample in writing (simply reply 'PP sample approved, please proceed'), we'll release the order to the production line immediately. Total mass production time: 30 days from PP approval. I'll also schedule a pre-shipment inspection (100% for OEM orders) and send you photos before the goods leave. This process is designed to protect your brand — let's make sure every unit that reaches your customers is perfect.", note: "OEM订单最容易出的问题就是'样品和大货不一样'。跳过PP样直接量产是大忌。PP样（产前样）是用大货同款材料、模具、生产线做的最终确认样，必须客户书面确认后才能量产。这个流程既保护客户（确保大货和样品一致），也保护你（有书面确认，后续出了问题不是你的责任）。OEM订单一定要坚持这个流程，不能因为客户催就跳过。", variants: ["Excellent! Final step before production: PP sample made with bulk materials and production line — 5 days. This guarantees bulk matches sample exactly. I'll send photos + video. After your written 'PP approved', production starts (30 days). Pre-shipment 100% inspection included. This protects your brand quality.", "Perfect timing. As a final quality gate, I'll produce a PP sample from the actual production line. This is the gold standard for OEM — it catches any material or process differences before we commit to 50,000 units. 5 days to make, then your written approval, then 30-day production. I'll include full inspection reports."] }

  dialogueA: {
    title: "场景A：客户首次咨询OEM", sub: "引导客户明确需求+说明流程",
    lines: [
      { role: "buyer", en: "We want to launch our own brand of markers. Can you do OEM with custom design and packaging? We need samples in 2 weeks.", cn: "我们想推出自己的马克笔品牌。你们能做定制设计和包装的OEM吗？我们2周内需要样品。" },
      { role: "you", en: "Exciting project — launching your own brand is a great move! OEM is one of our core strengths, and I'd love to help you do this right. Let me give you a realistic timeline so we can plan together: From the moment you confirm the design, physical samples take 10-12 working days. If we count the design confirmation (usually 2-3 rounds of mockups, about 5-7 days), total from start to samples in hand is about 3 weeks. To hit your 2-week target, we'd need to finalize the design by end of this week. Here's what I need from you to start: 1) Our OEM brief form (I'll send it now — covers product specs, logo, packaging, quantities). 2) Your logo source file (AI/PDF, fonts outlined). 3) Any reference images or inspiration for the design. Once I have these, our designer creates 3D mockups in 3 days. We can do 2 revision rounds quickly. Mold fee: USD 800 if a new mold is needed (refundable after 50,000 pcs). If we use an existing mold with custom printing, no mold fee. Shall I send the brief and start today?", cn: "令人兴奋的项目——推出自有品牌是很棒的一步！OEM是我们的核心优势之一，我很乐意帮您做好。我给您一个实际的时间线以便我们一起规划：从您确认设计算起，实物样品需要10-12个工作日。如果算上设计确认（通常2-3轮效果图，约5-7天），从开始到拿到样品总共约3周。要达到您2周的目标，我们需要本周末前确定设计。我需要您提供以下信息来开始：1）我们的OEM需求表（我现在就发——涵盖产品规格、logo、包装、数量）。2）您的logo源文件（AI/PDF，文字转曲）。3）任何设计参考图或灵感。收到这些后，我们设计师3天出3D效果图。我们可以快速做2轮修改。开模费：如果需要新开模是800美元（50000支后退还）。如果用现有模具加定制印刷，不收开模费。我现在发表格，今天就开始？" },
      { role: "buyer", en: "2 weeks is tight but let's try. Send the brief. We'll use an existing mold with custom printing to save time.", cn: "2周很紧但我们试试。发表格吧。我们用现有模具加定制印刷来省时间。" },
      { role: "you", en: "Perfect choice — existing mold with custom printing means no mold fee, no mold-making time, and samples in 7-8 working days after design confirmation. I've just sent the OEM brief form and a reference PDF of our existing mold options (12 barrel styles to choose from). To keep us on track for 2 weeks, here's the timeline: Today-Tomorrow: you fill the brief + send logo file. Day 3: I send first round of 3D mockups (2 design options). Day 4-5: revisions (we'll do up to 2 rounds quickly). Day 6: design confirmed. Day 7-13: physical samples made. Day 14: samples shipped via DHL, arriving to you in 3 days. I'll personally manage this project to keep everything on schedule. One tip to speed things up: if you can provide the Pantone color codes for the barrel and logo, that saves a round of color matching. Let's get started — fill the brief and I'll have mockups for you by Thursday!", cn: "明智的选择——现有模具加定制印刷意味着没有开模费、没有开模时间，设计确认后7-8个工作日出样。我刚发了OEM需求表和现有模具选项的参考PDF（12种笔杆款式可选）。为了确保2周完成，时间线如下：今天-明天：您填需求表+发logo文件。第3天：我发第一轮3D效果图（2个设计方案）。第4-5天：修改（我们快速做最多2轮）。第6天：设计确认。第7-13天：制作实物样品。第14天：样品走DHL发出，3天到您手上。我会亲自管理这个项目确保一切按计划进行。一个加速建议：如果您能提供笔杆和logo的潘通色号，可以省一轮配色。开始吧——填好需求表，周四我就给您效果图！" }
    ]
  },
  dialogueB: {
    title: "场景B：设计修改+PP样确认", sub: "高效修改设计，坚持PP样流程",
    lines: [
      { role: "buyer", en: "The mockups look good but I want the logo bigger and the blue darker. Also, can we try a different font for the brand name?", cn: "效果图看起来不错，但我想要logo更大一点，蓝色更深一点。还有，品牌名能换个字体吗？" },
      { role: "you", en: "Great feedback — let me lock in the exact changes so the next version is perfect: 1) Logo size: increase from 22mm to 28mm width (keeping proportions) — correct? 2) Blue: change from Pantone 2995C to Pantone 286C (deeper royal blue) — I'll also include Pantone 287C (one shade darker) as Option B so you can compare — correct? 3) Font: I'll prepare 3 font options for the brand name (A: modern sans-serif, B: bold geometric, C: elegant serif) — you can pick the one that fits your brand. I'll have all revisions ready by tomorrow noon. To save time, I'll also include the packaging mockup in this round (CDU box with your logo and color scheme) so we can approve product and packaging together. Is there anything else — tagline, contact info on packaging, barcode position — that you want included in this same round? Let's get everything done at once so we don't lose days on extra revisions.", cn: "很好的反馈——我确认一下具体修改参数，确保下一版完美：1）logo尺寸：宽度从22mm增加到28mm（保持比例）——对吗？2）蓝色：从Pantone 2995C改成Pantone 286C（更深的宝蓝）——我还会附上Pantone 287C（再深一号）作为B方案供您对比——对吗？3）字体：我准备3种品牌名字体（A：现代无衬线，B：粗体几何，C：优雅衬线）——您可以选最符合品牌的。明天中午前所有修改完成。为了省时间，这一轮我也会把包装效果图放进去（CDU盒带您的logo和配色），这样产品和包装可以一起确认。还有其他——标语、包装上的联系信息、条码位置——需要这一轮一起加的吗？我们一次改全，避免额外修改浪费时间。" },
      { role: "buyer", en: "All confirmed. The design looks great now. Can we start production?", cn: "全部确认。设计现在看起来很棒。可以开始生产了吗？" },
      { role: "you", en: "Almost there! The design is confirmed, and I'm thrilled you love it. Before mass production, as our standard OEM quality process, I need to make one PP (pre-production) sample. This is different from the development sample you've seen — the PP sample is made on the actual production line with the exact bulk materials, inks, and printing setup. It's the final gold standard that every unit in mass production will be compared against. Why this matters: it catches any subtle differences between the hand-made development sample and machine-made bulk production — things like ink density, print alignment, and material finish. I'll have the PP sample ready in 5 working days, and I'll send you: 1) High-resolution photos from all angles, 2) A 30-second video showing the production process, 3) A physical PP sample shipped via DHL (if you want to hold it). Once you reply 'PP sample approved, please proceed with production', we release the order to the line immediately. Mass production: 30 days. I know you're eager to launch, and this 5-day step is what ensures your customers receive product that matches the sample you approved. Let's do it right — I'll start the PP sample today.", cn: "就差最后一步了！设计确认了，您喜欢我很高兴。在大货生产前，按我们OEM标准质量流程，我需要做一个PP（产前）样。这和您之前看到的开发样不同——PP样是在实际生产线上用大货同款材料、墨水和印刷设置做的。它是最终的黄金标准，大货中每一支都要和它对比。为什么重要：它能发现手工开发样和机器大货之间的细微差异——比如墨水浓度、印刷对齐、材质表面处理。PP样5个工作日内备好，我会发给您：1）各角度高清照片，2）30秒生产过程视频，3）DHL寄出实物PP样（如果您想拿在手里看）。您回复'PP样确认，请开始生产'后，我们立即下单到生产线。大货生产：30天。我知道您急着上市，这5天是确保您的客户收到和您确认样品一致的产品。我们把它做对——今天就开始做PP样。" }
    ]
  },

  culture: [
    { flag: "🇺🇸", title: "美国客户：重品牌和设计", body: "美国买家做OEM时非常重视品牌形象和设计感。他们会花很多时间在设计稿修改上，对颜色、字体、包装的细节要求很高。和美国客户合作OEM，要配好的设计师，效果图要做得专业（3D渲染、场景图）。美国客户也愿意为好的设计付溢价，但他们要求你能跟上他们的设计节奏。" },

  aiPractice: {

    role: "Camille · French Startup Brand Owner",
    rounds: [
      { ai: "We want to create our own marker brand, but this is our first time doing OEM. How does it work? And the mold fee sounds expensive — we're a startup with limited budget.", cn: "我们想做自己的马克笔品牌，但这是第一次做OEM。流程是怎样的？开模费听起来很贵——我们是预算有限的初创公司。",
        hint: "Camille, I love that you're launching your own brand — and I'm here to make the OEM process simple and affordable for you. Let me explain in plain terms: OEM means we make the markers with YOUR logo, YOUR colors, and YOUR packaging — you don't need a factory, just a brand vision. The process has 4 simple steps: 1) You tell us what you want (I'll send a simple form, takes 15 minutes to fill). 2) Our designer creates digital mockups for you to approve (3 days, free). 3) We make physical samples (7-10 days, sample fee USD 50, refundable on first order). 4) You approve, we produce (25-30 days). About the mold fee: here's the good news — you don't need a new mold! We have 12 existing marker styles that you can customize with your logo and colors. No mold fee at all. A new mold (for a completely unique shape) is only needed if you want something totally different from what exists. For your first order, I strongly recommend using an existing mold — it saves you USD 800-1,500 and cuts 15 days from the timeline. You can always invest in a custom mold later when your brand grows. Shall I send you the simple OEM form and photos of our 12 existing styles to choose from?",
        patterns: [/first time|startup|budget|simple|plain terms/i, /4 steps|process|form|mockups|samples|produce/i, /existing mold|12 styles|no mold fee|customize|logo|colors/i, /new mold|unique shape|usd 800|1,?500|later|brand grows/i, /send|form|photos|choose from|start/i],
        ok: "Existing mold with no fee is perfect for us. Send the form and the style photos.",
        miss: "Camille, OEM is simple: 4 steps — fill a brief form (15 min), free digital mockups (3 days), physical samples (USD 50 refundable, 7-10 days), then production (25-30 days). Good news: use one of our 12 existing molds with your logo/colors = NO mold fee, saves USD 800-1,500 and 15 days. Custom mold only if you want a unique shape later. I'll send the form and style photos now." },
      { ai: "The form is filled. We like Style #5. But we're not designers — can you help with the logo and packaging design?", cn: "表格填好了。我们喜欢5号款式。但我们不是设计师——logo和包装设计你们能帮忙吗？",
        hint: "Absolutely — design support is included in our OEM service at no extra cost! Our in-house design team specializes in stationery branding, and they'll work with you to create something that fits your brand vision. Here's how it works: 1) You share your brand ideas — even simple things like 'we want a clean, minimalist look with pastel colors' or reference images from Instagram/Pinterest. 2) Our designer creates 2 initial logo concepts + packaging mockups in 3 working days. 3) You give feedback, we revise (up to 3 rounds included free). 4) Final design files delivered to you (you own them). If you already have a logo, great — just send the file and we'll adapt it. If you don't, we can create one from scratch based on your brand name and style preferences. For packaging, we'll design the CDU display box and individual pen packaging to match. I'll also send you a 'brand inspiration questionnaire' to help us understand your aesthetic — it's fun, not technical. You focus on your brand vision, we handle the design execution. Shall I send the inspiration questionnaire and introduce you to our designer via email?",
        patterns: [/design support|included|free|in.?house|designer|stationery branding/i, /2 initial|logo concepts|packaging mockups|3 days|3 rounds|revise/i, /already have logo|send file|adapt|from scratch|brand name/i, /cdu|display box|individual pen packaging|match/i, /inspiration questionnaire|aesthetic|fun|not technical|vision|execution/i],
        ok: "Free design support is amazing. Send the questionnaire — we have some Pinterest boards for inspiration.",
        miss: "Yes! Design support is free and included. Our in-house stationery designer creates 2 logo + packaging concepts in 3 days, up to 3 revision rounds free. If you have a logo, send it; if not, we create from your brand vision. I'll send a fun inspiration questionnaire (not technical) — share Pinterest boards if you have them. You bring the vision, we handle the design. I'll introduce our designer by email." },
      { ai: "The designs are perfect! Samples look great too. We're ready to order 5,000 pieces for our first order. When can we have them?", cn: "设计很完美！样品也很棒。我们准备首单订5000支。什么时候能拿到货？",
        hint: "Congratulations on your first order — this is exciting! 5,000 pieces is a great starting quantity for a launch. Here's the timeline: Since the design and samples are already approved, the next step is the PP (pre-production) sample — made on the actual production line to guarantee bulk matches your approved sample. That takes 5 working days. Once you confirm the PP sample (you can do it by photo, no need to wait for physical), mass production starts immediately and takes 25 working days for 5,000 pieces. Then 3-5 days for DHL shipping (for 5,000 pcs, express is cost-effective and fast). Total: approximately 33-35 days from today to your door. To speed things up, I can start the PP sample TODAY while you arrange the 30% deposit — they run in parallel, saving 5 days. With that, you could have goods in about 28 days. I'll also include: 1) 100% pre-shipment inspection with photos, 2) A launch guide with tips for selling your first batch (social media content ideas, retail pitch template), 3) Priority support for your first order — I'm your direct contact for anything. Shall I send the proforma invoice so we can start today?",
        patterns: [/congratulations|first order|exciting|5,?000|starting quantity|launch/i, /pp|pre.?production|actual production line|guarantee|bulk matches|5 working days/i, /mass production|25 working days|dhl|3.?5 days|33.?35 days|door/i, /speed up|start today|deposit|parallel|saving 5 days|28 days/i, /100%|inspection|photos|launch guide|social media|retail pitch|priority support|direct contact|proforma invoice/i],
        ok: "28 days sounds great. Send the proforma invoice — we'll arrange the deposit today.",

    desc: "认证和合规是文具产品进入国际市场的通行证。欧盟的EN71、CE、REACH、PPWR，美国的ASTM、CPSIA、Prop 65，每个市场都有不同的要求。本课教你如何快速识别不同市场的认证要求、如何向客户展示合规文件、如何处理客户的特殊合规需求，以及如何用合规能力作为竞争优势。",
    tasks: ["快速识别不同市场的认证要求", "专业地向客户展示合规文件", "处理客户的特殊合规需求（如PPWR、REACH SVHC）", "用合规能力作为差异化竞争优势"],

  },
  oneLiner: {

    highlights: ["EN71", "CE", "REACH", "PPWR", "ASTM", "CPSIA", "Prop 65", "SGS", "Intertek"]
  },

    { word: "CE marking", ipa: "/ˌsiː ˈiː ˈmɑːkɪŋ/", ex: "All products carry the CE marking, indicating compliance with EU health, safety, and environmental requirements.", cn: "CE标志", exCn: "所有产品都有CE标志，表明符合欧盟健康、安全和环保要求。" },
    { word: "REACH", ipa: "/riːtʃ/", ex: "Our products are REACH compliant — all SVHC substances are below the 0.1% threshold.", cn: "欧盟化学品注册评估授权法规", exCn: "我们的产品符合REACH——所有SVHC物质均低于0.1%阈值。" },

    { wrong: "PPWR is too complicated, we will try our best.", right: "PPWR is something we've already prepared for — we started updating our packaging 6 months ago when the regulation was finalized. Here's where we stand: 1) All our cardboard packaging is FSC-certified and 100% recyclable. 2) We've eliminated all unnecessary plastic — no plastic windows, no shrink wrap on individual units (we use paper bands instead). 3) Our packaging contains a minimum of 35% recycled content (exceeding the 2030 requirement of 30%). 4) We provide a Packaging Declaration for each shipment with material composition and recycling instructions. 5) We're registered in the German LUCID packaging registry and can provide the registration number. If you need specific documentation for your country's implementation of PPWR (e.g., France's AGEC, Italy's CONAI), just let me know — we have experience with all major EU national implementations. I've attached our PPWR compliance summary and packaging declaration template for your review.", note: "PPWR（欧盟包装法规）是2026年最热门的合规话题，很多供应商还搞不清楚。如果你能专业地展示你已经准备好了PPWR合规，你会在欧洲客户心中立刻升级为'靠谱的顶级供应商'。不要说'我们会尽力'——要说'我们已经准备好了'，然后列出具体的措施：FSC认证、无不必要塑料、再生成分含量、包装声明、各国注册（如德国LUCID）。主动提供文件模板，让客户觉得你不仅合规，还能帮他们省事。", variants: ["PPWR? We're ahead of it — started 6 months ago. Our packaging: FSC-certified, 100% recyclable, no unnecessary plastic, 35% recycled content (beats 2030 requirement). We provide Packaging Declarations per shipment and are registered in Germany's LUCID. Need France AGEC or Italy CONAI docs? We have templates. PPWR summary attached.", "Great question — PPWR is actually a competitive advantage for us. While many suppliers are still figuring it out, we've already transitioned all packaging. Here's our compliance checklist: [specifics]. We can even help YOUR team with the documentation — we provide pre-filled packaging declarations that just need your importer details. This saves you time and ensures compliance at the border."] },
    { wrong: "We can do any certification you want, no problem.", right: "Most standard certifications are already in place, but for specialized or market-specific testing, let me be transparent about what's involved so there are no surprises. Standard certs (EN71, CE, ASTM, CPSIA, REACH): already done, reports attached. Specialized testing (e.g., specific retailer requirements, national regulations like France AGEC, biodegradability testing): we can arrange through SGS/Intertek, typically takes 2-3 weeks and costs USD 300-800 depending on the test. For first-time clients, we split the cost 50/50; for clients with annual orders over USD 50,000, we cover 100%. If the testing is for a specific order you're ready to place, I can prioritize it and have results in 10 business days (expedited fee applies, about 30% extra). Which specific certification or test does your market require? I'll check if we already have it and give you a clear timeline and cost if not.", note: "不要什么认证都一口答应'没问题'——客户可能要求一些很偏门的检测，如果你答应了做不到，反而失去信任。要诚实区分：标准认证（已经有了）vs 特殊检测（需要安排，说明时间和费用）。给出清晰的费用分担政策（新客户50/50，大客户免费），让客户觉得你透明且公平。最后问清楚具体需要什么，不要盲目承诺。", variants: ["Standard certs are ready: [list]. For specialized testing (retailer-specific, national regs), I'll be upfront: SGS/Intertek, 2-3 weeks, USD 300-800. First clients: 50/50 split. Annual >USD 50K: we cover 100%. Ready-to-order: expedited in 10 days (+30%). What specific test does your market need? I'll check availability and give exact timeline/cost.", "Most are done — let me check your specific requirement. If it's standard, I'll send the report today. If it's specialized, I'll get a quote from SGS with timeline and share it before proceeding — no surprises. I believe in being transparent about testing so you can plan your compliance budget accurately."] }

  dialogueA: {
    title: "场景A：客户询问欧盟合规认证", sub: "专业展示EN71/CE/REACH/PPWR合规",
    lines: [
      { role: "buyer", en: "Before we can order, our compliance team needs to verify all certifications. Do you have EN71-3, CE, REACH, and the new PPWR packaging compliance? We need full documentation.", cn: "下单前，我们合规团队需要验证所有认证。你们有EN71-3、CE、REACH和新的PPWR包装合规吗？我们需要完整文件。" },
      { role: "you", en: "Absolutely — compliance is one of our core strengths, and I have everything ready to share with your team today. Let me give you a complete overview: EU Product Safety: EN71 Part 1 (mechanical & physical), Part 2 (flammability), Part 3 (migration of 19 elements including lead, cadmium, mercury) — all tested by SGS, report number SGS-CN-2026-081547, valid through March 2027. CE Marking: EU Declaration of Conformity issued, covering Toy Safety Directive 2009/48/EC. REACH: SVHC compliance updated to the latest 2026 ECHA list (240 substances) — all below 0.1% threshold, full test report from Intertek attached. PPWR Packaging: This is where we're ahead — our packaging is 100% FSC-certified recyclable cardboard, no plastic windows or shrink wrap, 35% recycled content (exceeding the 2030 requirement of 30%). We provide a Packaging Declaration per shipment and are registered in Germany's LUCID (registration number: DE 123456789). I've created a shared folder with all documents organized by category — your compliance team can download everything at once. I've also included a compliance summary sheet that maps each requirement to the corresponding document, so they don't have to search. Is there anything specific your team looks for that I should add? I'm happy to arrange additional testing if needed.", cn: "当然——合规是我们的核心优势之一，我今天就可以把所有文件发给您的团队。我给您一个完整概览：欧盟产品安全：EN71第1部分（机械物理）、第2部分（易燃性）、第3部分（19种元素迁移，包括铅、镉、汞）——全部由SGS检测，报告号SGS-CN-2026-081547，有效期至2027年3月。CE标志：已出具欧盟符合性声明，涵盖玩具安全指令2009/48/EC。REACH：SVHC合规已更新至最新2026年ECHA清单（240种物质）——全部低于0.1%阈值，Intertek完整检测报告附后。PPWR包装：这是我们领先的地方——我们的包装是100%FSC认证可回收纸板，无塑料窗或收缩包装，再生成分35%（超过2030年要求的30%）。每批发货我们都提供包装声明，并已在德国LUCID注册（注册号：DE 123456789）。我创建了一个共享文件夹，所有文件按类别整理——您的合规团队可以一次性下载所有内容。我还附了一份合规摘要表，将每项要求对应到相应文件，这样他们不用搜索。您的团队还有什么特别需要我补充的吗？如果需要额外检测我很乐意安排。" },
      { role: "buyer", en: "This is the most organized compliance package I've ever received. One thing — we also need a biodegradability test for the ink. Can you do that?", cn: "这是我收到过最有条理的合规文件包。还有一件事——我们还需要墨水的可生物降解性测试。你们能做吗？",

      { role: "you", en: "Great question — biodegradability testing is a specialized test that we don't currently have, but I can arrange it for you immediately. Here are the details: We'll use SGS's OECD 301B biodegradability test (CO2 evolution test), which is the standard method accepted across the EU. Timeline: 2-3 weeks (the test itself takes 28 days of incubation, but SGS has an expedited option with preliminary results in 10 days). Cost: USD 650 for the full test. Since this is for your first order with us, I'll cover 50% (USD 325) as a goodwill gesture — you only pay USD 325. If you place a repeat order within 6 months, I'll credit the full USD 650 back to you. I can start the process today — I just need your written confirmation to proceed with SGS. The test will be on our standard water-based ink formula. If you need it tested on a specific custom color, please let me know and I'll include that too. Shall I initiate the test today?", cn: "好问题——可生物降解性测试是一项专项检测，我们目前没有，但我可以立即为您安排。详情如下：我们将使用SGS的OECD 301B可生物降解性测试（CO2释放测试），这是全欧盟接受的标准方法。时间：2-3周（测试本身需要28天培养，但SGS有加急选项，10天出初步结果）。费用：完整测试650美元。因为这是您的首单，我承担50%（325美元）作为心意——您只付325美元。如果您6个月内返单，我把全额650美元都退给您。我今天就可以启动——只需要您书面确认同意SGS检测。测试将在我们的标准水性墨水配方上进行。如果您需要在特定定制颜色上测试，请告诉我，我也会包含进去。今天就启动测试吗？" }

全数据表、原产地证。您的团队每单节省数小时。4）主动更新：新法规出台时（如REACH每年两次的SVHC更新），我们主动检测并更新报告——您不用催。我不是说价格不重要——但我是说，对零售买家而言，和不合规供应商合作的总成本，远高于单价差异。如果我分享一个客户案例——他们因为前供应商的合规问题转投我们——会有帮助吗？" }

  aiPractice: {
    situation: "你的客户来自荷兰，是一家大型零售连锁的合规经理。她正在审核你的供应商资质，对认证和合规要求非常严格，并且提到你们的一个竞争对手因为REACH不合规被他们淘汰了。",

    rounds: [

      { ai: "The samples arrived and the refillable system is impressive. We'd like to order 5,000 sets of the refillable marker plus 10,000 refill packs for the spring promotion. Can you also include the POS display materials? And what's the delivery timeline — we need everything by August 25th for the promotion launch.", cn: "样品到了，可换芯系统令人印象深刻。我们想订5000套可换芯马克笔加10000包替芯，用于春季促销。能包含POS陈列物料吗？交货时间怎样——我们需要8月25日前收到所有货物，用于促销启动。",

uction to 12 working days by running overtime — departure August 18, arrival September 5, delivery September 8-10. This still misses August 25 by 2 weeks. My strong recommendation: Option A. You get the promotion launched on time with 1,000 sets (enough for 20-30 stores), and the bulk arrives 3 weeks later. The $600 I'm contributing covers half the air freight, and the early-adopter pricing already saves you 8%. I'll confirm production today and send the proforma invoice within 2 hours. Once you confirm the 30% deposit, I'll lock the production slot and book both air and sea freight. Shall we go with Option A? I want to make sure your spring promotion is a huge success.",

function loadCoursesFromRemote(){
  /* 第一步：尝试加载courses.json（完整课程包，兼容旧版本） */
  return fetch("courses.json?v=" + Date.now(), {cache:"no-store"})
    .then(r => r.json())
    .then(data => {
      try{
        const newCourses = new Function("return " + data.courses)();
        const newPodcasts = new Function("return " + data.podcasts)();
        if(newCourses && Array.isArray(newCourses) && newCourses.length > 0){
          window.COURSES = newCourses;
        }
        if(newPodcasts && Array.isArray(newPodcasts) && newPodcasts.length > 0){
          window.PODCASTS = newPodcasts;
        }
        if(newCourses && newCourses.length > 0){
          store.courseVersion = data.version;
          saveStore();
        }
      }catch(e){ console.warn("courses.json解析失败", e); }
      return true;
    })
    .catch(() => {
      console.warn("courses.json加载失败，使用内置课程");
      return false;
    })
    .then(() => {
      /* 第二步：动态加载独立课程文件（course-01.json ~ course-99.json）
         这是自动更新的核心：每次新增课程只需上传一个小文件 */
      const loadPromises = [];
      for(let i = 1; i <= 99; i++){
        const num = String(i).padStart(2, "0");
        const url = "courses/course-" + num + ".json?v=" + Date.now();
        loadPromises.push(
          fetch(url, {cache:"no-store"})
            .then(r => {
              if(!r.ok) throw new Error("not found");
              return r.json();
            })
            .then(courseData => {
              /* 检查课程是否已存在，避免重复 */
              const exists = window.COURSES.some(c => c.id === courseData.id);
              if(!exists){
                window.COURSES.push(courseData);
                console.log("动态加载课程:", courseData.title);
              }
              return true;
            })
            .catch(() => false)
        );
      }
      return Promise.all(loadPromises).then(() => {
        /* 按课程编号排序 */
        if(window.COURSES && Array.isArray(window.COURSES)){
          window.COURSES.sort((a, b) => {
            const na = parseInt(a.num) || 0;
            const nb = parseInt(b.num) || 0;
            return na - nb;
          });
          console.log("课程加载完成，共" + window.COURSES.length + "节课");
        } else {
          console.warn("window.COURSES未定义，跳过排序");
        }
        return true;
      });
    })
    .then(() => {
      /* 第三步：动态加载独立播客文件（podcasts/podcast-01.json ~ podcast-99.json） */
      const podcastPromises = [];
window.PODCASTS = PODCASTS;

      for(let i = 1; i <= 99; i++){
        const num = String(i).padStart(2, "0");
        const url = "podcasts/podcast-" + num + ".json?v=" + Date.now();
        podcastPromises.push(
          fetch(url, {cache:"no-store"})
            .then(r => {
              if(!r.ok) throw new Error("not found");
              return r.json();
            })
            .then(podcastData => {
              const exists = window.PODCASTS.some(p => p.id === podcastData.id);
              if(!exists){
                window.PODCASTS.push(podcastData);
                console.log("动态加载播客:", podcastData.titleCn);

              return true;

        );

        } else {
          console.warn("window.PODCASTS未定义，跳过排序");

<script>
/* ============================================================
   TradeSpeak 引擎
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const app = $("#app");

/* ---------- 进度存储 ---------- */
const STORE_KEY = "tradespeak_v1";
let store = loadStore();
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || freshStore(); }
  catch(e){ return freshStore(); }
}
function freshStore(){
  return { firstUse: Date.now(), settings:{voice:"en-GB", rate:0.92},
    courses:{}, podcasts:{} }; // courses: id -> {steps,checklist,aiBest}; podcasts: id -> {lastLine,done}
}
function saveStore(){
  store.updated_at = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  pushCloud();
}
function courseState(id){
  if(!store.courses[id]) store.courses[id] = { steps:[], checklist:[], aiBest:null };
  return store.courses[id];
}

/* ============================================================
   云同步层（手机 / 电脑多设备实时同步）
   ============================================================ */
const DEFAULT_SYNC_KEY = "quinn-ts-2026";
const SYNC = {
  online: /^https?:/.test(location.protocol),
  key: null, deviceId: null, es: null,
  timer: null, status: "boot", booted: false
};
SYNC.deviceId = (() => {
  try{
    let d = localStorage.getItem("ts_device");
    if(!d){ d = "dev-" + Math.random().toString(36).slice(2, 9); localStorage.setItem("ts_device", d); }
    return d;
  }catch(e){ return "dev-local"; }
})();
SYNC.key = (() => {
  try{
    const qp = new URLSearchParams(location.search).get("sync");
    if(qp){ localStorage.setItem("ts_sync_key", qp); return qp; }
    let k = localStorage.getItem("ts_sync_key");
    if(!k){ k = DEFAULT_SYNC_KEY; localStorage.setItem("ts_sync_key", k); }
    const u = new URL(location.href);
    u.searchParams.set("sync", k);
    history.replaceState(null, "", u);
    return k;
  }catch(e){ return DEFAULT_SYNC_KEY; }
})();

function setSyncStatus(s){
  SYNC.status = s;
  const chip = document.getElementById("sync-chip");
  if(chip){
    if(s === "ok"){ chip.innerHTML = "☁ 已同步"; chip.classList.add("on"); }
    else if(s === "sync"){ chip.innerHTML = "⟳ 同步中"; chip.classList.remove("on"); }
    else if(s === "offline"){ chip.innerHTML = "⚪ 离线·本地保存"; chip.classList.remove("on"); }
  }
}
function pushCloud(){
  if(!SYNC.online) return;
  setSyncStatus("sync");
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => {
    fetch("/api/progress?key=" + encodeURIComponent(SYNC.key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({}, store, { __device: SYNC.deviceId }))
    }).then(() => setSyncStatus("ok")).catch(() => setSyncStatus("offline"));
  }, 350);
}
function pullCloud(){
  if(!SYNC.online) return Promise.resolve(null);
  return fetch("/api/progress?key=" + encodeURIComponent(SYNC.key))
    .then(r => r.json())
    .then(remote => {
      setSyncStatus("ok");
      if(remote && remote.updated_at && (!store.updated_at || remote.updated_at > store.updated_at)){
        return remote;
      }
      return null;
    })
    .catch(() => { setSyncStatus("offline"); return null; });
}
function applyRemote(remote){
  if(!remote) return;
  const remoteCurrent = remote.current || null;
  delete remote.__device;
  store = Object.assign({}, remote);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  if(SYNC.booted){
    /* 播客连播中不重渲染页面（避免打断收听），进度静默合并 */
    if(!podState.playing){
      render();
      toast("☁ 已从另一台设备同步进度");
    }
  } else {
    render(); /* 冷启动拉到云端更新后静默重渲染 */
  }
  if(remoteCurrent && remoteCurrent.device !== SYNC.deviceId &&
     (Date.now() - remoteCurrent.at) < 10 * 60 * 1000){
    showSyncBanner(remoteCurrent);
  }
}
function connectSSE(){
  if(!SYNC.online || typeof EventSource === "undefined") return;
  try{
    SYNC.es = new EventSource("/api/events?key=" + encodeURIComponent(SYNC.key) + "&device=" + encodeURIComponent(SYNC.deviceId));
    SYNC.es.onmessage = e => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === "sync" && msg.from !== SYNC.deviceId && msg.progress){
          if(msg.progress.updated_at >= (store.updated_at || 0)) applyRemote(msg.progress);
        }
      }catch(err){}
    };
    SYNC.es.onopen = () => { setSyncStatus("ok"); pullCloud().then(r => { if(r) applyRemote(r); }); };
    SYNC.es.onerror = () => { setSyncStatus("offline"); };
  }catch(e){}
}

/* 声音选择：按目标口音打分（伦敦腔 en-GB 优选英国声优） */
function pickVoice(voice){
  const want = (store.settings.voice || "en-GB").toLowerCase(); // "en-gb" / "en-us"
  const score = v => {
    let s = 0;
    const lang = (v.lang || "").replace("_","-").toLowerCase();
    const name = (v.name || "").toLowerCase();
    if(lang === want) s += 10;
    else if(lang.startsWith("en-")) s += 2;
    if(/natural|neural|premium|enhanced|google|online/i.test(v.name || "")) s += 4;
    if(want === "en-gb" && /sonia|libby|ryan|daniel|kate|serena|maisie|thomas|arthur|uk english|british|england/i.test(v.name || "")) s += 4;
    if(want === "en-us" && /aria|jenny|guy|samantha|zira|david|mark|us english/i.test(v.name || "")) s += 4;
    /* 男女声区分：female优先女声名字，male优先男声名字 */
    if(voice === "female"){
      if(/sonia|libby|kate|serena|maisie|aria|jenny|samantha|zira|female|woman|girl/i.test(name)) s += 8;
      if(/ryan|daniel|thomas|arthur|guy|david|mark|male|man|boy/i.test(name)) s -= 5;
    } else if(voice === "male"){
      if(/ryan|daniel|thomas|arthur|guy|david|mark|male|man|boy/i.test(name)) s += 8;
      if(/sonia|libby|kate|serena|maisie|aria|jenny|samantha|zira|female|woman|girl/i.test(name)) s -= 5;
    }
    return s;
  };
  const pool = VOICES.filter(v => /^en[-_]/i.test((v.lang || "").replace("_","-")));
  if(pool.length === 0) return null;
  return pool.sort((a,b) => score(b) - score(a))[0];
}

/* 平台判断：Android Chrome 的系统 TTS 非常不稳定，优先走音频流兜底 */
const UA = navigator.userAgent;
const IS_ANDROID_CHROME = /Android/.test(UA) && /Chrome/.test(UA) && !/Edg/.test(UA);

/* ============================================================
   内置音频播放（预生成 en-GB-SoniaNeural 伦敦腔 MP3）
   文件名 = FNV-1a(规范化文本) 的十六进制，与生成脚本完全一致
   ============================================================ */
function audioId(text){
  const s = String(text).replace(/\s+/g, " ").trim();
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}
let AUDIO_SET = null; /* null=未加载，Set=已加载的音频id集合 */
(function loadAudioManifest(){
  if(!/^https?:/.test(location.protocol)){ AUDIO_SET = new Set(); return; }
  fetch("audio/manifest.json")
    .then(r => r.json())
    .then(m => { AUDIO_SET = new Set(m.ids || []); })
    .catch(() => { AUDIO_SET = new Set(); });
})();

let speakToken = 0;
let __keepUtter = null; /* 防 iOS Safari 垃圾回收导致静音 */
let __currentAudio = null; /* 当前正在播放的音频（内置/兜底） */

/* 播放内置静态 MP3（不依赖任何系统 TTS / 外部服务） */
function playPackedAudio(url, {onend, onstart, rate} = {}){
  const a = new Audio(url);
  __currentAudio = a;
  a.preload = "auto";
  /* 音频生成为 -10% 慢速；把设置中的 0.92 视作基准 1.0 */
  const mapped = (rate || store.settings.rate || 0.92) / 0.92;
  if(isFinite(mapped) && mapped > 0.3 && mapped < 3) a.playbackRate = mapped;
  a.onplaying = () => { onstart && onstart(); };
  a.onended = () => { if(__currentAudio === a) __currentAudio = null; onend && onend(); };
  a.onerror = () => { if(__currentAudio === a) __currentAudio = null; onend && onend(); };
  const p = a.play();
  if(p && p.catch) p.catch(() => { if(__currentAudio === a) __currentAudio = null; onend && onend(); });
  return a;
}

/* 兜底音频 TTS（Google Translate TTS）—— 不依赖系统 TTS 服务 */
function audioSpeak(text, lang, {onend, onstart} = {}){
  const tl = (lang === "en-US") ? "en" : "en-GB"; /* en / en-GB 为 Google 支持码 */
  const max = 180;
  if(text.length > max){ text = text.slice(0, max); }
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${tl}&q=${encodeURIComponent(text)}`;
  const audio = new Audio(url);
  __currentAudio = audio;
  audio.preload = "auto";
  if(onstart){
    audio.oncanplaythrough = () => { try{ onstart(); }catch(e){} };
  }
  audio.onended = () => { __currentAudio = null; onend && onend(); };
  audio.onerror = () => {
    __currentAudio = null;
    onend && onend();
    throw new Error("audio tts failed");
  };
  return audio.play();
}

/* 浏览器原生 Web Speech 发音 */
/* 移动端检测：iOS Safari 和 Android Chrome 对自动播放限制严格 */
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
let audioUnlocked = false;
/* 用户首次交互时解锁音频（移动端必须） */
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    /* 播放一个极短的静音来解锁iOS音频 */
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; u.rate = 2;
    speechSynthesis.speak(u);
  }catch(e){}
  /* 同时解锁AudioContext */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ const ctx = new AC(); ctx.resume(); }
  }catch(e){}
}
/* 页面首次点击/触摸时解锁音频 */
document.addEventListener("touchstart", unlockAudio, {once:true});
document.addEventListener("click", unlockAudio, {once:true});

function webSpeak(text, {onend, onstart, rate, voice, onerror} = {}){
  if(!("speechSynthesis" in window)){ 
    toast("当前浏览器不支持语音合成，请用 Chrome / Edge / Safari 打开"); 
    onerror && onerror({error: "not-supported"});
    onend && onend(); 
    return; 
  }
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  refreshVoices();
  /* iOS特殊处理：确保语音合成在用户交互后启动 */
  if(isIOS && !audioUnlocked){
    unlockAudio();
  }
  /* 真人感优化：英式发音 + 自然语速 + 男女声区分 */
  const u = new SpeechSynthesisUtterance(text);
  u.lang = store.settings.voice || "en-GB";
  u.rate = rate || store.settings.rate || 0.88;
  /* 男女声区分：female音调略高，male音调略低 */
  u.pitch = voice === "female" ? 1.08 : (voice === "male" ? 0.88 : 0.96);
  u.volume = 1.0;
  const v = pickVoice(voice);
  if(v){ u.voice = v; u.lang = v.lang || u.lang; }
  const my = ++speakToken;
  let started = false;
  u.onstart = () => { started = true; onstart && onstart(my); };
  u.onend = () => { if(my === speakToken) onend && onend(); };
  u.onerror = (ev) => {
    if(my !== speakToken) return;
    const err = ev && ev.error;
    console.warn("webSpeak error:", err, "text:", text.substring(0,50));
    if(err === "not-allowed" || err === "service-unavailable"){
      toast("🔊 需点击播放按钮才能发声");
      audioUnlocked = false;
    }
    window.__speakRetried = false;
    /* 调用外部onerror回调，让speak函数决定是否回退 */
    onerror && onerror({error: err});
    onend && onend();
  };
  __keepUtter = u;
  speechSynthesis.speak(u);
  /* 静默失败看门狗：3秒内未开始播放，认为失败（给足时间，避免误中断） */
  setTimeout(() => {
    if(my === speakToken && !started && !speechSynthesis.speaking && !speechSynthesis.pending){
      console.warn("webSpeak watchdog: no playback detected for:", text.substring(0,50));
      onerror && onerror({error: "watchdog-timeout"});
      onend && onend();
    }
  }, 3000);
}

/* 统一发音入口：优先内置 MP3 → Android 音频流兜底 → Web Speech 兜底 */
function speak(text, {onend, onstart, rate, voice} = {}){
  const t = String(text).replace(/\s+/g, " ").trim();
  if(!t){ onend && onend(); return; }
  /* 移动端：每次播放前确保音频已解锁 */
  if(isMobile) unlockAudio();
  if(AUDIO_SET && AUDIO_SET.size > 0){
    const id = audioId(t);
    if(AUDIO_SET.has(id)){
      playPackedAudio("audio/" + id + ".mp3", {onend, onstart, rate});
      return;
    }
  }
  /* 最可靠的基础版本：直接使用浏览器原生Web Speech API
     这是所有现代浏览器（Chrome/Edge/Safari）都支持的标准API
     如果设备有TTS引擎，就能正常播放 */
  try{
    if(!("speechSynthesis" in window)){
      toast("当前浏览器不支持语音合成，请用 Chrome / Edge / Safari 打开");
      onend && onend();
      return;
    }
    speechSynthesis.cancel();
    if(speechSynthesis.paused) speechSynthesis.resume();
    refreshVoices();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = (store.settings && store.settings.voice) || "en-GB";
    u.rate = rate || (store.settings && store.settings.rate) || 0.9;
    u.pitch = voice === "female" ? 1.08 : (voice === "male" ? 0.88 : 0.96);
    u.volume = 1.0;
    const v = pickVoice(voice);
    if(v){ u.voice = v; u.lang = v.lang || u.lang; }
    u.onstart = () => { onstart && onstart(); };
    u.onend = () => { onend && onend(); };
    u.onerror = (e) => {
      console.warn("speak error:", e && e.error, "text:", t.substring(0,50));
      /* 原生TTS失败时，回退到Google Translate在线TTS */
      audioSpeak(t, store.settings.voice, {onend, onstart}).catch(() => {
        toast("🔇 语音合成失败，请检查设备音量和网络连接");
        onend && onend();
      });
    };
    speechSynthesis.speak(u);
    /* 3秒看门狗：如果原生TTS没有开始播放，回退到在线TTS */
    const watchdog = setTimeout(() => {
      if(!speechSynthesis.speaking && !speechSynthesis.pending){
        console.warn("speak watchdog: no playback, falling back to online TTS");
        speechSynthesis.cancel();
        audioSpeak(t, store.settings.voice, {onend, onstart}).catch(() => {
          toast("🔇 语音合成失败，请检查设备音量和网络连接");
          onend && onend();
        });
      }
    }, 3000);
    /* 播放开始时清除看门狗 */
    u.onstart = () => { clearTimeout(watchdog); onstart && onstart(); };
  }catch(e){
    console.error("speak exception:", e);
    toast("🔇 语音合成异常: " + e.message);
    onend && onend();
  }
}
function stopSpeak(){
  speakToken++;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(__currentAudio){ try{ __currentAudio.pause(); __currentAudio.currentTime = 0; }catch(e){} __currentAudio = null; }
}

/* ---------- 语音识别 ---------- */
const ASR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, recActive = false, listeningBadge = null;
function startListen(onResult, onEnd){
  if(!ASR){ toast("此浏览器不支持语音识别，请用 Chrome / Edge 打开"); onEnd && onEnd(); return; }
  if(recActive){ try{ rec.stop(); }catch(e){} recActive = false; hideBadge(); }
  rec = new ASR();
  rec.lang = store.settings.voice === "en-US" ? "en-US" : "en-GB"; /* 识别口音跟随朗读偏好 */
  rec.interimResults = false; rec.maxAlternatives = 1;
  recActive = true;
  showBadge("正在聆听 · 请开口说英文");
  rec.onresult = e => {
    const said = e.results[0][0].transcript;
    const conf = e.results[0][0].confidence || 1;
    /* 防误触发：结果太短(<3字符)或置信度太低(<0.3)视为噪音，不自动回复 */
    if(said.trim().length < 3 || conf < 0.3){
      hideBadge(); toast("没听清，请再大声说一遍"); onEnd && onEnd(); return;
    }
    hideBadge(); onResult(said);
  };
  rec.onerror = e => {
    hideBadge();
    if(e.error === "not-allowed") toast("麦克风被拒绝，请在浏览器地址栏允许麦克风权限");
    else if(e.error === "network") toast("语音识别需要联网");
    else if(e.error === "no-speech") toast("没听到声音，再试一次");
    onEnd && onEnd();
  };
  rec.onend = () => { recActive = false; hideBadge(); onEnd && onEnd(); };
  try{ rec.start(); }catch(e){ recActive = false; hideBadge(); }
}
function stopListen(){ if(rec && recActive){ try{ rec.stop(); }catch(e){} } }
function showBadge(txt){
  removeBadge();
  listeningBadge = document.createElement("div");
  listeningBadge.className = "listening-badge";
  listeningBadge.innerHTML = `<span class="mic-dot"></span>${txt}`;

/* ---------- 跟读评分 ---------- */
function normTxt(s){
  return (s||"").toLowerCase()
    .replace(/[’']/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function scoreRead(target, said){
  const T = normTxt(target).split(" ").filter(Boolean);
  const S = new Set(normTxt(said).split(" ").filter(Boolean));
  let hit = 0; T.forEach(w => { if(S.has(w)) hit++; });
  const cover = T.length ? hit / T.length : 0;
  return Math.round(Math.min(100, cover * 92 + (S.size ? Math.min(hit/S.size,1) * 8 : 0)));
}
function readStars(sc){
  if(sc >= 85) return {cls:"good", label:"★ 地道"};
  if(sc >= 65) return {cls:"mid", label:"★★ 不错"};
  if(sc >= 40) return {cls:"mid", label:"★ 再练"};
  return {cls:"bad", label:"再试一次"};
}

/* ---------- 工具 ---------- */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
let toastTimer = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}
function hl(text, keys){
  let out = esc(text);
  keys.forEach(k => {
    const re = new RegExp("\\b(" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")\\b","gi");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}

/* ---------- 路由 ---------- */
let route = {view:"home", courseId:null, step:0, podId:null};
function parseHash(){
  const h = location.hash.replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  if(parts[0] === "course" && parts[1]){
    const c = COURSES.find(x => x.id === parts[1]);
    if(c){
      let step = parseInt(parts[2]||"0",10);
      if(isNaN(step) || step < 0 || step >= STEPS.length) step = 0;
      route = {view:"course", courseId:c.id, step, podId:null};
      return;
    }
  }
  if(parts[0] === "podcasts"){
    route = {view:"podcasts", courseId:null, step:0, podId:null};
    return;
  }
  if(parts[0] === "podcast" && parts[1]){
    const p = (typeof PODCASTS !== "undefined") && PODCASTS.find(x => x.id === parts[1]);
    if(p){ route = {view:"podcast", courseId:null, step:0, podId:p.id}; return; }
    route = {view:"podcasts", courseId:null, step:0, podId:null};
    return;
  }
  route = {view:"home", courseId:null, step:0, podId:null};
}

/* ============================================================
   课程自动解锁：根据COURSE_SCHEDULE的release日期判断是否解锁
   每2-3天解锁一节新课，未解锁的课程显示"即将解锁"
   ============================================================ */
function isCourseUnlocked(courseId){
  if(typeof COURSE_SCHEDULE === "undefined") return true;
  const sched = COURSE_SCHEDULE.find(s => s.id === courseId);
  if(!sched) return true; /* 没有排期的课程默认解锁 */
  const today = new Date();
  today.setHours(0,0,0,0);
  const release = new Date(sched.release + "T00:00:00");
  return today >= release;
}
function getCourseReleaseDate(courseId){
  if(typeof COURSE_SCHEDULE === "undefined") return null;
  const sched = COURSE_SCHEDULE.find(s => s.id === courseId);
  return sched ? sched.release : null;
}
function daysUntilRelease(courseId){
  const rel = getCourseReleaseDate(courseId);
  if(!rel) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const release = new Date(rel + "T00:00:00");
  return Math.ceil((release - today) / (1000*60*60*24));
}

function bindVocab(){
  $$(".vcard").forEach(card => {
    const idx = +card.querySelector("[data-vp]").dataset.vp;
    card.addEventListener("click", e => {
      if(e.target.closest(".play-ico")) return;
      const c = COURSES.find(x=>x.id===route.courseId);
      const v = c.vocab[idx];
      const cn = card.querySelector("[data-cn]");
      const already = cn.style.display !== "none";
      if(!already){
        card.querySelector("[data-reveal]").style.display = "none";
        card.querySelector("[data-excn]").style.display = "block";
        cn.style.display = "block";
        card.classList.add("seen");
        speak(v.word); /* 只播单词发音，不自动播例句 */
      }
    });
  });
  $$("[data-vp]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const c = COURSES.find(x=>x.id===route.courseId);
    const v = c.vocab[+b.dataset.vp];
    if(b.classList.contains("playing")){ stopSpeak(); return; }
    $$(".play-ico.playing").forEach(x=>x.classList.remove("playing"));

    speak(v.word, {onend:()=>b.classList.remove("playing")}); /* 只播单词 */
  }));
  /* 例句播放按钮 */
  $$("[data-ve]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();

    $$(".play-ico.playing").forEach(x=>x.classList.remove("playing"));
    b.classList.add("playing");
    speak(v.ex, {onend:()=>b.classList.remove("playing")});
  }));
}

function renderDialog(c){
  const mk = (d, tag) => `
  <div class="panel">
    <div class="dlg-head">

        <div class="dlg-sub">${d.sub} · ${d.lines.length} 轮</div>
      </div>
      <button class="btn btn-o" style="margin-left:auto" data-playall="${tag}" id="pa-${tag}">▶ 整段连播</button>
    </div>
    ${d.lines.map((l,i)=>`
    <div class="bubble ${l.role}" data-line="${tag}-${i}">
      <div class="bub-avatar"><span style="font-family:var(--serif);font-weight:700;font-size:15px;color:${l.role==="buyer"? 'var(--green)' : 'var(--gold)'}">${l.role==="buyer"? "B" : "Q"}</span></div>
      <div class="bub-body">
        <div class="bub-name">${l.role==="buyer" ? "Buyer · 客户" : "You · 你"}</div>
        <div class="bub-text">${esc(l.en)}</div>
        <div class="bub-cn">${l.cn}</div>
        <div class="bub-ctrl">
          <button class="bub-play" title="播放本句" data-dp="${tag}-${i}">▶</button>
          <button class="bub-shadow" title="跟读本句（说英文，AI 打分）" data-ds="${tag}-${i}">🎙</button>
          <span class="read-score" data-score="${tag}-${i}" style="display:none"></span>
        </div>
      </div>
    </div>`).join("")}
  </div>`;
  return mk(c.dialogueA, "A") + mk(c.dialogueB, "B");
}
function getDlg(c, tag){ return tag === "A" ? c.dialogueA : c.dialogueB; }
function playDialogueSeq(c, tag){
  const d = getDlg(c, tag);
  const st = dlgPlayState;
  if(st.active && st.tag === tag){ stopSpeak(); st.active = false; setPA(tag, false); return; }
  stopSpeak(); st.active = true; st.tag = tag; st.courseId = c.id;
  setPA(tag, true);
  let i = 0;
  const next = () => {
    if(!st.active || st.tag !== tag || i >= d.lines.length){
      st.active = false; setPA(tag, false); clearActive(); return;
    }
    highlightLine(tag, i);
    const line = d.lines[i];
    speak(line.en, {onend:()=>{ i++; setTimeout(next, 320); }});
  };
  next();
}
function setPA(tag, playing){
  const b = $("#pa-" + tag);
  if(b) b.innerHTML = playing ? "■ 停止连播" : "▶ 整段连播";
}
function highlightLine(tag, i){
  clearActive();
  const el = document.querySelector(`[data-line="${tag}-${i}"]`);
  if(el){ el.classList.add("active"); el.scrollIntoView({block:"center", behavior:"smooth"}); }
}
function clearActive(){ $$(".bubble.active").forEach(b=>b.classList.remove("active")); }

function bindDialog(c){
  $$("[data-playall]").forEach(b => b.addEventListener("click", () => playDialogueSeq(c, b.dataset.playall)));
  $$("[data-dp]").forEach(b => b.addEventListener("click", () => {
    const [tag, i] = b.dataset.dp.split("-");
    stopSpeak(); dlgPlayState.active = false; setPA("A", false); setPA("B", false);
    highlightLine(tag, +i);
    speak(getDlg(c, tag).lines[+i].en, {onend: clearActive});
  }));
  $$("[data-ds]").forEach(b => b.addEventListener("click", () => {
    const [tag, i] = b.dataset.ds.split("-");
    const line = getDlg(c, tag).lines[+i];
    const scoreEl = document.querySelector(`[data-score="${tag}-${i}"]`);
    stopSpeak();
    startListen(said => {
      const sc = scoreRead(line.en, said);
      const st = readStars(sc);
      scoreEl.style.display = "inline-block";
      scoreEl.className = "read-score " + st.cls;
      scoreEl.textContent = `${st.label} ${sc}分`;
      scoreEl.title = "你说：" + said;
      if(sc < 40){
        toast("再试一次，或先听一遍原声");
      } else if(sc >= 85){
        toast("很地道！这句可以拿下客户了");
      }
    });
  }));
}

    const v = inp.value.trim().toLowerCase();
    if(!v){ inp.className = "fill-input"; const a=inp.parentElement.querySelector(".fill-answer"); if(a)a.remove(); return; }
    const correct = v === f.answer.toLowerCase();
    /* 输入时只标记对错颜色，不显示正确答案 */
    inp.className = "fill-input " + (correct ? "ok" : "no");

    }

function aiAppendRaw(role, text, cn, autoplay, onend){

  /* 【关键修复】所有设备全部取消自动播放，必须用户手动点击按钮才发声
     原因：安卓/鸿蒙/iOS浏览器禁止异步上下文自动播放TTS，自动播放会被静默拦截导致完全无声 */
  const showPlayBtn = autoplay && role !== "me";
  const playBtnHtml = showPlayBtn ? `<span class="mobile-play-btn" style="display:inline-block;margin-left:8px;padding:3px 12px;background:var(--green);color:#fff;border-radius:999px;font-size:12px;cursor:pointer;font-weight:600">🔊 点击播放</span>` : "";

  if(role !== "me"){
    div.querySelector(".replay").addEventListener("click", () => { unlockAudio(); speak(text); });
  }
  /* 点击播放按钮：同步回调中直接调用speak，确保安卓/鸿蒙有权限 */
  if(showPlayBtn){
    const btn = div.querySelector(".mobile-play-btn");
    if(btn) btn.addEventListener("click", function(){
      btn.style.display = "none";
      unlockAudio();
      /* 必须在这个同步点击回调里直接speak，不能用setTimeout/await */
      speak(text, {onend: function(){ onend && onend(); }});
    });
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  /* 完全取消自动播放，必须用户点击 */
  if(showPlayBtn){
    /* 不自动播放，等用户点击按钮；但需要触发onend让对话继续吗？不，对话应该等用户听完再继续 */
    /* 这里不调用onend，因为用户还没听，AI下一句不应该出来 */
  } else {
    onend && onend();
  }
}
