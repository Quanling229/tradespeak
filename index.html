<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d5a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TradeSpeak">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%233d5a45'/%3E%3Ctext x='90' y='115' font-size='75' text-anchor='middle' fill='%23f5f1e8' font-family='Georgia,serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E">
<title>TradeSpeak · 外贸情景英语</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233d5a45'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f0ead9' font-family='serif' font-weight='bold'>T</text></svg>">
<style>
:root{
  --bg:#f7f5ef; --card:#ffffff; --ink:#252820; --ink2:#4c4e46; --ink3:#8a8d80;
  --green:#3d5a45; --green2:#7a9e7e; --green-soft:rgba(122,158,126,.12);
  --gold:#b08a4f; --gold-soft:rgba(176,138,79,.12);
  --red:#b5564a; --red-soft:rgba(181,86,74,.09);
  --line:rgba(37,40,32,.09);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow:0 2px 14px rgba(37,40,32,.07);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--green-soft)}
a{color:var(--green);text-decoration:none}
.container{max-width:960px;margin:0 auto;padding:0 20px}
/* Header */
.header{position:sticky;top:0;z-index:50;background:rgba(247,245,239,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink)}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--green);color:#f5f1e8;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:bold;font-size:18px}
.logo-sub{font-size:10px;letter-spacing:2px;color:var(--ink3);text-transform:uppercase;margin-top:2px}
.nav{display:flex;gap:6px}
.nav-btn{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--ink2);transition:all .2s}
.nav-btn:hover{background:var(--green-soft);color:var(--green)}
.nav-btn.active{background:var(--green);color:#fff}
/* Hero */
.hero{padding:80px 0 60px;text-align:center}
.hero-tag{display:inline-block;padding:6px 16px;border-radius:20px;background:var(--green-soft);color:var(--green);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.hero h1{font-family:var(--serif);font-size:clamp(36px,6vw,56px);font-weight:700;line-height:1.2;margin-bottom:20px;color:var(--ink)}
.hero h1 .accent{color:var(--green)}
.hero-desc{max-width:560px;margin:0 auto 40px;color:var(--ink2);font-size:16px;line-height:1.8}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:600;transition:all .2s;border:none;cursor:pointer}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#2d4535;transform:translateY(-1px);box-shadow:0 4px 16px rgba(61,90,69,.25)}
.btn-outline{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn-outline:hover{background:var(--green-soft)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover:enabled{background:#9a7840;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:60px}
.feature-card{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:all .3s;border:1px solid var(--line);cursor:pointer}
.feature-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(37,40,32,.1)}
.feature-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
.feature-card h3{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.feature-card p{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:12px}
.feature-card .link{font-size:14px;color:var(--green);font-weight:600}
/* Section */
.section{padding:60px 0}
.section-title{font-family:var(--serif);font-size:28px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.section-sub{color:var(--ink2);margin-bottom:32px;font-size:15px}
/* Course cards */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.course-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;transition:all .3s;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(37,40,32,.1)}
.course-cover{height:120px;display:flex;align-items:flex-end;padding:16px;position:relative;overflow:hidden}
.course-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent)}
.course-num{font-family:Georgia,serif;font-size:42px;font-weight:bold;color:rgba(255,255,255,.9);line-height:1}
.course-emoji{position:absolute;top:14px;right:16px;font-size:32px;opacity:.9}
.course-body{padding:18px;flex:1;display:flex;flex-direction:column}
.course-title{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink);line-height:1.4}
.course-meta{display:flex;gap:10px;font-size:12px;color:var(--ink3);margin-bottom:10px}
.course-meta span{display:flex;align-items:center;gap:3px}
.course-desc{font-size:13px;color:var(--ink2);line-height:1.6;flex:1}
.course-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-top:10px}
/* Podcast */
.podcast-list{display:flex;flex-direction:column;gap:14px}
.podcast-item{background:var(--card);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:20px;cursor:pointer;transition:all .2s}
.podcast-item:hover{transform:translateX(3px);box-shadow:0 4px 20px rgba(37,40,32,.08)}
.podcast-num{width:48px;height:48px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:bold;font-size:18px;flex-shrink:0}
.podcast-info{flex:1;min-width:0}
.podcast-title{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--ink)}
.podcast-meta{font-size:13px;color:var(--ink3);display:flex;gap:12px}
.podcast-play{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.podcast-item:hover .podcast-play{transform:scale(1.1)}
/* Detail page */
.detail-page{padding:40px 0 80px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;margin-bottom:24px;padding:8px 0}
.back-btn:hover{color:var(--green)}
.detail-header{margin-bottom:32px}
.detail-title{font-family:var(--serif);font-size:clamp(26px,4vw,36px);font-weight:700;margin-bottom:12px;line-height:1.3}
.detail-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink3)}
.detail-meta span{display:flex;align-items:center;gap:5px}
/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:28px;overflow-x:auto;padding-bottom:0}
.tab{padding:12px 20px;font-size:14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--ink2)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
/* Content blocks */
.block{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.block-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--ink);display:flex;align-items:center;gap:8px}
.block-title .icon{font-size:20px}
/* Vocab */
.vocab-item{padding:14px 0;border-bottom:1px solid var(--line)}
.vocab-item:last-child{border-bottom:none}
.vocab-word{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.vocab-word .word{font-size:17px;font-weight:700;color:var(--ink)}
.vocab-word .ipa{font-size:13px;color:var(--ink3);font-family:Georgia,serif}
.vocab-word .speak-btn{margin-left:auto;font-size:18px;color:var(--green);padding:4px 8px;border-radius:6px;transition:all .2s}
.vocab-word .speak-btn:hover{background:var(--green-soft)}
.vocab-cn{font-size:14px;color:var(--ink2);margin-bottom:4px}
.vocab-ex{font-size:13px;color:var(--ink3);font-style:italic;padding-left:12px;border-left:2px solid var(--green-soft)}
/* Expressions */
.expr-item{padding:14px 0;border-bottom:1px solid var(--line)}
.expr-item:last-child{border-bottom:none}
.expr-en{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;display:flex;align-items:flex-start;gap:8px}
.expr-en .speak-btn{font-size:16px;color:var(--green);padding:2px 6px;border-radius:4px;flex-shrink:0;margin-top:2px}
.expr-en .speak-btn:hover{background:var(--green-soft)}
.expr-cn{font-size:14px;color:var(--ink2);margin-bottom:4px}
.expr-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--green-soft);color:var(--green)}
/* Dialogues */
.dialogue-line{display:flex;gap:12px;margin-bottom:14px}
.dialogue-line:last-child{margin-bottom:0}
.dialogue-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;flex-shrink:0;color:#fff}
.dialogue-avatar.you{background:var(--green)}
.dialogue-avatar.client{background:var(--gold)}
.dialogue-bubble{flex:1;background:var(--bg);border-radius:12px;padding:12px 16px;position:relative}
.dialogue-bubble .speaker{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.dialogue-bubble .en{font-size:14px;color:var(--ink);margin-bottom:4px;display:flex;align-items:flex-start;gap:6px}
.dialogue-bubble .en .speak-btn{font-size:14px;color:var(--green);padding:2px 4px;border-radius:4px;flex-shrink:0}
.dialogue-bubble .cn{font-size:13px;color:var(--ink2)}
/* Exercises */
.exercise-item{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.exercise-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.exercise-q{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px}
.exercise-input{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg);transition:border-color .2s}
.exercise-input:focus{outline:none;border-color:var(--green)}
.exercise-feedback{margin-top:8px;font-size:13px;padding:8px 12px;border-radius:8px;display:none}
.exercise-feedback.correct{display:block;background:var(--green-soft);color:var(--green)}
.exercise-feedback.wrong{display:block;background:var(--red-soft);color:var(--red)}
.exercise-answer{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--gold-soft);padding:8px 12px;border-radius:8px;display:none}
.exercise-answer.show{display:block}
/* Checklist */
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checklist-item:last-child{border-bottom:none}
.checklist-box{width:20px;height:20px;border:2px solid var(--ink3);border-radius:5px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.checklist-item.checked .checklist-box{background:var(--green);border-color:var(--green)}
.checklist-item.checked .checklist-box::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.checklist-text{font-size:14px;color:var(--ink2);line-height:1.6}
.checklist-item.checked .checklist-text{text-decoration:line-through;color:var(--ink3)}
/* AI Practice */
.ai-chat{display:flex;flex-direction:column;gap:14px;min-height:300px}
.ai-msg{display:flex;gap:10px}
.ai-msg.ai{justify-content:flex-start}
.ai-msg.user{justify-content:flex-end}
.ai-bubble{max-width:80%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.6}
.ai-msg.ai .ai-bubble{background:var(--green-soft);color:var(--ink);border-bottom-left-radius:4px}
.ai-msg.user .ai-bubble{background:var(--green);color:#fff;border-bottom-right-radius:4px}
.ai-bubble .cn{font-size:12px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.06)}
.ai-msg.user .ai-bubble .cn{color:rgba(255,255,255,.7);border-top-color:rgba(255,255,255,.15)}
.ai-bubble .speak-btn{font-size:14px;color:var(--green);padding:2px 6px;border-radius:4px;margin-left:6px}
.ai-msg.user .ai-bubble .speak-btn{color:rgba(255,255,255,.8)}
.ai-input-area{display:flex;gap:10px;margin-top:16px}
.ai-input{flex:1;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:var(--bg)}
.ai-input:focus{outline:none;border-color:var(--green)}
.ai-mic-btn{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .2s}
.ai-mic-btn:hover{background:#9a7840}
.ai-mic-btn.recording{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ai-send-btn{padding:0 24px;border-radius:12px;background:var(--green);color:#fff;font-weight:600;font-size:14px}
.ai-hint{font-size:12px;color:var(--ink3);margin-top:8px;font-style:italic}
/* Podcast player */
.podcast-player{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:24px}
.podcast-player-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:8px}
.podcast-player-meta{font-size:13px;color:var(--ink3);margin-bottom:20px}
.podcast-lines{display:flex;flex-direction:column;gap:12px}
.podcast-line{display:flex;gap:12px;align-items:flex-start}
.podcast-line-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff;flex-shrink:0}
.podcast-line-avatar.emma{background:#c97b8a}
.podcast-line-avatar.james{background:#5a7a9e}
.podcast-line-content{flex:1;background:var(--bg);border-radius:10px;padding:10px 14px}
.podcast-line .en{font-size:14px;color:var(--ink);margin-bottom:3px;display:flex;align-items:flex-start;gap:6px}
.podcast-line .en .speak-btn{font-size:14px;color:var(--green);padding:2px 4px;border-radius:4px;flex-shrink:0}
.podcast-line .cn{font-size:12px;color:var(--ink2)}
/* Footer */
.footer{padding:40px 0;border-top:1px solid var(--line);text-align:center;color:var(--ink3);font-size:13px}
/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* Responsive */
@media(max-width:640px){
  .hero{padding:50px 0 40px}
  .section{padding:40px 0}
  .nav-btn{padding:6px 10px;font-size:13px}
  .block{padding:18px}
  .ai-bubble{max-width:90%}
}
/* Loading */
.loading{text-align:center;padding:60px;color:var(--ink3)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Hidden */
.hidden{display:none!important}
/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ========== 全局数据 ========== */
const COURSES = [];
const PODCASTS = [];
window.COURSES = COURSES;
window.PODCASTS = PODCASTS;

/* ========== 工具函数 ========== */
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function toast(msg,dur=2500){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}

/* ========== TTS 语音合成 ========== */
let currentUtterance = null;
let voicesLoaded = false;

function loadVoices(){
  if(typeof speechSynthesis === 'undefined') return;
  const voices = speechSynthesis.getVoices();
  if(voices.length > 0) voicesLoaded = true;
}
if(typeof speechSynthesis !== 'undefined'){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, opts={}){
  if(typeof speechSynthesis === 'undefined'){
    toast('当前浏览器不支持语音合成');
    return;
  }
  if(!text || !text.trim()) return;
  
  // 停止当前播放
  speechSynthesis.cancel();
  
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = opts.lang || 'en-US';
  utter.rate = opts.rate || 0.95;
  utter.pitch = opts.pitch || 1;
  utter.volume = opts.volume || 1;
  
  // 尝试选择英文语音
  const voices = speechSynthesis.getVoices();
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  if(enVoices.length > 0){
    // 优先选择英式或美式英语
    const preferred = enVoices.find(v => /en[-_](GB|US)/i.test(v.lang)) || enVoices[0];
    utter.voice = preferred;
  }
  
  utter.onstart = () => { currentUtterance = utter; };
  utter.onend = () => { currentUtterance = null; };
  utter.onerror = (e) => { currentUtterance = null; console.warn('TTS error:', e); };
  
  currentUtterance = utter;
  speechSynthesis.speak(utter);
}

function stopSpeak(){
  if(typeof speechSynthesis !== 'undefined'){
    speechSynthesis.cancel();
  }
  currentUtterance = null;
}

/* ========== 语音识别 ========== */
let recognition = null;
let isRecording = false;

function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    return null;
  }
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.continuous = false;
  return rec;
}

function startRecording(onResult, onError){
  if(!recognition) recognition = initRecognition();
  if(!recognition){
    toast('当前浏览器不支持语音识别，请使用Chrome浏览器');
    return false;
  }
  if(isRecording) return false;
  
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    isRecording = false;
    onResult(text);
  };
  recognition.onerror = (e) => {
    isRecording = false;
    console.warn('Recognition error:', e.error);
    if(onError) onError(e.error);
  };
  recognition.onend = () => {
    isRecording = false;
  };
  
  try{
    recognition.start();
    isRecording = true;
    return true;
  }catch(e){
    console.warn('Recognition start error:', e);
    return false;
  }
}

function stopRecording(){
  if(recognition && isRecording){
    recognition.stop();
    isRecording = false;
  }
}

/* ========== 动态加载课程和播客 ========== */
async function loadCoursesFromRemote(){
  const basePaths = ['courses', 'podcasts'];
  const loadedCourses = [];
  const loadedPodcasts = [];
  
  // 尝试加载 course-01.json 到 course-99.json
  for(let i = 1; i <= 99; i++){
    const num = String(i).padStart(2, '0');
    try{
      const res = await fetch(`courses/course-${num}.json`, {cache: 'no-store'});
      if(res.ok){
        const data = await res.json();
        if(data.id && data.title){
          loadedCourses.push(data);
        }
      }
    }catch(e){
      // 文件不存在，跳过
    }
  }
  
  // 尝试加载 podcast-01.json 到 podcast-99.json
  for(let i = 1; i <= 99; i++){
    const num = String(i).padStart(2, '0');
    try{
      const res = await fetch(`podcasts/podcast-${num}.json`, {cache: 'no-store'});
      if(res.ok){
        const data = await res.json();
        if(data.id && data.title){
          loadedPodcasts.push(data);
        }
      }
    }catch(e){
      // 文件不存在，跳过
    }
  }
  
  // 合并去重（按id）
  const existingCourseIds = new Set(COURSES.map(c => c.id));
  loadedCourses.forEach(c => {
    if(!existingCourseIds.has(c.id)){
      COURSES.push(c);
      existingCourseIds.add(c.id);
    }
  });
  
  const existingPodcastIds = new Set(PODCASTS.map(p => p.id));
  loadedPodcasts.forEach(p => {
    if(!existingPodcastIds.has(p.id)){
      PODCASTS.push(p);
      existingPodcastIds.add(p.id);
    }
  });
  
  // 按编号排序
  COURSES.sort((a,b) => parseInt(a.num) - parseInt(b.num));
  PODCASTS.sort((a,b) => parseInt(a.num) - parseInt(b.num));
  
  return {courses: loadedCourses.length, podcasts: loadedPodcasts.length};
}

/* ========== 路由 ========== */
function router(){
  const hash = location.hash || '#/';
  const app = $('#app');
  
  if(hash === '#/' || hash === '#'){
    renderHome();
  } else if(hash.startsWith('#/courses')){
    renderCourses();
  } else if(hash.startsWith('#/podcasts')){
    renderPodcasts();
  } else if(hash.startsWith('#/course/')){
    const id = hash.replace('#/course/', '').split('/')[0];
    const step = parseInt(hash.split('/')[3]) || 0;
    renderCourseDetail(id, step);
  } else if(hash.startsWith('#/podcast/')){
    const id = hash.replace('#/podcast/', '');
    renderPodcastDetail(id);
  } else if(hash.startsWith('#/ai-practice')){
    renderAIPractice();
  } else {
    renderHome();
  }
  window.scrollTo(0,0);
}

window.checkFill = function(idx, answer){
  const input = document.getElementById(`fill-${idx}`);
  const feedback = document.getElementById(`feedback-${idx}`);
  const val = input.value.trim().toLowerCase();
  if(val === answer.toLowerCase()){
    feedback.className = 'exercise-feedback correct';
    feedback.textContent = '✅ 回答正确！';
  } else {
    feedback.className = 'exercise-feedback wrong';
    feedback.textContent = '❌ 回答不正确，再想想，或点击"显示答案"';
  }
};

window.toggleCheck = function(idx, courseId){
  const key = `checklist_${courseId}`;
  let saved = JSON.parse(localStorage.getItem(key) || '[]');
  if(saved.includes(idx)){
    saved = saved.filter(i => i !== idx);
  } else {
    saved.push(idx);
  }
  localStorage.setItem(key, JSON.stringify(saved));
  // 重新渲染
  const course = COURSES.find(c => c.id === courseId);
  renderCourseChecklist(course, $('#course-tab-content'));
};

/* ========== AI实战 ========== */
let aiState = {round:0, history:[]};

function renderCourseAIPractice(course, container){
  aiState = {round:0, history:[]};

      </div>
      <div class="ai-chat" id="ai-chat"></div>
      <div class="ai-input-area">
        <button class="ai-mic-btn" id="ai-mic-btn" onclick="toggleAIMic()" title="语音输入">🎤</button>
        <input class="ai-input" id="ai-input" placeholder="输入你的英文回答，或点击麦克风说话..." onkeydown="if(event.key==='Enter')sendAIMessage()">
        <button class="ai-send-btn" onclick="sendAIMessage()">发送</button>
      </div>
      <div class="ai-hint" id="ai-hint">💡 提示：AI会根据你的回答进行追问和引导，用简单的英语表达即可</div>

  // 开始第一轮

function aiNextRound(course){
  const practice = course.aiPractice;
  if(aiState.round >= practice.rounds.length){
    const chat = $('#ai-chat');
    const msg = el('div','ai-msg ai');
    msg.innerHTML = `<div class="ai-bubble">🎉 太棒了！你完成了全部${practice.rounds.length}轮对话。你的表达越来越专业了！<div class="cn">点击左上角返回，或刷新页面重新开始</div></div>`;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return;
  }
  
  const round = practice.rounds[aiState.round];
  const chat = $('#ai-chat');
  
  const msg = el('div','ai-msg ai');
  msg.innerHTML = `
    <div class="ai-bubble">
      <div style="display:flex;align-items:flex-start;gap:6px">
        <span>${round.ai}</span>
        <button class="speak-btn" onclick="speak('${round.ai.replace(/'/g,"\\'")}')">🔊</button>
      </div>
      <div class="cn">${round.cn}</div>
    </div>
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  
  // 显示提示
  $('#ai-hint').innerHTML = `💡 提示：${round.hint}`;
}

window.sendAIMessage = function(){
  const input = $('#ai-input');
  const text = input.value.trim();
  if(!text) return;
  
  const course = COURSES.find(c => location.hash.includes(c.id));
  const practice = course.aiPractice;
  const round = practice.rounds[aiState.round];
  
  // 显示用户消息
  const chat = $('#ai-chat');
  const userMsg = el('div','ai-msg user');
  userMsg.innerHTML = `<div class="ai-bubble">${text}</div>`;
  chat.appendChild(userMsg);
  chat.scrollTop = chat.scrollHeight;
  
  input.value = '';
  
  // 评估回答
  setTimeout(() => {
    const feedback = evaluateAnswer(text, round);
    const fbMsg = el('div','ai-msg ai');
    fbMsg.innerHTML = `
      <div class="ai-bubble" style="background:var(--gold-soft)">
        <div style="font-size:13px;font-weight:600;color:var(--gold);margin-bottom:6px">📝 反馈</div>
        <div style="font-size:14px;color:var(--ink);margin-bottom:6px">${feedback.message}</div>
        ${feedback.suggestion ? `<div style="font-size:13px;color:var(--ink2);padding:8px 10px;background:rgba(255,255,255,.5);border-radius:6px;margin-top:6px">💡 更地道的说法：<br><strong>${feedback.suggestion}</strong><button class="speak-btn" onclick="speak('${feedback.suggestion.replace(/'/g,"\\'")}')">🔊</button></div>` : ''}
      </div>
    `;
    chat.appendChild(fbMsg);
    chat.scrollTop = chat.scrollHeight;
    
    // 进入下一轮
    aiState.round++;
    setTimeout(() => aiNextRound(course), 1500);
  }, 800);
};

function evaluateAnswer(text, round){
  const lower = text.toLowerCase();
  
  // 检查patterns
  let patternMatch = false;
  if(round.patterns){
    try{
      const patternStr = round.patterns.replace(/^\/|\/[a-z]*$/g, '');
      const flags = round.patterns.match(/\/([a-z]*)$/)?.[1] || '';
      const regex = new RegExp(patternStr, flags);
      patternMatch = regex.test(lower);
    }catch(e){ patternMatch = false; }
  }
  
  // 检查partial
  let partialMatch = false;
  if(round.partial){
    try{
      const patternStr = round.partial.replace(/^\/|\/[a-z]*$/g, '');
      const flags = round.partial.match(/\/([a-z]*)$/)?.[1] || '';
      const regex = new RegExp(patternStr, flags);
      partialMatch = regex.test(lower);
    }catch(e){ partialMatch = false; }
  }
  
  if(patternMatch){
    return {
      message: '✅ 非常好！你准确地使用了关键表达，回答很专业！',
      suggestion: null
    };
  } else if(partialMatch){
    return {
      message: '👍 不错！你提到了相关内容，但可以更专业一些。',
      suggestion: generateSuggestion(round)
    };
  } else {
    return {
      message: '💪 继续努力！你的回答还可以更精准。试着使用下面的表达：',
      suggestion: generateSuggestion(round)
    };
  }
}

function generateSuggestion(round){
  const suggestions = {
    0: "Welcome to our booth! We have custom colors available. Which market are you selling to?",
    1: "All our products are EN71 certified by SGS. Our MOQ is 5,000 pieces and lead time is 30 days.",
    2: "I understand your target price. Let me check what we can do. If you increase the quantity, we can offer a better price.",
    3: "Absolutely! Samples are free, you just cover the courier fee. I will send the quotation within 24 hours.",
    4: "Thank you for visiting our booth! I will send you the quotation and samples tomorrow. Let's stay in touch on WhatsApp."
  };
  return suggestions[aiState.round] || "Let me know if you have any questions.";
}

window.toggleAIMic = function(){
  const btn = $('#ai-mic-btn');
  if(isRecording){
    stopRecording();
    btn.classList.remove('recording');
    btn.textContent = '🎤';
  } else {
    const started = startRecording(
      (text) => {
        $('#ai-input').value = text;
        btn.classList.remove('recording');
        btn.textContent = '🎤';
        toast('识别完成：' + text);
      },
      (err) => {
        btn.classList.remove('recording');
        btn.textContent = '🎤';
        if(err === 'not-allowed'){
          toast('请允许麦克风权限');
        } else if(err === 'no-speech'){
          toast('没有检测到语音，请再试一次');
        } else {
          toast('语音识别出错：' + err);
        }
      }
    );
    if(started){
      btn.classList.add('recording');
      btn.textContent = '⏹';
      toast('正在聆听...请说话');
    }
  }
};

async function init(){
  const app = $('#app');
  app.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>正在加载课程内容...</p></div>';
  
  try{
    // 动态加载远程课程和播客
    const result = await loadCoursesFromRemote();
    console.log(`动态加载完成：${result.courses}节课，${result.podcasts}期播客`);
  }catch(e){
    console.warn('动态加载失败:', e);
  }
  
  // 路由
  router();
}
