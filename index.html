<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d5a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TradeSpeak">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%233d5a45'/%3E%3Ctext x='90' y='115' font-size='75' text-anchor='middle' fill='%23f5f1e8' font-family='Georgia,serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E">
<title>TradeSpeak · 外贸情景英语</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233d5a45'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f0ead9' font-family='serif' font-weight='bold'>T</text></svg>">
<style>
:root{
  --bg:#f7f5ef; --card:#ffffff; --ink:#252820; --ink2:#4c4e46; --ink3:#8a8d80;
  --green:#3d5a45; --green2:#7a9e7e; --green-soft:rgba(122,158,126,.12);
  --gold:#b08a4f; --gold-soft:rgba(176,138,79,.12);
  --red:#b5564a; --red-soft:rgba(181,86,74,.09);
  --line:rgba(37,40,32,.09);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow:0 2px 14px rgba(37,40,32,.07);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--green2);color:#fff}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,239,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;color:#f0ead9;font-family:var(--serif);font-size:19px;font-weight:700}
.brand-name{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.brand-sub{font-size:11px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.18s}
.chip:hover{border-color:var(--green2);color:var(--green)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}

/* ===== 首页 hero ===== */
.hero{max-width:1080px;margin:0 auto;padding:72px 22px 40px;text-align:center;position:relative;overflow:hidden}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(122,158,126,.35);background:var(--green-soft);color:var(--green);border-radius:999px;padding:7px 18px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:30px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,6.5vw,72px);line-height:1.16;letter-spacing:.01em}
.hero h1 .accent{color:var(--green2)}
.hero h1 .cursor{display:inline-block;width:3px;height:.95em;background:var(--green2);margin-left:4px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-sub{margin:24px auto 0;max-width:560px;color:var(--ink3);font-size:15.5px}
.hero-sub b{color:var(--gold);font-weight:600}
.hero-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:48px auto 0}
@media(max-width:760px){.hero-feats{grid-template-columns:1fr}}
.feat{background:var(--card);border-radius:var(--radius);padding:24px 22px;text-align:left;box-shadow:var(--shadow);border:1px solid rgba(37,40,32,.04)}
.feat-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px}
.feat h3{font-size:14.5px;margin-bottom:6px}
.feat p{font-size:13px;color:var(--ink3);line-height:1.65}

/* ===== 通用区块 ===== */
.wrap{max-width:1200px;margin:0 auto;padding:0 22px 90px}
.sec-title{font-family:var(--serif);font-size:26px;margin:44px 0 6px;letter-spacing:.02em}
.sec-sub{color:var(--ink3);font-size:13.5px;margin-bottom:22px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
@media(max-width:760px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:30px;color:var(--green);line-height:1.2}
.stat span{font-size:12px;color:var(--ink3)}

/* ===== 课程卡片 ===== */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.course-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.course-grid{grid-template-columns:1fr}}
.course-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .22s,box-shadow .22s;border:1px solid rgba(37,40,32,.04);display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(37,40,32,.12)}
.cc-visual{height:130px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cc-body{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
.cc-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cc-tag{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.cc-tag.lvl{background:var(--gold-soft);color:var(--gold)}
.cc-num{position:absolute;top:14px;left:18px;font-family:var(--serif);font-size:15px;color:rgba(255,255,255,.85);letter-spacing:.1em}
.cc-title{font-family:var(--serif);font-size:20px;margin-bottom:3px}
.cc-titleen{font-size:12px;color:var(--ink3);letter-spacing:.04em;margin-bottom:12px}
.cc-desc{font-size:13px;color:var(--ink2);line-height:1.68;flex:1}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cc-time{font-size:12px;color:var(--ink3)}
.cc-go{font-size:13px;color:var(--green);font-weight:600}
.prog-mini{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:14px}
.prog-mini i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:4px;transition:width .4s}

/* ===== 课程页布局 ===== */
.course-head{max-width:1200px;margin:0 auto;padding:34px 22px 0}
.crumb{font-size:12.5px;color:var(--ink3);margin-bottom:14px;cursor:pointer}
.crumb:hover{color:var(--green)}
.ch-flex{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.ch-title{font-family:var(--serif);font-size:34px;line-height:1.2}
.ch-titleen{color:var(--ink3);font-size:13.5px;margin-top:4px;letter-spacing:.05em}
.ch-meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px}
.course-progress{max-width:1200px;margin:20px auto 0;padding:0 22px}
.cp-track{height:5px;background:var(--line);border-radius:6px;overflow:hidden}
.cp-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:6px;transition:width .45s}
.cp-label{font-size:12px;color:var(--ink3);margin-top:7px;display:flex;justify-content:space-between}

.layout{max-width:1200px;margin:26px auto 0;padding:0 22px 90px;display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.sidebar{position:sticky;top:78px}
@media(max-width:900px){.sidebar{position:static}}
.side-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 14px;border:1px solid rgba(37,40,32,.04)}
@media(max-width:900px){.side-card{display:none}}
.side-title{font-size:11.5px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;padding:4px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.step-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 10px;border-radius:11px;font-size:13.5px;color:var(--ink2);transition:.15s;position:relative}
.step-item:hover{background:var(--green-soft)}
.step-item.on{background:var(--green);color:#fff;font-weight:600}
.step-item.done .step-no{background:var(--green2);color:#fff;border-color:var(--green2)}
.step-no{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;background:#fff}
.step-item.on .step-no{border-color:rgba(255,255,255,.5);background:transparent;color:#fff}
.step-item.done{color:var(--green)}

/* 移动端目录 */
.m-side-toggle{display:none}
@media(max-width:900px){
  .m-side-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);font-size:13.5px;color:var(--green);font-weight:600;margin-bottom:16px}
  .side-card.m-open{display:block;position:fixed;inset:auto 14px 14px 14px;z-index:80;max-height:65vh;overflow:auto}
}

/* ===== 内容卡片 ===== */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(37,40,32,.04);padding:30px 32px;margin-bottom:20px}
@media(max-width:640px){.panel{padding:22px 18px}}
.panel-title{font-family:var(--serif);font-size:21px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-sub{font-size:13px;color:var(--ink3);margin-bottom:22px}
.ep-visual{height:190px;border-radius:14px;overflow:hidden;position:relative;margin-bottom:22px}
.ep-desc{font-size:15px;color:var(--ink2);line-height:1.85;margin-bottom:24px;border-left:3px solid var(--green2);padding-left:16px}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.intro-grid{grid-template-columns:1fr}}
.intro-box{background:var(--bg);border-radius:14px;padding:18px 20px}
.intro-box h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.intro-box li{font-size:13.5px;color:var(--ink2);margin-bottom:9px;padding-left:18px;position:relative;line-height:1.6;list-style:none}
.intro-box li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--green2)}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;transition:.18s;border:1.5px solid transparent}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:#31503b}
.btn-o{border-color:var(--green2);color:var(--green);background:#fff}
.btn-o:hover{background:var(--green-soft)}
.btn-g{border-color:var(--gold);color:var(--gold);background:#fff}
.btn-g:hover{background:var(--gold-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.play-ico{width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:.15s}
.play-ico:hover{background:var(--green);color:#fff}
.play-ico.playing{background:var(--gold);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

/* ===== 词汇 ===== */
.oneliner{background:linear-gradient(135deg,rgba(61,90,69,.07),rgba(176,138,79,.07));border:1px solid rgba(122,158,126,.25);border-radius:14px;padding:20px 24px;margin-bottom:26px}
.oneliner h4{font-size:12px;letter-spacing:.16em;color:var(--green);text-transform:uppercase;margin-bottom:10px}
.oneliner-en{font-size:16.5px;line-height:1.9;font-family:Georgia,serif}
.oneliner-en mark{background:rgba(176,138,79,.28);color:inherit;border-radius:3px;padding:0 3px;font-weight:600}
.oneliner-cn{font-size:12.5px;color:var(--ink3);margin-top:10px}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:760px){.vocab-grid{grid-template-columns:1fr}}
.vcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.18s;background:#fff}
.vcard:hover{border-color:var(--green2);box-shadow:var(--shadow)}
.vcard-top{display:flex;align-items:center;gap:10px}
.vcard-no{font-family:var(--serif);font-size:12px;color:var(--ink3)}
.vcard-word{font-size:17px;font-weight:700;font-family:Georgia,serif;letter-spacing:.01em}
.vcard-ipa{font-size:12px;color:var(--ink3);margin-top:3px;font-family:Georgia,serif}
.vcard-exen{font-size:13px;color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.6;font-family:Georgia,serif}
.vcard-reveal{margin-top:8px;font-size:11.5px;color:var(--ink3);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;text-align:center;transition:.15s}
.vcard:hover .vcard-reveal{color:var(--green);border-color:var(--green2)}
.vcard-cn{font-size:13px;color:var(--gold);margin-top:8px;font-weight:700}
.vcard-excn{font-size:11.5px;color:var(--ink3);margin-top:4px}
.vcard-excn i{font-style:normal}
.vcard.seen{border-color:rgba(122,158,126,.45)}
.vcard.seen .vcard-exen{color:var(--ink2)}

/* ===== 误区 ===== */
.miscon{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.mc-row{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:640px){.mc-row{grid-template-columns:1fr}}
.mc-bad{background:var(--red-soft);padding:16px 20px}
.mc-good{background:var(--green-soft);padding:16px 20px}
.mc-lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.mc-bad .mc-lab{color:var(--red)}
.mc-good .mc-lab{color:var(--green)}
.mc-sent{font-size:15px;font-family:Georgia,serif;line-height:1.55;display:flex;align-items:flex-start;gap:10px}
.mc-note{padding:14px 20px;background:var(--bg);font-size:13px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--line)}
.mc-vars{display:flex;flex-direction:column;gap:7px}
.mc-var{display:flex;align-items:center;gap:10px;font-size:13.5px;font-family:Georgia,serif;color:var(--ink2)}

/* ===== 表达 ===== */
.expr-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.expr-cols{grid-template-columns:1fr}}
.expr-col{border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.expr-col h4{font-size:12.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-bottom:14px}
.expr-col h4 b{color:var(--green)}
/* 基础→进阶配对显示 */
.expr-pairs{display:flex;flex-direction:column;gap:16px}
.expr-pair{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.expr-pair-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;font-weight:600}
.expr-basic{background:#f5f7f4;margin-bottom:0}
.expr-advanced{background:var(--green-soft);margin-bottom:0}
.expr-arrow{text-align:center;font-size:11.5px;color:var(--green);padding:6px 0;font-weight:600;letter-spacing:.05em}
.expr-tag{display:inline-block;flex-shrink:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--ink3);color:#fff;letter-spacing:.05em;margin-top:2px}
.expr-tag.adv{background:var(--green)}
.expr-item{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px;font-family:Georgia,serif;line-height:1.6}
.expr-item:last-child{border-bottom:none}

/* ===== 微对话 ===== */
.dlg-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dlg-title{font-size:16.5px;font-weight:700}
.dlg-sub{font-size:12.5px;color:var(--ink3)}
.bubble{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start}
.bubble.you{flex-direction:row-reverse}
.bub-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;background:var(--green-soft)}
.bubble.you .bub-avatar{background:var(--gold-soft);font-size:10px}
.bub-body{max-width:76%}
.bub-name{font-size:10.5px;color:var(--ink3);margin-bottom:4px;letter-spacing:.06em}
.bubble.you .bub-name{text-align:right}
.bub-text{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 15px;font-size:14px;font-family:Georgia,serif;line-height:1.6}
.bubble.you .bub-text{background:var(--green);color:#fff;border-color:var(--green);border-radius:14px 4px 14px 14px}
.bub-cn{font-size:11.5px;color:var(--ink3);margin-top:4px}
.bubble.you .bub-cn{text-align:right}
.bub-ctrl{display:flex;gap:6px;margin-top:6px;align-items:center}
.bubble.you .bub-ctrl{justify-content:flex-end}
.bub-play{width:25px;height:25px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.bub-play:hover{background:var(--green);color:#fff}
.bub-shadow{width:25px;height:25px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.bub-shadow:hover{background:var(--gold);color:#fff}
.bubble.active .bub-text{box-shadow:0 0 0 2px var(--green2)}
.read-score{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700}
.read-score.good{background:var(--green-soft);color:var(--green)}
.read-score.mid{background:var(--gold-soft);color:var(--gold)}
.read-score.bad{background:var(--red-soft);color:var(--red)}

/* ===== 练习 ===== */
.prac-block{margin-bottom:26px}
.prac-block h4{font-size:14.5px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.prac-tag{font-size:10.5px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold);letter-spacing:.08em}
.sub-base{background:var(--bg);border-radius:12px;padding:14px 18px;font-family:Georgia,serif;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-slot{display:inline-flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sub-opt{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;background:#fff;transition:.15s;font-family:Georgia,serif}
.sub-opt:hover{border-color:var(--green2)}
.sub-opt.on{background:var(--green);color:#fff;border-color:var(--green)}
.fill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:11px;font-family:Georgia,serif;font-size:14.5px}
.fill-input{width:88px;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;text-align:center;font-family:Georgia,serif;background:#fff;outline:none;transition:.15s}
.fill-input:focus{border-color:var(--green2)}
.fill-input.ok{border-color:var(--green);background:var(--green-soft)}
.fill-input.no{border-color:var(--red);background:var(--red-soft)}
.fill-hint{font-size:11.5px;color:var(--ink3)}
.rw-row{margin-bottom:11px}
.rw-from{font-size:13.5px;color:var(--red);text-decoration:line-through;text-decoration-color:rgba(181,86,74,.4);font-family:Georgia,serif}
.rw-arrow{color:var(--ink3);margin:0 8px}
.rw-to{font-size:14px;color:var(--green);font-family:Georgia,serif;font-weight:600}
.rw-reveal{font-size:11.5px;color:var(--gold);cursor:pointer;margin-top:3px;display:inline-block}

/* 课程更新日历：每2-3天解锁一节新课 */
const COURSE_SCHEDULE = [
  { id: "exhibition",  release: "2026-08-30" },
  { id: "negotiation", release: "2026-08-30" },
  { id: "delivery",    release: "2026-08-30" },

function loadCoursesFromRemote(){

    .then(r => r.json())

      PODCASTS = new Function("return " + data.podcasts)();
      store.courseVersion = data.version;

/* ============================================================
   TradeSpeak 播客库 · 8期原创播客

<script>
/* ============================================================
   TradeSpeak 引擎
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const app = $("#app");

/* ---------- 进度存储 ---------- */
const STORE_KEY = "tradespeak_v1";
let store = loadStore();
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || freshStore(); }
  catch(e){ return freshStore(); }
}
function freshStore(){
  return { firstUse: Date.now(), settings:{voice:"en-GB", rate:0.92},
    courses:{}, podcasts:{} }; // courses: id -> {steps,checklist,aiBest}; podcasts: id -> {lastLine,done}
}
function saveStore(){
  store.updated_at = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  pushCloud();
}
function courseState(id){
  if(!store.courses[id]) store.courses[id] = { steps:[], checklist:[], aiBest:null };
  return store.courses[id];
}

/* ============================================================
   云同步层（手机 / 电脑多设备实时同步）
   ============================================================ */
const DEFAULT_SYNC_KEY = "quinn-ts-2026";
const SYNC = {
  online: /^https?:/.test(location.protocol),
  key: null, deviceId: null, es: null,
  timer: null, status: "boot", booted: false
};
SYNC.deviceId = (() => {
  try{
    let d = localStorage.getItem("ts_device");
    if(!d){ d = "dev-" + Math.random().toString(36).slice(2, 9); localStorage.setItem("ts_device", d); }
    return d;
  }catch(e){ return "dev-local"; }
})();
SYNC.key = (() => {
  try{
    const qp = new URLSearchParams(location.search).get("sync");
    if(qp){ localStorage.setItem("ts_sync_key", qp); return qp; }
    let k = localStorage.getItem("ts_sync_key");
    if(!k){ k = DEFAULT_SYNC_KEY; localStorage.setItem("ts_sync_key", k); }
    const u = new URL(location.href);
    u.searchParams.set("sync", k);
    history.replaceState(null, "", u);
    return k;
  }catch(e){ return DEFAULT_SYNC_KEY; }
})();

function setSyncStatus(s){
  SYNC.status = s;
  const chip = document.getElementById("sync-chip");
  if(chip){
    if(s === "ok"){ chip.innerHTML = "☁ 已同步"; chip.classList.add("on"); }
    else if(s === "sync"){ chip.innerHTML = "⟳ 同步中"; chip.classList.remove("on"); }
    else if(s === "offline"){ chip.innerHTML = "⚪ 离线·本地保存"; chip.classList.remove("on"); }
  }
}
function pushCloud(){
  if(!SYNC.online) return;
  setSyncStatus("sync");
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => {
    fetch("/api/progress?key=" + encodeURIComponent(SYNC.key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({}, store, { __device: SYNC.deviceId }))
    }).then(() => setSyncStatus("ok")).catch(() => setSyncStatus("offline"));
  }, 350);
}
function pullCloud(){
  if(!SYNC.online) return Promise.resolve(null);
  return fetch("/api/progress?key=" + encodeURIComponent(SYNC.key))
    .then(r => r.json())
    .then(remote => {
      setSyncStatus("ok");
      if(remote && remote.updated_at && (!store.updated_at || remote.updated_at > store.updated_at)){
        return remote;
      }
      return null;
    })
    .catch(() => { setSyncStatus("offline"); return null; });
}
function applyRemote(remote){
  if(!remote) return;
  const remoteCurrent = remote.current || null;
  delete remote.__device;
  store = Object.assign({}, remote);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  if(SYNC.booted){
    /* 播客连播中不重渲染页面（避免打断收听），进度静默合并 */
    if(!podState.playing){
      render();
      toast("☁ 已从另一台设备同步进度");
    }
  } else {
    render(); /* 冷启动拉到云端更新后静默重渲染 */
  }
  if(remoteCurrent && remoteCurrent.device !== SYNC.deviceId &&
     (Date.now() - remoteCurrent.at) < 10 * 60 * 1000){
    showSyncBanner(remoteCurrent);
  }
}
function connectSSE(){
  if(!SYNC.online || typeof EventSource === "undefined") return;
  try{
    SYNC.es = new EventSource("/api/events?key=" + encodeURIComponent(SYNC.key) + "&device=" + encodeURIComponent(SYNC.deviceId));
    SYNC.es.onmessage = e => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === "sync" && msg.from !== SYNC.deviceId && msg.progress){
          if(msg.progress.updated_at >= (store.updated_at || 0)) applyRemote(msg.progress);
        }
      }catch(err){}
    };
    SYNC.es.onopen = () => { setSyncStatus("ok"); pullCloud().then(r => { if(r) applyRemote(r); }); };
    SYNC.es.onerror = () => { setSyncStatus("offline"); };
  }catch(e){}
}
/* 兜底轮询：即使 SSE 被网络环境拦截，仍有准实时同步 */
setInterval(() => {
  if(SYNC.online && document.visibilityState === "visible" && SYNC.booted){
    pullCloud().then(r => { if(r) applyRemote(r); });
  }
}, 20000);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && SYNC.online && SYNC.booted){
    pullCloud().then(r => { if(r) applyRemote(r); });
  }
});

/* 跨设备学习位置横幅 */
function showSyncBanner(cur){
  let label, jumpHash;
  if(cur.pod){

/* 声音选择：按目标口音打分（伦敦腔 en-GB 优选英国声优） */
function pickVoice(voice){
  const want = (store.settings.voice || "en-GB").toLowerCase(); // "en-gb" / "en-us"
  const score = v => {
    let s = 0;
    const lang = (v.lang || "").replace("_","-").toLowerCase();
    const name = (v.name || "").toLowerCase();
    if(lang === want) s += 10;
    else if(lang.startsWith("en-")) s += 2;
    if(/natural|neural|premium|enhanced|google|online/i.test(v.name || "")) s += 4;
    if(want === "en-gb" && /sonia|libby|ryan|daniel|kate|serena|maisie|thomas|arthur|uk english|british|england/i.test(v.name || "")) s += 4;
    if(want === "en-us" && /aria|jenny|guy|samantha|zira|david|mark|us english/i.test(v.name || "")) s += 4;
    /* 男女声区分：female优先女声名字，male优先男声名字 */
    if(voice === "female"){
      if(/sonia|libby|kate|serena|maisie|aria|jenny|samantha|zira|female|woman|girl/i.test(name)) s += 8;
      if(/ryan|daniel|thomas|arthur|guy|david|mark|male|man|boy/i.test(name)) s -= 5;
    } else if(voice === "male"){
      if(/ryan|daniel|thomas|arthur|guy|david|mark|male|man|boy/i.test(name)) s += 8;
      if(/sonia|libby|kate|serena|maisie|aria|jenny|samantha|zira|female|woman|girl/i.test(name)) s -= 5;
    }
    return s;
  };
  const pool = VOICES.filter(v => /^en[-_]/i.test((v.lang || "").replace("_","-")));
  if(pool.length === 0) return null;
  return pool.sort((a,b) => score(b) - score(a))[0];
}

/* 平台判断：Android Chrome 的系统 TTS 非常不稳定，优先走音频流兜底 */
const UA = navigator.userAgent;
const IS_ANDROID_CHROME = /Android/.test(UA) && /Chrome/.test(UA) && !/Edg/.test(UA);

/* ============================================================
   内置音频播放（预生成 en-GB-SoniaNeural 伦敦腔 MP3）
   文件名 = FNV-1a(规范化文本) 的十六进制，与生成脚本完全一致
   ============================================================ */
function audioId(text){
  const s = String(text).replace(/\s+/g, " ").trim();
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}
let AUDIO_SET = null; /* null=未加载，Set=已加载的音频id集合 */
(function loadAudioManifest(){
  if(!/^https?:/.test(location.protocol)){ AUDIO_SET = new Set(); return; }
  fetch("audio/manifest.json")
    .then(r => r.json())
    .then(m => { AUDIO_SET = new Set(m.ids || []); })
    .catch(() => { AUDIO_SET = new Set(); });
})();

let speakToken = 0;
let __keepUtter = null; /* 防 iOS Safari 垃圾回收导致静音 */
let __currentAudio = null; /* 当前正在播放的音频（内置/兜底） */

/* 播放内置静态 MP3（不依赖任何系统 TTS / 外部服务） */
function playPackedAudio(url, {onend, onstart, rate} = {}){
  const a = new Audio(url);
  __currentAudio = a;
  a.preload = "auto";
  /* 音频生成为 -10% 慢速；把设置中的 0.92 视作基准 1.0 */
  const mapped = (rate || store.settings.rate || 0.92) / 0.92;
  if(isFinite(mapped) && mapped > 0.3 && mapped < 3) a.playbackRate = mapped;
  a.onplaying = () => { onstart && onstart(); };
  a.onended = () => { if(__currentAudio === a) __currentAudio = null; onend && onend(); };
  a.onerror = () => { if(__currentAudio === a) __currentAudio = null; onend && onend(); };
  const p = a.play();
  if(p && p.catch) p.catch(() => { if(__currentAudio === a) __currentAudio = null; onend && onend(); });
  return a;
}

/* 兜底音频 TTS（Google Translate TTS）—— 不依赖系统 TTS 服务 */
function audioSpeak(text, lang, {onend, onstart} = {}){
  const tl = (lang === "en-US") ? "en" : "en-GB"; /* en / en-GB 为 Google 支持码 */
  const max = 180;
  if(text.length > max){ text = text.slice(0, max); }
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${tl}&q=${encodeURIComponent(text)}`;
  const audio = new Audio(url);
  __currentAudio = audio;
  audio.preload = "auto";
  if(onstart){
    audio.oncanplaythrough = () => { try{ onstart(); }catch(e){} };
  }
  audio.onended = () => { __currentAudio = null; onend && onend(); };
  audio.onerror = () => {
    __currentAudio = null;
    onend && onend();
    throw new Error("audio tts failed");
  };
  return audio.play();
}

/* 浏览器原生 Web Speech 发音 */
function webSpeak(text, {onend, onstart, rate, voice} = {}){
  if(!("speechSynthesis" in window)){ toast("当前浏览器不支持语音合成，请用 Chrome / Edge / Safari 打开"); onend && onend(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  refreshVoices();
  /* 真人感优化：英式发音 + 自然语速 + 男女声区分 */
  const u = new SpeechSynthesisUtterance(text);
  u.lang = store.settings.voice || "en-GB";
  u.rate = rate || store.settings.rate || 0.88;
  /* 男女声区分：female音调略高，male音调略低 */
  u.pitch = voice === "female" ? 1.08 : (voice === "male" ? 0.88 : 0.96);
  u.volume = 1.0;
  const v = pickVoice(voice);
  if(v){ u.voice = v; u.lang = v.lang || u.lang; }
  const my = ++speakToken;
  let started = false;
  u.onstart = () => { started = true; onstart && onstart(my); };
  u.onend = () => { if(my === speakToken) onend && onend(); };
  u.onerror = (ev) => {
    if(my !== speakToken) return;
    const err = ev && ev.error;
    if(err === "not-allowed" || err === "service-unavailable"){
      toast("浏览器拦截了语音播放，请点击页面任意处后再试");
    } else if(err === "synthesis-failed"){
      toast("语音合成失败，请再点一次播放");
    }
    onend && onend();
  };
  __keepUtter = u;
  speechSynthesis.speak(u);
  /* 静默失败看门狗 */
  setTimeout(() => {
    if(my === speakToken && !started && !speechSynthesis.speaking && !speechSynthesis.pending){
      toast("🔇 未检测到播放，请再点一次；若仍无声，检查设备音量/静音键");
      onend && onend();
    }
  }, 1800);
}

/* 统一发音入口：优先内置 MP3 → Android 音频流兜底 → Web Speech 兜底 */
function speak(text, {onend, onstart, rate, voice} = {}){
  const t = String(text).replace(/\s+/g, " ").trim();
  if(AUDIO_SET && AUDIO_SET.size > 0){
    const id = audioId(t);
    if(AUDIO_SET.has(id)){
      playPackedAudio("audio/" + id + ".mp3", {onend, onstart, rate});
      return;
    }
  }
  if(IS_ANDROID_CHROME){
    /* Android Chrome：优先音频流，若失败再回退 Web Speech */
    audioSpeak(t, store.settings.voice, {onend, onstart}).catch(() => {
      webSpeak(t, {onend, onstart, rate, voice});
    });
  } else {
    webSpeak(t, {onend, onstart, rate, voice});
  }
}
function stopSpeak(){
  speakToken++;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(__currentAudio){ try{ __currentAudio.pause(); __currentAudio.currentTime = 0; }catch(e){} __currentAudio = null; }
}

/* ---------- 语音识别 ---------- */
const ASR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, recActive = false, listeningBadge = null;
function startListen(onResult, onEnd){
  if(!ASR){ toast("此浏览器不支持语音识别，请用 Chrome / Edge 打开"); onEnd && onEnd(); return; }
  if(recActive){ try{ rec.stop(); }catch(e){} recActive = false; hideBadge(); }
  rec = new ASR();
  rec.lang = store.settings.voice === "en-US" ? "en-US" : "en-GB"; /* 识别口音跟随朗读偏好 */
  rec.interimResults = false; rec.maxAlternatives = 1;
  recActive = true;
  showBadge("正在聆听 · 请开口说英文");
  rec.onresult = e => {
    const said = e.results[0][0].transcript;
    const conf = e.results[0][0].confidence || 1;
    /* 防误触发：结果太短(<3字符)或置信度太低(<0.3)视为噪音，不自动回复 */
    if(said.trim().length < 3 || conf < 0.3){
      hideBadge(); toast("没听清，请再大声说一遍"); onEnd && onEnd(); return;
    }
    hideBadge(); onResult(said);
  };
  rec.onerror = e => {
    hideBadge();
    if(e.error === "not-allowed") toast("麦克风被拒绝，请在浏览器地址栏允许麦克风权限");
    else if(e.error === "network") toast("语音识别需要联网");
    else if(e.error === "no-speech") toast("没听到声音，再试一次");
    onEnd && onEnd();
  };
  rec.onend = () => { recActive = false; hideBadge(); onEnd && onEnd(); };
  try{ rec.start(); }catch(e){ recActive = false; hideBadge(); }
}
function stopListen(){ if(rec && recActive){ try{ rec.stop(); }catch(e){} } }

/* ---------- 跟读评分 ---------- */
function normTxt(s){
  return (s||"").toLowerCase()
    .replace(/[’']/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function scoreRead(target, said){
  const T = normTxt(target).split(" ").filter(Boolean);
  const S = new Set(normTxt(said).split(" ").filter(Boolean));
  let hit = 0; T.forEach(w => { if(S.has(w)) hit++; });
  const cover = T.length ? hit / T.length : 0;
  return Math.round(Math.min(100, cover * 92 + (S.size ? Math.min(hit/S.size,1) * 8 : 0)));
}
function readStars(sc){
  if(sc >= 85) return {cls:"good", label:"★ 地道"};
  if(sc >= 65) return {cls:"mid", label:"★★ 不错"};
  if(sc >= 40) return {cls:"mid", label:"★ 再练"};
  return {cls:"bad", label:"再试一次"};
}

/* ---------- 工具 ---------- */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
let toastTimer = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}
function hl(text, keys){
  let out = esc(text);
  keys.forEach(k => {
    const re = new RegExp("\\b(" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")\\b","gi");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}

/* ============================================================
   课程自动解锁：根据COURSE_SCHEDULE的release日期判断是否解锁
   每2-3天解锁一节新课，未解锁的课程显示"即将解锁"
   ============================================================ */
function isCourseUnlocked(courseId){
  if(typeof COURSE_SCHEDULE === "undefined") return true;
  const sched = COURSE_SCHEDULE.find(s => s.id === courseId);
  if(!sched) return true; /* 没有排期的课程默认解锁 */
  const today = new Date();
  today.setHours(0,0,0,0);
  const release = new Date(sched.release + "T00:00:00");
  return today >= release;
}
function getCourseReleaseDate(courseId){
  if(typeof COURSE_SCHEDULE === "undefined") return null;
  const sched = COURSE_SCHEDULE.find(s => s.id === courseId);
  return sched ? sched.release : null;
}
function daysUntilRelease(courseId){
  const rel = getCourseReleaseDate(courseId);
  if(!rel) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const release = new Date(rel + "T00:00:00");
  return Math.ceil((release - today) / (1000*60*60*24));
}

function typewriter(target){
  const el = $("#typew"); if(!el) return;
  let i = 0;
  el.textContent = "";

    el.textContent = target.slice(0, ++i);
    if(i >= target.length) clearInterval(timer);
  }, 160);
}

function renderStep(c){

  if(!st.steps.includes(key)){ st.steps.push(key); saveStore(); }
  const main = $("#step-main");
  const R = {
    intro: renderIntro, vocab: renderVocab, miscon: renderMiscon,
    expr: renderExpr, dialog: renderDialog, prac: renderPrac,
    check: renderCheck, culture: renderCulture, ai: renderAI
  };
  main.innerHTML = R[key](c) + stepNavHTML(c);
  if(key === "vocab") bindVocab();
  if(key === "dialog") bindDialog(c);
  if(key === "prac") bindPrac(c);
  if(key === "check") bindCheck(c);
  if(key === "ai") bindAI(c);
}

  const prev = route.step > 0, next = route.step < STEPS.length - 1;

}

function bindVocab(){
  $$(".vcard").forEach(card => {
    const idx = +card.querySelector("[data-vp]").dataset.vp;
    card.addEventListener("click", e => {
      if(e.target.closest(".play-ico")) return;
      const c = COURSES.find(x=>x.id===route.courseId);
      const v = c.vocab[idx];
      const cn = card.querySelector("[data-cn]");
      const already = cn.style.display !== "none";
      if(!already){
        card.querySelector("[data-reveal]").style.display = "none";
        card.querySelector("[data-excn]").style.display = "block";
        cn.style.display = "block";
        card.classList.add("seen");
        speak(v.word); /* 只播单词发音，不自动播例句 */
      }
    });
  });
  $$("[data-vp]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const c = COURSES.find(x=>x.id===route.courseId);
    const v = c.vocab[+b.dataset.vp];
    if(b.classList.contains("playing")){ stopSpeak(); return; }
    $$(".play-ico.playing").forEach(x=>x.classList.remove("playing"));
    b.classList.add("playing");
    speak(v.word, {onend:()=>b.classList.remove("playing")}); /* 只播单词 */
  }));
  /* 例句播放按钮 */
  $$("[data-ve]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const c = COURSES.find(x=>x.id===route.courseId);
    const v = c.vocab[+b.dataset.ve];
    if(b.classList.contains("playing")){ stopSpeak(); return; }
    $$(".play-ico.playing").forEach(x=>x.classList.remove("playing"));
    b.classList.add("playing");
    speak(v.ex, {onend:()=>b.classList.remove("playing")});
  }));
}

    <div class="bubble ${l.role}" data-line="${tag}-${i}">
      <div class="bub-avatar"><span style="font-family:var(--serif);font-weight:700;font-size:15px;color:${l.role==="buyer"? 'var(--green)' : 'var(--gold)'}">${l.role==="buyer"? "B" : "Q"}</span></div>
      <div class="bub-body">

        <div class="bub-text">${esc(l.en)}</div>
        <div class="bub-cn">${l.cn}</div>
        <div class="bub-ctrl">
          <button class="bub-play" title="播放本句" data-dp="${tag}-${i}">▶</button>
          <button class="bub-shadow" title="跟读本句（说英文，AI 打分）" data-ds="${tag}-${i}">🎙</button>
          <span class="read-score" data-score="${tag}-${i}" style="display:none"></span>
        </div>
      </div>
    </div>`).join("")}
  </div>`;
  return mk(c.dialogueA, "A") + mk(c.dialogueB, "B");
}
function getDlg(c, tag){ return tag === "A" ? c.dialogueA : c.dialogueB; }
function playDialogueSeq(c, tag){
  const d = getDlg(c, tag);
  const st = dlgPlayState;
  if(st.active && st.tag === tag){ stopSpeak(); st.active = false; setPA(tag, false); return; }
  stopSpeak(); st.active = true; st.tag = tag; st.courseId = c.id;
  setPA(tag, true);
  let i = 0;
  const next = () => {
    if(!st.active || st.tag !== tag || i >= d.lines.length){
      st.active = false; setPA(tag, false); clearActive(); return;
    }
    highlightLine(tag, i);
    const line = d.lines[i];
    speak(line.en, {onend:()=>{ i++; setTimeout(next, 320); }});
  };
  next();
}
function setPA(tag, playing){
  const b = $("#pa-" + tag);
  if(b) b.innerHTML = playing ? "■ 停止连播" : "▶ 整段连播";
}
function highlightLine(tag, i){
  clearActive();
  const el = document.querySelector(`[data-line="${tag}-${i}"]`);
  if(el){ el.classList.add("active"); el.scrollIntoView({block:"center", behavior:"smooth"}); }
}
function clearActive(){ $$(".bubble.active").forEach(b=>b.classList.remove("active")); }

function bindDialog(c){
  $$("[data-playall]").forEach(b => b.addEventListener("click", () => playDialogueSeq(c, b.dataset.playall)));
  $$("[data-dp]").forEach(b => b.addEventListener("click", () => {
    const [tag, i] = b.dataset.dp.split("-");
    stopSpeak(); dlgPlayState.active = false; setPA("A", false); setPA("B", false);
    highlightLine(tag, +i);
    speak(getDlg(c, tag).lines[+i].en, {onend: clearActive});
  }));
  $$("[data-ds]").forEach(b => b.addEventListener("click", () => {
    const [tag, i] = b.dataset.ds.split("-");
    const line = getDlg(c, tag).lines[+i];
    const scoreEl = document.querySelector(`[data-score="${tag}-${i}"]`);
    stopSpeak();
    startListen(said => {
      const sc = scoreRead(line.en, said);
      const st = readStars(sc);
      scoreEl.style.display = "inline-block";
      scoreEl.className = "read-score " + st.cls;
      scoreEl.textContent = `${st.label} ${sc}分`;
      scoreEl.title = "你说：" + said;
      if(sc < 40){
        toast("再试一次，或先听一遍原声");
      } else if(sc >= 85){
        toast("很地道！这句可以拿下客户了");
      }
    });
  }));
}

   AI 智能体引擎：模糊匹配 + 情绪 + 记忆 + 追问 + 打字指示
   ============================================================ */
const AI_STOP = new Set(("the a an is are was were be been am do does did have has had i we you your our their he she it this that these those for and or but so to of in on at with by from as can could will would should may might must not no yes ok okay please thank thanks just very much more most me my mine what when where how why about into over under again then once here there all any both each few other some such only own same too don now also like want need get got give take make").split(" "));
function aiWords(t){
  return (String(t).match(/[a-zA-Z][a-zA-Z-]*|\d[\d,.]*/g) || []).map(w => w.toLowerCase());
}
/* 从提示句提取本轮关键信息点（实词+数字） */
function roundKeys(round){
  return [...new Set(aiWords(round.hint))].filter(w => !AI_STOP.has(w) && w.length > 2);
}
/* 评分：正则命中=hit；关键词覆盖率决定 partial / weak / miss */
/* 同义词词典：让评分更灵活，用户用同义词也算对 */
const SYNONYM_MAP = {
  "refillable": ["reusable","replaceable","refill","reuse","replace","cartridge","ink","eco","green","sustainable"],
  "certification": ["certificate","certified","en71","ce","astm","reach","compliance","test","report","standard"],
  "moq": ["minimum","order","quantity","10,000","10000","ten","thousand","pieces","units"],
  "oem": ["custom","logo","brand","private","label","design","packaging","printing"],
  "sample": ["free","freight","courier","dhl","shipping","account","test","trial"],
  "price": ["cost","quote","quotation","rate","fee","charge","budget","target","discount"],
  "delivery": ["lead","time","ship","shipping","freight","schedule","timeline","eta","etd"],
  "payment": ["deposit","tt","telegraphic","transfer","lc","letter","credit","terms","30%","70%"],
  "packaging": ["package","packing","box","cdu","display","blister","card","hang","retail","shelf"],
  "quality": ["good","high","premium","standard","inspection","qc","defect","return","warranty"],
  "market": ["europe","uk","germany","france","usa","america","australia","retail","chain","store","wholesale"],
  "marker": ["pen","pens","highlighter","markers","stationery","product","item","model"]
};
function expandSynonyms(words){
  const expanded = new Set(words);
  words.forEach(w => {
    Object.keys(SYNONYM_MAP).forEach(key => {
      if(w === key || SYNONYM_MAP[key].includes(w)){
        expanded.add(key);
        SYNONYM_MAP[key].forEach(s => expanded.add(s));
      }
    });
  });
  return expanded;
}
function aiScoreUser(round, text){
  let rxHit = false;
  try{ rxHit = round.patterns.some(p => p.test(text)); }catch(e){}
  const keys = roundKeys(round);
  const saidWords = aiWords(text);
  const said = expandSynonyms(new Set(saidWords)); /* 同义词扩展 */
  let hit = 0;
  keys.forEach(w => { if(said.has(w)) hit++; });
  const cover = keys.length ? hit / keys.length : 0;
  /* 数字匹配（去逗号归一化，如 5,000 == 5000） */
  const norm = w => String(w).replace(/,/g, "");
  const nums = [...said].filter(w => /^\d/.test(w));
  const hintNums = keys.filter(w => /^\d/.test(w));
  const numHit = hintNums.length > 0 && hintNums.some(hn => nums.some(n => norm(hn) === norm(n)));
  /* 降低hit阈值：正则命中 或 数字命中+覆盖率>=0.15 或 覆盖率>=0.35 */
  if(rxHit || (numHit && cover >= 0.15) || cover >= 0.35) return {verdict:"hit", cover};
  if(cover >= 0.25) return {verdict:"partial", cover};
  if(saidWords.length >= 3) return {verdict:"weak", cover}; /* 只要说了3个词以上就不算完全miss */
  return {verdict:"miss", cover};
}
/* 记忆：记住用户给过的数字与产品信息，追问时引用 */
function aiRemember(text){
  const mem = aiState.memory;
  (String(text).match(/\b\d[\d,.]*\s*(pieces|sets|days|units|cartons|usd|dollars)?/gi) || []).forEach(m => {
    const v = m.trim();
    if(v && !mem.nums.includes(v)) mem.nums.push(v);
  });
  ["marker","markers","pen","highlighter","ink","packaging","catalog","sample","certification","EN71","CDU","price","MOQ","OEM","lead time","payment","deposit","FOB"].forEach(t => {
    try{
      if(new RegExp("\\b" + t.replace(/ /g,"\\s+") + "\\b","i").test(text) && !mem.topics.includes(t)) mem.topics.push(t);
    }catch(e){}
  });
}
/* 情绪：连续命中 → AI 更热情；连续失误 → 更耐心 */
function aiOkPrefix(){
  const m = Math.round(aiState.mood || 0);
  const P = {
    2:["Excellent! ","That's exactly it. ","Brilliant — "],
    1:["Great — ","Nice. ","Good answer. "],
    0:["Good. ","Okay. ","Right. "],
    "-1":["Good, that's better. ","Okay, now we're getting somewhere. "],
    "-2":["There you go. ","That's it. "]
  };
  const arr = P[m] || P[0];
  return arr[Math.floor(Math.random() * arr.length)];
}
function aiMissPrefix(){
  const m = Math.round(aiState.mood || 0);
  if(m <= -1) return ["Take your time — ","No worries — ","Hmm, "][Math.floor(Math.random() * 3)];
  return "";
}
/* partial 追问：指出用户已说到的点 + 还缺什么 */
function aiFollowup(round, text){
  const keys = roundKeys(round);
  const said = new Set(aiWords(text));
  const got = keys.filter(k => said.has(k));
  const need = keys.filter(k => !said.has(k));
  if(got.length && need.length){
    const g = got.slice(0,2).join(" and ");
    const n = need.slice(0,2).join(" or ");
    return {en:`Good start — I heard "${g}". Can you also bring in ${n}?`,
            cn:`不错的开头——我听到了 ${g}。能再提到 ${n} 吗？`};
  }
  if(need.length){
    const n = need.slice(0,2).join("、");
    return {en:`You're close. Try to mention ${need.slice(0,2).join(" or ")} as well.`,
            cn:`很接近了。试着再提到 ${n}。`};
  }
  return {en:"You're on the right track — add a bit more detail.", cn:"方向对了——再补充一点细节。"};
}
/* 打字指示器（营造实时对话感） */
function aiTyping(){
  aiTypingDone();
  const box = $("#ai-msgs"); if(!box) return;
  const t = document.createElement("div");
  t.className = "amsg typing"; t.id = "ai-typing";
  t.innerHTML = "<span class='tdot'></span><span class='tdot'></span><span class='tdot'></span>";
  box.appendChild(t);
  box.scrollTop = 1e6;
}
function aiTypingDone(){ const t = $("#ai-typing"); if(t) t.remove(); }
function aiBusy(){ return !!document.getElementById("ai-typing"); }
function aiUpdateRound(A){
  const lbl = $("#ai-round-label");
  if(lbl) lbl.textContent = `Round ${Math.min(aiState.idx+1, A.rounds.length)} / ${A.rounds.length}`;
}
/* 快捷回复：移动端打字难 / 语音不可用时的主交互 */
function renderAiChips(c){
  const wrap = $("#ai-chips"); if(!wrap) return;
  if(aiState.finished){ wrap.innerHTML = ""; return; }
  const A = c.aiPractice;
  const round = A.rounds[Math.min(aiState.idx, A.rounds.length - 1)];
  const full = round.hint;
  const cut = full.split(/[,—:;]/)[0].trim();
  const short = cut.length < full.length ? cut + "…" : cut;
  wrap.innerHTML = `
    <button class="ai-chip" data-ck="full" title="${esc(full)}">💪 完整说法</button>
    <button class="ai-chip" data-ck="part" title="${esc(cut)}">✂️ 发半句试试</button>
    <button class="ai-chip" data-ck="hint">💡 看提示</button>`;
  wrap.querySelectorAll("[data-ck]").forEach(b => b.addEventListener("click", () => {
    if(b.dataset.ck === "hint"){ aiShowHint(round.hint, true); return; }
    /* 完整说法/发半句只填入输入框，用户确认后点击发送，避免自动朗读和发送 */
    const txt = b.dataset.ck === "full" ? full : cut;
    $("#ai-text").value = txt;
    $("#ai-text").focus();
    toast("已填入输入框，确认后点击发送");
  }));
}
function aiHandleUser(text){
  if(aiBusy() || aiState.lockUntilNext){ toast("对方正在说话…稍等一下"); return; }
  const c = COURSES.find(x => x.id === route.courseId);
  const A = c.aiPractice;
  const round = A.rounds[Math.min(aiState.idx, A.rounds.length - 1)];
  aiAppendRaw("me", text, null, false);
  aiState.log.push({role:"me", text});
  aiState.tried = true;
  aiRemember(text);
  const res = aiScoreUser(round, text);
  const delay = 650 + Math.random() * 550;
  /* 清空旧 chips，避免误点上一轮的选项 */
  const chipWrap = $("#ai-chips"); if(chipWrap) chipWrap.innerHTML = "";
  const hb = $("#ai-hint"); if(hb) hb.remove();
  aiState.lastHint = null;

  if(res.verdict === "hit"){
    aiState.hits++;
    aiState.streak = (aiState.streak || 0) + 1;
    aiState.partialCount = 0;
    aiState.mood = Math.min(2, (aiState.mood || 0) + 0.7);
    aiState.lockUntilNext = true; /* 下一问播报前锁定输入 */
    /* 修复：加12秒超时兜底，防止语音TTS失败/无声时onend永不触发导致输入永久锁死 */
    clearTimeout(aiState._lockTimer);
    aiState._lockTimer = setTimeout(() => { aiState.lockUntilNext = false; }, 12000);
    aiTyping();
    setTimeout(() => {
      aiTypingDone();
      const reply = aiOkPrefix() + round.ok;
      aiAppendRaw("ai", reply, null, true, () => {
        /* 用户听完 ok 回复后，AI 抛出下一问（typing → 播报） */
        if(aiState.idx >= A.rounds.length) return;
        setTimeout(() => {
          if(aiState.finished) return;
          aiTyping();
          setTimeout(() => {
            aiTypingDone();
            aiState.lockUntilNext = false;
            const nr = A.rounds[aiState.idx];
            aiAppend("ai", nr, true);
            renderAiChips(c);
          }, 500 + Math.random() * 400);
        }, 380);
      });
      aiState.log.push({role:"ai", text:reply});
      aiState.idx++;
      aiUpdateRound(A);
      if(aiState.idx >= A.rounds.length){ aiState.lockUntilNext = false; aiFinish(); }
    }, delay);
  } else if(res.verdict === "partial" && aiState.partialCount < 1){
    /* 方向对了但信息不全：先追问，再给提示 */
    aiState.partialCount++;
    aiState.mood = Math.max(-2, (aiState.mood || 0) - 0.3);
    aiTyping();
    setTimeout(() => {
      aiTypingDone();
      const f = aiFollowup(round, text);
      aiAppendRaw("ai", f.en, f.cn, true, () => aiShowHint(round.hint, true));
      aiState.log.push({role:"ai", text:f.en, cn:f.cn});
      aiState.lastHint = round.hint;
      renderAiChips(c);
    }, delay);
  } else {
    aiState.misses++;
    aiState.streak = 0;
    aiState.partialCount = 0;
    aiState.mood = Math.max(-2, (aiState.mood || 0) - 1);
    aiState.lastHint = round.hint;
    aiTyping();
    setTimeout(() => {
      aiTypingDone();
      /* 引导式回复：先肯定用户，再提问引导，不直接给答案，不自动朗读 */
      const userWords = aiWords(text).filter(w => w.length > 3).slice(0,2);
      const keys = roundKeys(round);
      const said = new Set(aiWords(text));
      const got = keys.filter(k => said.has(k));
      const need = keys.filter(k => !said.has(k)).slice(0,2);
      let reply, replyCn;
      if(got.length > 0){
        reply = `Good start — I heard you say "${got.slice(0,2).join(" and ")}". That's on the right track. Can you add one more detail — for example, ${need.join(" or ")}? Try to say it in a full sentence.`;
        replyCn = `不错的开头——我听到你说了"${got.slice(0,2).join("、")}"。方向对了。能再补充一个细节吗？比如提到${need.join("或")}。试着用完整的句子说出来。`;
      } else {
        reply = `Let me help you think about this. The buyer is asking about ${need.slice(0,1).join("")}. What would you say to reassure them? Take your time — try a full sentence, and I'll give you feedback.`;
        replyCn = `让我帮你理一下思路。买家在问关于${need.slice(0,1).join("")}的问题。你会怎么说让他们放心？慢慢来——试着说一个完整的句子，我会给你反馈。`;
      }
      /* autoplay=false：不自动朗读，用户点击重听才播放 */
      aiAppendRaw("ai", reply, replyCn, false, () => aiShowHint(round.hint, true));
      aiState.log.push({role:"ai", text:reply, cn:replyCn});
      renderAiChips(c);
    }, delay + 300);
  }
}
function aiSkip(){
  const c = COURSES.find(x => x.id === route.courseId);
  const A = c.aiPractice;
  if(aiState.finished) return;
  const round = A.rounds[Math.min(aiState.idx, A.rounds.length - 1)];
  aiShowHint(round.hint, true);
  toast("参考说法已给出：可以照着语音说一遍，或点下方「完整说法」直接发送");
}
function aiFinish(){
  const c = COURSES.find(x => x.id === route.courseId);
  const A = c.aiPractice;
  aiState.finished = true;
  const total = A.rounds.length;
  const hits = aiState.hits;
  const acc = Math.round(hits / total * 100);
  let grade = "进步中 · Keep going";
  if(acc >= 85) grade = "外贸老手 · Top closer 💼";
  else if(acc >= 60) grade = "熟练业务员 · Solid performer";
  const prev = courseState(c.id).aiBest;
  if(!prev || hits > prev.hits){ courseState(c.id).aiBest = {hits, total}; saveStore(); }
  aiState.report = {total, hits, acc, grade, mood: aiState.mood || 0};
  setTimeout(aiShowReport, 800);
}
function aiShowReport(){
  const r = aiState.report; if(!r) return;
  const input = $("#ai-input"); if(input) input.style.display = "none";

    ${memTxt ? `<p style="font-size:12.5px;color:#e8c88f;margin-bottom:12px">🧠 这通电话你给出的关键信息：${esc(memTxt)}</p>` : ""}
    <p style="font-size:13px;color:rgba(233,228,211,.75);line-height:1.8;margin-bottom:18px">
      复盘建议：把没命中的轮次重新说一遍——对着提示句先读 3 遍，再关掉提示用自己的话讲。真实谈判里，${CONFIG.owner}，你的下一句话就是订单。</p>
    <div class="ai-replay-btns">
      <button class="btn btn-o" onclick="aiRestart()" style="border-color:#3d6a4b;color:#8fd0a0">↺ 再来一次</button>
      <button class="btn btn-p" onclick="goStep(${Math.max(route.step-1,0)})" style="background:#3d6a4b">← 回看文化小贴士</button>
    </div>`;
  box.appendChild(div);

      </div>`).join("")}
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-o" id="pod-restart">↺ 从头连播</button>
      ${pr.lastLine > 0 && !pr.done ? `<button class="btn btn-g" id="pod-resume">▶ 从上次继续（第 ${Math.min(pr.lastLine+1, p.lines.length)} 句）</button>` : ""}
    </div>
    <p style="font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.7">💡 磨耳朵建议：先关中字盲听一遍 → 打开中字核对 → 没听清的句子点击重听，直到不看文本也能听懂。收听进度自动云端同步。</p>
  </div>
  <div class="footer">${CONFIG.brand} · ${CONFIG.slogan} · Built for ${CONFIG.owner} @ ${CONFIG.company}</div>`;

  bindPodcast(p);
  setTimeout(() => scrollPodLine(podState.idx, false), 120);
}

function bindPodcast(p){
  const pr = podProg(p.id);
  $("#pod-play").addEventListener("click", () => podToggle(p));
  $("#pod-prev").addEventListener("click", () => podPlay(p, Math.max(0, podState.idx - 1)));
  $("#pod-next").addEventListener("click", () => podPlay(p, Math.min(p.lines.length - 1, podState.idx + 1)));
  $("#pod-rate").addEventListener("click", () => {
    const seq = [0.75, 0.92, 1.0];
    let i = seq.indexOf(store.settings.rate);
    if(i < 0) i = 1;
    store.settings.rate = seq[(i + 1) % seq.length];
    saveStore();
    const btn = $("#pod-rate");
    if(btn) btn.textContent = (store.settings.rate < 0.9 ? "🐢 " : "") + store.settings.rate.toFixed(2) + "x";
    toast("语速 " + store.settings.rate.toFixed(2) + "x · 下一句生效");
  });
  $("#pod-cn").addEventListener("click", () => {
    const on = store.settings.podCn === false; /* toggle */
    store.settings.podCn = on;
    saveStore();
    const btn = $("#pod-cn");
    btn.textContent = "中字 " + (on ? "开" : "关");
    btn.classList.toggle("on", on);
    $$("[data-plcn]").forEach(el => el.style.display = on ? "" : "none");
  });
  const rs = $("#pod-restart");
  if(rs) rs.addEventListener("click", () => { podState.playing = true; podPlay(p, 0); });
  const rm = $("#pod-resume");
  if(rm) rm.addEventListener("click", () => { podState.playing = true; podPlay(p, Math.min(pr.lastLine, p.lines.length - 1)); });
  $$(".pl-line").forEach(el => el.addEventListener("click", () => podPlay(p, +el.dataset.pl)));
}

function podToggle(p){
  if(podState.playing){
    podState.playing = false;
    stopSpeak();
    podUI(p);
    return;
  }
  podState.playing = true;
  podPlay(p, podState.idx);
}

/* 播放第 i 句；连播模式下句尾自动续播 */
function podPlay(p, i){
  if(podState.id !== p.id) podState.id = p.id;
  stopSpeak();
  podState.idx = i;
  const pr = podProg(p.id);
  pr.lastLine = i;
  saveStore();
  updateCurrentFromRoute(); /* 同步「正在收听」到其他设备 */
  podUI(p);
  scrollPodLine(i);
  const line = p.lines[i];
  /* 男女声区分：Emma=女声，James=男声 */
  const lineVoice = line.speaker === "emma" ? "female" : (line.speaker === "james" ? "male" : null);
  speak(line.en, {voice: lineVoice, onend: () => {
    if(!podState.playing || podState.id !== p.id || podState.idx !== i) return;
    if(i + 1 < p.lines.length){
      setTimeout(() => {
        if(podState.playing && podState.id === p.id && podState.idx === i) podPlay(p, i + 1);
      }, 420);
    } else {
      podState.playing = false;
      pr.done = true;
      saveStore();
      podUI(p);
      toast("🎉 本期听完，耳朵磨到位了");
    }
  }});
}
function podUI(p){
  const btn = $("#pod-play");
  if(btn){
    btn.textContent = podState.playing ? "⏸" : "▶";
    btn.classList.toggle("playing", podState.playing);
    btn.title = podState.playing ? "暂停" : "从当前句连播";
  }
  const pos = $("#pod-pos");
  if(pos) pos.textContent = `句 ${podState.idx+1} / ${p.lines.length}`;
  $$(".pl-line").forEach(el => el.classList.toggle("cur", +el.dataset.pl === podState.idx));
}
function scrollPodLine(i, smooth){
  const el = document.querySelector(`[data-pl="${i}"]`);
  if(el) el.scrollIntoView({block:"center", behavior: smooth === false ? "auto" : "smooth"});
}

/* ---------- 设置 ---------- */
function openSettings(){
  const old = $(".modal-mask"); if(old) old.remove();
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = `
  <div class="modal">
    <h3>⚙︎ 语音设置</h3>
    <div class="set-row"><span>口音偏好 <span style="font-size:11px;color:var(--gold)">当前：${store.settings.voice === "en-GB" ? "伦敦腔" : "美音"}</span></span>
      <div class="set-opts">
        <button class="chip ${store.settings.voice==="en-GB"?"on":""}" data-v="en-GB">🇬🇧 英音 · 推荐</button>
        <button class="chip ${store.settings.voice==="en-US"?"on":""}" data-v="en-US">🇺🇸 美音</button>
      </div>
    </div>
    <div class="set-row"><span>朗读语速 <b id="rate-val" style="color:var(--green)">${store.settings.rate.toFixed(2)}x</b></span>
      <input type="range" class="rate-slider" min="0.6" max="1.2" step="0.02" value="${store.settings.rate}" id="rate-slider">
    </div>
    <div class="set-row" style="border-bottom:none"><span>试听</span>
      <button class="btn btn-o" id="test-speak">▶ I'd like to make a reservation for four people.</button>
    </div>
    <div class="set-row"><span>📱 学习进度同步</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-o" id="export-progress">📤 导出进度</button>
        <button class="btn btn-o" id="import-progress">📥 导入进度</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
    </div>
    <div class="set-row" style="border-bottom:none"><span>🔄 课程更新</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-o" id="check-update">检查新课程</button>
        <span id="update-status" style="font-size:12px;color:var(--ink3)"></span>
      </div>
    </div>
    <div style="margin-top:18px;display:flex;justify-content:flex-end">
      <button class="btn btn-p" id="close-settings">完成</button>
    </div>
    <p style="font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.7">
      提示：语音朗读与识别由浏览器提供（Chrome / Edge 效果最佳），识别需联网。学习进度${SYNC.online ? "云端多设备同步" : "保存在本机"}。</p>
  </div>`;
  document.body.appendChild(mask);
  mask.addEventListener("click", e => { if(e.target === mask) mask.remove(); });
  mask.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
    store.settings.voice = b.dataset.v;
    store.settings.voiceChosen = true; /* 用户手动切换后不再自动迁移 */
    saveStore();
    mask.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on", x.dataset.v === store.settings.voice));
    /* 立即试听新口音 */
    speak("Good afternoon. This is " + CONFIG.owner + " from " + CONFIG.company + ".");
  }));
  mask.querySelector("#rate-slider").addEventListener("input", e => {
    store.settings.rate = +e.target.value; saveStore();
    mask.querySelector("#rate-val").textContent = store.settings.rate.toFixed(2) + "x";
  });
  mask.querySelector("#test-speak").addEventListener("click", () => speak("Good afternoon. I'd like to make a reservation for four people, please."));
  /* 进度导出 */
  mask.querySelector("#export-progress").addEventListener("click", exportProgress);
  /* 进度导入 */
  mask.querySelector("#import-progress").addEventListener("click", () => mask.querySelector("#import-file").click());
  mask.querySelector("#import-file").addEventListener("change", e => {
    if(e.target.files[0]) importProgress(e.target.files[0]);
  });
  /* 检查课程更新 */
  mask.querySelector("#check-update").addEventListener("click", () => checkCourseUpdate(mask));
  mask.querySelector("#close-settings").addEventListener("click", () => mask.remove());
}

/* 检查课程更新：从远程加载courses.json，对比版本号 */
function checkCourseUpdate(mask){
  const status = mask ? mask.querySelector("#update-status") : null;
  if(status) status.textContent = "正在检查...";
  fetch("courses.json?v=" + Date.now(), {cache:"no-store"})
    .then(r => r.json())
    .then(data => {
      const remoteVer = data.version || "unknown";
      const localVer = store.courseVersion || "none";
      if(remoteVer !== localVer){
        if(status) status.textContent = "发现新版本: " + remoteVer;
        if(confirm("发现新课程更新 (版本 " + remoteVer + ")，是否立即加载？")){
          loadRemoteCourses(data);
          store.courseVersion = remoteVer;
          saveStore();
          toast("✓ 新课程已加载，页面即将刷新");
          setTimeout(() => location.reload(), 1200);
        }
      } else {
        if(status) status.textContent = "已是最新版本 (" + remoteVer + ")";
      }
    })
    .catch(() => {
      if(status) status.textContent = "检查失败，请稍后再试";
    });
}

/* 从远程数据加载课程 */
function loadRemoteCourses(data){
  if(data.courses) window.COURSES = data.courses;
  if(data.podcasts) window.PODCASTS = data.podcasts;
}

/* ---------- 启动 ---------- */
/* 2026-08-30 迁移：用户偏好伦敦腔，统一历史数据为英音（之后可在设置中自行切换） */
function migrateVoicePref(){
  if(store.settings && !store.settings.voiceChosen){
    store.settings.voice = "en-GB";
    store.settings.voiceChosen = true;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  }
}
migrateVoicePref();
/* 微信内置浏览器对网页语音支持差（常见无声原因），引导用户用系统浏览器打开 */
if(/micromessenger/i.test(navigator.userAgent)){
  setTimeout(() => toast("微信内可能无法播放语音：点右上角「···」→ 在浏览器中打开"), 2500);
}
parseHash();
/* 先加载远程课程数据，再渲染页面（支持课程自动更新） */
loadCoursesFromRemote().then(() => {
  render();
  /* 课程加载完成后检查是否有新版本 */
  setTimeout(() => {
    fetch("courses.json?v=" + Date.now(), {cache:"no-store"})
      .then(r => r.json())
      .then(data => {
        if(data.version && data.version !== store.courseVersion){
          if(confirm("📢 发现新课程更新 (版本 " + data.version + ")，是否立即加载？")){
            loadRemoteCourses(data);
            store.courseVersion = data.version;
            saveStore();
            location.reload();
          }
        }
      })
      .catch(() => {});
  }, 3000);
});
/* 麦克风权限只在用户点击麦克风按钮时请求，避免页面加载时不停弹窗 */
function render(){
  if(route.view === "course") renderCourse();
  else if(route.view === "podcasts") renderPodcasts();
  else if(route.view === "podcast") renderPodcast();
  else renderHome();
}

/* 云同步启动：拉取云端进度 → 迁移口音偏好 → 冷启动续学 → 建立 SSE 实时通道 */
if(SYNC.online){
  setSyncStatus("sync");
  pullCloud().then(remote => {
    if(remote){
      const cur = remote.current || null;
      applyRemote(remote);
      /* 云端旧数据可能仍是美音：拉取后再跑一次口音迁移 */
      const needMigrate = !remote.settings || !remote.settings.voiceChosen;
      migrateVoicePref();
      if(needMigrate) saveStore(); /* 把英音偏好推回云端 */
      /* 冷启动自动续学：7 天内在任何设备学过（课程或播客），直接接上 */
      if(cur && (Date.now() - cur.at) < 7 * 86400000 && !location.hash.startsWith("#/course") && !location.hash.startsWith("#/podcast")){
        if(cur.pod && PODCASTS.some(x => x.id === cur.pod)){
          location.hash = "#/podcast/" + cur.pod;
          toast("📍 已接上次收听位置，继续磨耳朵");
        } else if(cur.courseId && COURSES.some(x => x.id === cur.courseId)){
          location.hash = "#/course/" + cur.courseId + "/" + (cur.step || 0);
          toast("📍 已接上次学习位置，继续加油");
        }
      }
    }
    SYNC.booted = true;
    connectSSE();
    pushCloud(); /* 首次把本地数据也推上去（例如云端为空时） */
  });
}
</script>
<script>
/* ========== PWA Service Worker 注册 ========== */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.onupdatefound = () => {
      const nw = reg.installing;
      nw.onstatechange = () => {
        if(nw.state === "installed" && navigator.serviceWorker.controller){
          if(confirm("📢 TradeSpeak 有新版本可用，是否立即更新？")){
            nw.postMessage("skipWaiting");
            location.reload();
          }
        }
      };
    };
  }).catch(() => {});
}

/* ========== 进度同步：导出/导入 ========== */
function exportProgress(){
  const data = localStorage.getItem("tradespeak_v1");
  if(!data){ toast("暂无学习进度可导出"); return; }
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tradespeak-progress-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("✓ 学习进度已导出");
}
function importProgress(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      JSON.parse(e.target.result);
      localStorage.setItem("tradespeak_v1", e.target.result);
      toast("✓ 学习进度已导入，页面即将刷新");
      setTimeout(() => location.reload(), 1200);
    }catch(err){ toast("✗ 文件格式不正确，请选择有效的进度文件"); }
  };
  reader.readAsText(file);
}
</script>
