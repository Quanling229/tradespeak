<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play Speak — Kindergarten & Playground Foreign Trade English</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#faf7f2;color:#2c2418;line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,#4a7c59 0%,#6b9b7a 100%);color:#fff;padding:28px 20px 24px;text-align:center}
.header h1{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:6px}
.header p{font-size:13px;opacity:.92;max-width:600px;margin:0 auto}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e0d4;position:sticky;top:0;z-index:100}
.tab{flex:1;padding:14px 8px;text-align:center;font-size:14px;font-weight:600;color:#8a7a64;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:#4a7c59;border-bottom-color:#4a7c59;background:#f5f0e6}
.tab .emoji{font-size:18px;display:block;margin-bottom:2px}
.container{max-width:900px;margin:0 auto;padding:16px}
.panel{display:none}
.panel.active{display:block}
.section-title{font-size:18px;font-weight:700;color:#4a7c59;margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(74,124,89,.08);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid #f0e8dc}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(74,124,89,.15)}
.card .num{font-size:11px;font-weight:700;color:#fff;background:var(--c,#4a7c59);padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:8px}
.card h3{font-size:15px;font-weight:700;color:#2c2418;margin-bottom:4px}
.card .en{font-size:12px;color:#8a7a64;font-style:italic;margin-bottom:8px}
.card .meta{display:flex;gap:8px;font-size:11px;color:#8a7a64;flex-wrap:wrap}
.card .meta span{background:#f5f0e6;padding:2px 8px;border-radius:8px}
.detail{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:none}
.detail.active{display:block}
.back-btn{background:none;border:none;color:#4a7c59;font-size:14px;cursor:pointer;margin-bottom:16px;font-weight:600}
.detail h2{font-size:22px;color:#4a7c59;margin-bottom:4px}
.detail .en{font-size:14px;color:#8a7a64;font-style:italic;margin-bottom:16px}
.detail h4{font-size:15px;color:#4a7c59;margin:18px 0 10px;border-left:3px solid #4a7c59;padding-left:10px}
.vocab-item{padding:10px;background:#faf7f2;border-radius:8px;margin-bottom:8px}
.vocab-item .word{font-weight:700;color:#2c2418;font-size:15px;cursor:pointer}
.vocab-item .ipa{color:#8a7a64;font-size:12px;margin-left:6px}
.vocab-item .ex{font-size:13px;color:#5a4a38;margin-top:4px}
.vocab-item .cn{font-size:12px;color:#8a7a64}
.expr-basic{padding:10px;background:#f0f7f0;border-radius:8px;margin-bottom:6px;font-size:14px}
.expr-adv{padding:10px;background:#fdf4e3;border-radius:8px;margin-bottom:6px;font-size:14px;border-left:3px solid #d4a843}
.expr-tag{display:inline-block;font-size:10px;background:#4a7c59;color:#fff;padding:1px 6px;border-radius:6px;margin-left:6px}
.expr-adv .expr-tag{background:#d4a843}
.speak-btn{background:#4a7c59;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:6px}
.speak-btn:active{background:#3a6647}
.dialogue-line{padding:10px;margin-bottom:8px;border-radius:8px}
.dialogue-line.you{background:#eef5ee;margin-left:0}
.dialogue-line.client{background:#f5efe6;margin-right:0}
.dialogue-line .speaker{font-size:11px;font-weight:700;color:#4a7c59;margin-bottom:4px}
.dialogue-line.client .speaker{color:#b08a4f}
.dialogue-line .en{font-size:14px;margin-bottom:4px}
.dialogue-line .cn{font-size:12px;color:#8a7a64}
.fill-item{padding:12px;background:#faf7f2;border-radius:8px;margin-bottom:10px}
.fill-item .q{font-size:14px;margin-bottom:8px}
.fill-item input{width:100%;padding:8px;border:1px solid #d4c8b0;border-radius:6px;font-size:14px}
.fill-item .feedback{margin-top:6px;font-size:12px;font-weight:600;display:none}
.fill-item .feedback.ok{color:#4a7c59;display:block}
.fill-item .feedback.no{color:#c2410c;display:block}
.checklist li{padding:6px 0;font-size:14px;list-style:none}
.checklist li::before{content:"\2610 ";color:#4a7c59;margin-right:6px}
.podcast-item{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #f0e8dc}
.podcast-item h3{font-size:16px;color:#4a7c59;margin-bottom:4px}
.podcast-item .en{font-size:12px;color:#8a7a64;font-style:italic;margin-bottom:8px}
.podcast-item .desc{font-size:13px;color:#5a4a38;margin-bottom:10px}
.podcast-line{padding:8px 10px;margin-bottom:6px;border-radius:6px;font-size:13px}
.podcast-line.emma{background:#eef5ee}
.podcast-line.james{background:#f0f4f9}
.podcast-line .sp{font-size:11px;font-weight:700;color:#4a7c59;margin-bottom:2px}
.podcast-line.james .sp{color:#3d5a8f}
.chat-box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-height:400px;display:flex;flex-direction:column}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:12px;margin-bottom:10px;font-size:14px;line-height:1.5}
.chat-msg.ai{background:#f0f7f0;color:#2c2418;align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.user{background:#4a7c59;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg .cn{font-size:12px;opacity:.85;margin-top:4px;display:block}
.chat-input{display:flex;gap:8px;margin-top:12px}
.chat-input input{flex:1;padding:10px;border:1px solid #d4c8b0;border-radius:8px;font-size:14px}
.chat-input button{padding:10px 16px;border:none;border-radius:8px;background:#4a7c59;color:#fff;font-size:14px;cursor:pointer}
.mic-btn{background:#c2410c !important}
.ai-hint{font-size:12px;color:#8a7a64;margin-top:8px;padding:8px;background:#fdf4e3;border-radius:6px;display:none}
.ai-hint.show{display:block}
.small-note{font-size:12px;color:#8a7a64;text-align:center;padding:20px}
.loading{text-align:center;padding:40px;color:#8a7a64}
.footer{text-align:center;padding:30px 20px;font-size:12px;color:#8a7a64}
@media(max-width:600px){.header h1{font-size:22px}.grid{grid-template-columns:1fr}.container{padding:10px}}
</style>
</head>
<body>
<div class="header">
<h1>Play Speak</h1>
<p>Kindergarten &amp; Playground Foreign Trade English — 教玩具外贸英语学习</p>
</div>
<div class="tabs">
<div class="tab active" data-panel="learn"><span class="emoji">School</span>业务场景</div>
<div class="tab" data-panel="podcast"><span class="emoji">Headphone</span>播客磨耳朵</div>
<div class="tab" data-panel="ai"><span class="emoji">Robot</span>AI陪练</div>
</div>
<div class="container">
<div class="panel active" id="panel-learn">
<div class="section-title">20节系统课程</div>
<div id="course-grid" class="grid"><div class="loading">Loading courses...</div></div>
<div id="course-detail" class="detail"></div>
</div>
<div class="panel" id="panel-podcast">
<div class="section-title">播客磨耳朵</div>
<div id="podcast-list"><div class="loading">Loading podcasts...</div></div>
</div>
<div class="panel" id="panel-ai">
<div class="section-title">AI 实战陪练</div>
<div id="ai-intro" class="card" style="margin-bottom:12px">
<h3>选择一节课开始实战</h3>
<p style="font-size:13px;color:#8a7a64;margin-top:6px">点击下方任意课程进入 AI 对话，AI 会扮演客户和你对话。</p>
<div id="ai-course-list" style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px"></div>
</div>
<div id="ai-chat" class="chat-box" style="display:none">
<button class="back-btn" id="ai-back">重新选择课程</button>
<div id="ai-messages"></div>
<div class="ai-hint" id="ai-hint"></div>
<div class="chat-input">
<button class="mic-btn" id="mic-btn" title="Press to speak">Mic</button>
<input type="text" id="ai-text" placeholder="Type your answer here...">
<button id="ai-send">Send</button>
</div>
</div>
</div>
</div>
<div class="footer">Play Speak · Built for Quinn · Kindergarten &amp; Playground Foreign Trade English</div>
<script>
var COURSES=[], PODCASTS=[];
var BASE = 'https://Quanling229.github.io/tradespeak/';
var aiState = {round:0, course:null, recognition:null};

function speak(text){
  try{
    if(!('speechSynthesis' in window)){return;}
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang === 'en-GB' || voices[i].lang.indexOf('en-GB')===0){u.voice=voices[i];break;}
    }
    window.speechSynthesis.speak(u);
  }catch(e){console.log('speak error',e);}
}
if('speechSynthesis' in window){window.speechSynthesis.getVoices();}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.panel).classList.add('active');
  });
});

function loadMaster(){
  fetch(BASE+'ps-courses-index.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(data){
      COURSES = data.courses||[];
      PODCASTS = data.podcasts||[];
      renderCourses();
      renderPodcasts();
      renderAiCourseList();
    })
    .catch(function(e){
      document.getElementById('course-grid').innerHTML='<div class="small-note">Failed to load. Please refresh.</div>';
    });
}

function renderCourses(){
  var g = document.getElementById('course-grid');
  var html = '';
  COURSES.forEach(function(c){
    html += '<div class="card" data-num="'+c.num+'">'+
      '<span class="num" style="--c:'+c.color+'">'+c.num+'</span>'+
      '<h3>'+c.emoji+' '+c.title+'</h3>'+
      '<div class="en">'+c.titleEn+'</div>'+
      '<div class="meta"><span>'+c.scene+'</span><span>'+c.level+'</span><span>'+c.duration+'</span></div>'+
    '</div>';
  });
  g.innerHTML = html;
  g.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click', function(){
      loadCourseDetail(card.dataset.num);
    });
  });
}

function loadCourseDetail(num){
  fetch(BASE+'ps-courses/course-'+num+'.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(c){renderCourseDetail(c);})
    .catch(function(e){alert('Failed to load course');});
}

function renderCourseDetail(c){
  document.getElementById('course-grid').style.display='none';
  var d = document.getElementById('course-detail');
  d.classList.add('active');
  var html = '<button class="back-btn" onclick="backToList()">Back to course list</button>';
  html += '<h2>'+c.emoji+' '+c.title+'</h2>';
  html += '<div class="en">'+c.titleEn+'</div>';
  html += '<p style="font-size:14px;color:#5a4a38;margin-bottom:12px">'+c.intro.background+'</p>';
  html += '<h4>One-liner</h4>';
  html += '<div class="expr-basic"><b>'+c.oneLiner.en+'</b><br><span style="font-size:12px;color:#8a7a64">'+c.oneLiner.cn+'</span><br>'+
    '<button class="speak-btn" onclick="speakText(this)" data-text="'+c.oneLiner.en.replace(/"/g,'&quot;')+'">Play</button></div>';
  html += '<h4>Vocabulary ('+c.vocab.length+')</h4>';
  c.vocab.forEach(function(v){
    html += '<div class="vocab-item">'+
      '<span class="word" onclick="speakText(this)" data-text="'+v.word.replace(/"/g,'&quot;')+'">'+v.word+'</span>'+
      '<span class="ipa">'+v.ipa+'</span>'+
      '<div class="ex">'+v.ex+'</div>'+
      '<div class="cn">'+v.cn+' - '+v.exCn+'</div>'+
    '</div>';
  });
  if(c.mistakes && c.mistakes.length){
    html += '<h4>Common Mistakes</h4>';
    c.mistakes.forEach(function(m){
      html += '<div style="padding:10px;background:#fbe9e7;border-radius:8px;margin-bottom:6px;font-size:13px">'+
        '<div style="color:#c2410c">Wrong: '+m.wrong+'</div>'+
        '<div style="color:#4a7c59;margin-top:4px">Right: '+m.right+'</div>'+
        '<div style="font-size:12px;color:#8a7a64;margin-top:4px">'+m.cn+'</div></div>';
    });
  }
  html += '<h4>Expressions</h4>';
  c.expressions.basic.forEach(function(e){
    html += '<div class="expr-basic"><b>'+e.en+'</b><br><span style="font-size:12px;color:#8a7a64">'+e.cn+'</span>'+
      '<span class="expr-tag">'+e.tag+'</span>'+
      '<button class="speak-btn" onclick="speakText(this)" data-text="'+e.en.replace(/"/g,'&quot;')+'">Play</button></div>';
  });
  if(c.expressions.advanced){
    c.expressions.advanced.forEach(function(e){
      html += '<div class="expr-adv"><b>'+e.en+'</b><br><span style="font-size:12px;color:#8a7a64">'+e.cn+'</span>'+
        '<span class="expr-tag">'+e.tag+'</span>'+
        '<div style="font-size:11px;color:#b08a43;margin-top:4px">From: '+e.from+'</div>'+
        '<button class="speak-btn" onclick="speakText(this)" data-text="'+e.en.replace(/"/g,'&quot;')+'">Play</button></div>';
    });
  }
  if(c.dialogues && c.dialogues.length){
    c.dialogues.forEach(function(dlg){
      html += '<h4>'+dlg.title+'</h4>';
      dlg.lines.forEach(function(ln){
        html += '<div class="dialogue-line '+ln.speaker+'">'+
          '<div class="speaker">'+(ln.speaker==='you'?'You':'Client')+'</div>'+
          '<div class="en">'+ln.en+'</div>'+
          '<div class="cn">'+ln.cn+'</div>'+
          '<button class="speak-btn" onclick="speakText(this)" data-text="'+ln.en.replace(/"/g,'&quot;')+'">Play</button></div>';
      });
    });
  }
  if(c.exercises){
    html += '<h4>Mini Exercises</h4>';
    c.exercises.fillBlank.forEach(function(f,i){
      html += '<div class="fill-item" data-answer="'+f.a.toLowerCase().replace(/"/g,'&quot;')+'">'+
        '<div class="q">'+(i+1)+'. '+f.q+'</div>'+
        '<input type="text" placeholder="Type your answer...">'+
        '<button class="speak-btn check-btn" style="margin-top:6px">Check Answer</button>'+
        '<div class="feedback"></div>'+
        '<div style="font-size:11px;color:#8a7a64;margin-top:4px">Hint: '+f.hint+'</div></div>';
    });
    if(c.exercises.scenario){
      c.exercises.scenario.forEach(function(s){
        html += '<div class="fill-item" style="background:#eef5ee">'+
          '<div class="q"><b>Scenario:</b> '+s.q+'</div>'+
          '<button class="speak-btn reveal-btn" style="margin-top:6px">Reveal Model Answer</button>'+
          '<div class="model-answer" style="display:none;margin-top:8px;font-size:13px;background:#fff;padding:8px;border-radius:6px">'+
          '<div><b>EN:</b> '+s.modelAnswer+'</div>'+
          '<div style="font-size:12px;color:#8a7a64;margin-top:4px">'+s.cn+'</div></div></div>';
      });
    }
  }
  if(c.checklist && c.checklist.length){
    html += '<h4>Self-check</h4><ul class="checklist">';
    c.checklist.forEach(function(ck){html += '<li>'+ck+'</li>';});
    html += '</ul>';
  }
  if(c.culture){
    html += '<h4>Culture Note</h4>';
    html += '<div style="padding:12px;background:#fdf4e3;border-radius:8px;font-size:13px">'+
      '<b>'+c.culture.title+'</b><br><span style="margin-top:6px;display:block">'+c.culture.content+'</span></div>';
  }
  d.innerHTML = html;
  window.scrollTo(0,0);
  d.querySelectorAll('.check-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var item = btn.parentElement;
      var ans = item.dataset.answer;
      var val = item.querySelector('input').value.trim().toLowerCase();
      var fb = item.querySelector('.feedback');
      if(val === ans){fb.textContent='Correct!';fb.className='feedback ok';}
      else{fb.textContent='Not quite. Correct answer: '+ans;fb.className='feedback no';}
    });
  });
  d.querySelectorAll('.reveal-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var m = btn.parentElement.querySelector('.model-answer');
      m.style.display = (m.style.display==='none'?'block':'none');
    });
  });
}

function speakText(btn){
  var text = btn.dataset.text;
  speak(text);
}

function backToList(){
  document.getElementById('course-detail').classList.remove('active');
  document.getElementById('course-detail').innerHTML='';
  document.getElementById('course-grid').style.display='grid';
  window.scrollTo(0,0);
}

function renderPodcasts(){
  var l = document.getElementById('podcast-list');
  var html = '';
  PODCASTS.forEach(function(p){
    html += '<div class="podcast-item" data-num="'+p.num+'">'+
      '<h3>Episode '+p.num+' - '+p.title+'</h3>'+
      '<div class="en">'+p.titleEn+'</div>'+
      '<div class="desc">'+p.desc+'</div>'+
      '<button class="speak-btn play-pod" data-num="'+p.num+'" style="background:#3d5a8f">Play Full Episode</button>'+
      '<button class="speak-btn stop-pod" style="background:#888;margin-left:6px">Stop</button>'+
      '<div class="podcast-lines" style="margin-top:10px;display:none"></div>'+
    '</div>';
  });
  l.innerHTML = html;
  l.querySelectorAll('.play-pod').forEach(function(btn){
    btn.addEventListener('click', function(){playPodcast(btn.dataset.num);});
  });
  l.querySelectorAll('.stop-pod').forEach(function(btn){
    btn.addEventListener('click', function(){
      if('speechSynthesis' in window){window.speechSynthesis.cancel();}
    });
  });
}

function playPodcast(num){
  fetch(BASE+'ps-podcasts/podcast-'+num+'.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(p){
      var container = document.querySelector('.podcast-item[data-num="'+num+'"] .podcast-lines');
      var html = '';
      p.lines.forEach(function(ln,i){
        html += '<div class="podcast-line '+ln.speaker+'">'+
          '<div class="sp">'+(ln.speaker==='emma'?'Emma':'James')+'</div>'+
          '<div>'+ln.en+'</div>'+
          '<div style="font-size:11px;color:#8a7a64">'+ln.cn+'</div></div>';
      });
      container.innerHTML = html;
      container.style.display = 'block';
      speakSequence(p.lines.map(function(l){return l.en;}));
    });
}

function speakSequence(texts, idx){
  if(idx === undefined) idx = 0;
  if(idx >= texts.length){return;}
  if(!('speechSynthesis' in window)){return;}
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(texts[idx]);
  u.lang = 'en-US';
  u.rate = 0.92;
  var voices = window.speechSynthesis.getVoices();
  for(var i=0;i<voices.length;i++){
    if(voices[i].lang==='en-GB' || voices[i].lang.indexOf('en-GB')===0){u.voice=voices[i];break;}
  }
  u.onend = function(){
    setTimeout(function(){speakSequence(texts, idx+1);}, 400);
  };
  window.speechSynthesis.speak(u);
}

function renderAiCourseList(){
  var l = document.getElementById('ai-course-list');
  var html = '';
  COURSES.forEach(function(c){
    html += '<div class="card" style="padding:10px;cursor:pointer" data-num="'+c.num+'">'+
      '<div style="font-size:11px;color:#8a7a64">'+c.num+'</div>'+
      '<div style="font-size:13px;font-weight:600">'+c.emoji+' '+c.title+'</div></div>';
  });
  l.innerHTML = html;
  l.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click', function(){startAiPractice(card.dataset.num);});
  });
}

function startAiPractice(num){
  fetch(BASE+'ps-courses/course-'+num+'.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(c){
      document.getElementById('ai-intro').style.display='none';
      document.getElementById('ai-chat').style.display='flex';
      aiState.course = c;
      aiState.round = 0;
      var msgs = document.getElementById('ai-messages');
      msgs.innerHTML = '';
      addMsg('ai', c.aiPractice.situation, 'Situation');
      addMsg('ai', c.aiPractice.role, 'Your role: '+c.aiPractice.role);
      setTimeout(function(){aiNext();}, 600);
    });
}

function addMsg(type, en, cn){
  var msgs = document.getElementById('ai-messages');
  var div = document.createElement('div');
  div.className = 'chat-msg '+type;
  div.innerHTML = en + (cn?'<span class="cn">'+cn+'</span>':'');
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function aiNext(){
  if(!aiState.course) return;
  var rounds = aiState.course.aiPractice.rounds;
  if(aiState.round >= rounds.length){
    addMsg('ai', 'Great job! You have completed this scenario.', 'Done!');
    return;
  }
  var r = rounds[aiState.round];
  addMsg('ai', r.ai, r.cn);
  speak(r.ai);
  var hint = document.getElementById('ai-hint');
  hint.innerHTML = 'Hint: '+r.hint;
  hint.classList.add('show');
  aiState.currentRound = r;
  aiState.round++;
}

function aiSend(){
  var input = document.getElementById('ai-text');
  var text = input.value.trim();
  if(!text) return;
  addMsg('user', text, '');
  input.value = '';
  var r = aiState.currentRound;
  if(!r){return;}
  var lower = text.toLowerCase();
  var matched = false;
  try{
    if(r.patterns){
      var p = new RegExp(r.patterns.replace(/^\//,'').replace(/\/[a-z]*$/,''), 'i');
      if(p.test(lower)) matched = true;
    }
  }catch(e){}
  if(!matched){
    try{
      if(r.partial){
        var pp = new RegExp(r.partial.replace(/^\//,'').replace(/\/[a-z]*$/,''), 'i');
        if(pp.test(lower)) matched = true;
      }
    }catch(e){}
  }
  setTimeout(function(){
    if(matched){
      addMsg('ai', 'Good answer! '+r.ai, 'Nice!');
    } else {
      addMsg('ai', 'Not quite. Think about: '+r.hint, 'Try again: '+r.hint);
    }
    setTimeout(function(){aiNext();}, 800);
  }, 500);
}

document.getElementById('ai-send').addEventListener('click', aiSend);
document.getElementById('ai-text').addEventListener('keydown', function(e){
  if(e.key==='Enter') aiSend();
});
document.getElementById('ai-back').addEventListener('click', function(){
  document.getElementById('ai-chat').style.display='none';
  document.getElementById('ai-intro').style.display='block';
  if('speechSynthesis' in window){window.speechSynthesis.cancel();}
});

var micBtn = document.getElementById('mic-btn');
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  aiState.recognition = new SR();
  aiState.recognition.lang = 'en-US';
  aiState.recognition.continuous = false;
  aiState.recognition.interimResults = false;
  micBtn.addEventListener('click', function(){
    try{aiState.recognition.start();}catch(e){}
  });
  aiState.recognition.onresult = function(e){
    var text = e.results[0][0].transcript;
    document.getElementById('ai-text').value = text;
    aiSend();
  };
  aiState.recognition.onerror = function(e){
    alert('Mic error: '+e.error+'. Type your answer instead.');
  };
} else {
  micBtn.style.display = 'none';
}

loadMaster();
</script>
</body>
